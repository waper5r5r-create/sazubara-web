<html lang="ko">
<head>
<meta charset="utf-8">

<title>사주바라 — 나의 사주, 오늘의 흐름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 고정 헤더 + 스크롤 콘텐츠 + 하단 고정 3탭 바를 가진 모바일 앱 셸.
   웹툰 포스터풍 다크 테마 — 짙은 자정 보라 배경 + 비비드 마젠타 액센트. */
:root{
  --bg:#070b1c; --surface:#0f1630; --surface-2:#16204a; --surface-3:#1c2b5e;
  --fg:#eef1fb; --fg-muted:#a7afc9; --fg-faint:#7a84a3;
  --accent:#ffd43b; --accent-ink:#000000; --accent-soft:rgba(255,212,59,0.18);
  --gold:#e0ad55; --gold-ink:#201604; --gold-soft:#3a2d12;
  --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.24);
  --shadow:0 8px 28px rgba(0,0,0,0.5);
  --el-wood:#44a386; --el-fire:#b12c00; --el-earth:#ab7400; --el-metal:#006e9a; --el-water:#7552db;
  --good:#4fcf7c; --bad:#ff6b6b;
  --font-display:'Black Han Sans',serif; --font-body:'Noto Sans KR',sans-serif; --font-heading:'Noto Sans KR',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font-body); line-height:1.62; -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:var(--font-heading); font-weight:700; text-wrap:balance; margin:0;}
p{margin:0;}
button{font-family:var(--font-body);}
img{max-width:100%;}
[hidden]{display:none!important;}
.app{
  max-width:480px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column;
}
/* ---------- 헤더 ---------- */
.app-header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding:12px 20px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--border);
}
.app-header .title-col{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1;}
.app-header .mark{font-family:var(--font-heading); font-weight:700; font-size:1.32rem; letter-spacing:0; flex:none; line-height:1.2; background:linear-gradient(135deg,#ffe066,#ffaa00); -webkit-background-clip:text; background-clip:text; color:transparent;}
.brand-mark{display:flex; align-items:center; gap:6px;}
.brand-ic{width:24px; height:24px; flex:none; display:block; position:relative;}
.brand-ic::before{
  content:''; position:absolute; inset:-7px; border-radius:50%; z-index:-1;
  background:radial-gradient(circle, rgba(255,212,59,.4), transparent 72%);
}
.brand-ic svg{width:100%; height:100%; display:block; position:relative;}
.app-header .sub{font-size:.74rem; color:var(--fg-muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left:30px;}
.header-actions{display:flex; align-items:center; gap:8px; flex:none;}
/* ---------- 콘텐츠 ---------- */
.content{flex:1; padding:18px 20px 28px; display:flex; flex-direction:column; gap:16px;}
.view{display:flex; flex-direction:column; gap:16px;}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 42%), var(--surface);
  border:1px solid var(--border); border-radius:18px;
  padding:20px 18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px; min-width:0;
}
.card.flat{box-shadow:none;}
   #c-b-kakao-pane{display:flex; flex-direction:column; gap:10px;}
.section-title{font-family:var(--font-heading); font-weight:700; font-size:1.06rem;}
.section-desc{font-size:.82rem; color:var(--fg-muted); line-height:1.65;}
.wx-badge{width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 0 3px rgba(255,255,255,0.06);}
.eyebrow{
  font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:700;
}
/* ---------- 폼 ---------- */
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:.82rem; font-weight:500; color:var(--fg-muted);}
.field input[type="text"], .field input[type="date"], .field input[type="time"], .field select{
  appearance:none; width:100%; border:1px solid var(--border-strong); border-radius:12px;
  background:var(--surface-2); color:var(--fg); padding:11px 12px; font-size:.95rem; font-family:var(--font-body);
}
.field input:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
.seg{display:flex; border:1px solid var(--border-strong); border-radius:12px; overflow:hidden;}
.seg button{
  flex:1; padding:10px 8px; background:var(--surface-2); color:var(--fg-muted); border:none;
  font-size:.88rem; font-weight:500; cursor:pointer; min-width:0;
}
.seg button.active{background:var(--accent); color:var(--accent-ink); font-weight:700;}
.check-row{display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--fg-muted);}
.check-row input{width:17px; height:17px; accent-color:var(--accent);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.hint{font-size:.74rem; color:var(--fg-faint);}
.btn-primary{
  width:100%; padding:14px; border-radius:14px; border:none; background:var(--accent); color:var(--accent-ink);
  font-size:1rem; font-weight:700; font-family:var(--font-body); cursor:pointer; letter-spacing:0;
  box-shadow:0 6px 20px rgba(224,173,85,.28); transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.btn-primary:active{opacity:.85; transform:scale(.98); box-shadow:0 2px 8px rgba(224,173,85,.22);}
.btn-primary:disabled{background:var(--surface-3); color:var(--fg-faint); box-shadow:none; cursor:not-allowed;}
.btn-secondary{
  width:100%; padding:12px; border-radius:14px; border:1px solid var(--border-strong); background:transparent;
  color:var(--fg); font-size:.9rem; font-weight:600; cursor:pointer;
}
.btn-link{background:none; border:none; color:var(--accent); font-weight:700; font-size:.85rem; padding:4px 0; cursor:pointer; text-align:left;}
/* ---------- 탭바 ---------- */
.tabs-bar{
  position:sticky; bottom:0; z-index:20; display:flex;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--surface); border-top:1px solid var(--border);
  max-width:480px; margin:0 auto; width:100%;
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
  background:none; border:none; color:var(--fg-faint); font-size:.72rem; font-weight:600; cursor:pointer;
}
.tab-btn .ico{width:22px; height:22px;}
.tab-btn.active{color:var(--accent);}
.tab-btn.active .ico{filter:none;}
/* ---------- 사주 기둥 ---------- */
.pillars{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.pillars.no-time{grid-template-columns:repeat(3,1fr);}
.pillar{
  display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 5px;
  background:var(--surface-2); border-radius:14px; min-width:0;
  border-top:3px solid var(--pillar-color,transparent);
}
.pillar-day{
  background:linear-gradient(165deg,var(--surface-3),var(--surface-2));
  box-shadow:0 0 0 1.5px var(--accent) inset;
}
.pillar-day .label{color:var(--accent);}
.pillar .label{font-size:.68rem; color:var(--fg-muted); font-weight:600;}
.pillar .hanja{font-family:var(--font-display); font-size:1.5rem; font-weight:700; line-height:1.15;}
.pillar .hangul{font-size:.76rem; color:var(--fg-muted);}
.pillar .wx{display:flex; gap:3px; margin-top:2px;}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none;}
/* ---------- 오행 범례/차트 ---------- */
.wx-chart-row{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.wx-donut-wrap{position:relative; width:92px; height:92px; flex:none;}
.wx-donut-wrap svg{position:absolute; inset:0;}
.wx-donut-center{
  position:absolute; inset:14px; border-radius:50%; background:var(--surface);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px;
}
.wx-donut-center .gan{font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--fg);}
.wx-donut-center .lb{display:inline-flex; align-items:center; gap:4px; font-size:.62rem; color:var(--fg-muted);}
.legend{display:flex; flex-direction:column; gap:11px; flex:1; min-width:140px;}
.legend-item{display:flex; align-items:center; gap:8px; font-size:.82rem;}
.legend-item .nm{flex:1; color:var(--fg);}
.legend-item .ct{color:var(--fg-muted); font-variant-numeric:tabular-nums;}
.wx-balance-row{display:flex; gap:9px; flex-wrap:wrap; margin-top:12px;}
.wx-balance-chip{
  display:inline-flex; align-items:center; gap:6px; font-size:.76rem; font-weight:700; padding:6px 12px; border-radius:999px;
  background:var(--chip-soft,var(--surface-2)); color:var(--fg);
}
.wx-balance-chip.muted{background:var(--surface-2); color:var(--fg-muted); font-weight:600;}
/* ---------- 게이지/진행바 ---------- */
.gauge{position:relative; height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden;}
.gauge > i{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:6px;}
.gauge-labels{display:flex; justify-content:space-between; font-size:.72rem; color:var(--fg-faint);}
/* ---------- 뱃지 ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px;
  background:var(--surface-2); font-size:.78rem; font-weight:600; border:1px solid var(--border);
}
.ss-table{display:flex; flex-direction:column; gap:10px;}
.ss-row{display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border-radius:12px; background:var(--surface-2); font-size:.86rem;}
.ss-row .pos{flex:none; color:var(--accent-ink); background:var(--accent); font-size:.68rem; font-weight:700; border-radius:999px; padding:3px 9px; margin-top:1px;}
.ss-row .nm{font-weight:700; width:48px; flex:none; padding-top:1px;}
.ss-row .desc{color:var(--fg-muted); font-size:.80rem; min-width:0; line-height:1.5;}
.empty-state{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding:40px 12px;}
.empty-state .big-ico{font-size:2.4rem;}
.disclaimer{font-size:.73rem; color:var(--fg-faint); line-height:1.6; padding-top:4px; border-top:1px solid var(--border);}
/* ---------- 오늘의 운세 ---------- */
.today-date{font-size:.84rem; color:var(--fg-muted);}
.today-ganzhi-panel{
  display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px; margin-top:4px;
  background:linear-gradient(135deg,var(--surface-3),var(--surface-2));
}
.today-ganzhi{display:flex; align-items:center; gap:10px;}
.today-ganzhi .hanja{font-family:var(--font-display); font-size:2.3rem; font-weight:700; line-height:1;}
.fortune-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.fortune-tile{
  background:var(--surface-2); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:6px; min-width:0;
  border-top:2.5px solid var(--tile-color,var(--accent));
}
.fortune-tile .ttl{font-size:.76rem; font-weight:700; color:var(--tile-color,var(--accent));}
.fortune-tile .body{font-size:.80rem; color:var(--fg); min-width:0;}
.lucky-row{display:flex; gap:10px;}
.lucky-chip{flex:1; background:var(--surface-3); border-radius:12px; padding:12px 10px; text-align:center; min-width:0; display:flex; flex-direction:column; gap:4px; align-items:center;}
.lucky-chip .ic{font-size:1.2rem;}
.lucky-chip .k{font-size:.68rem; color:var(--fg-muted);}
.lucky-chip .v{font-size:.84rem; font-weight:700; margin-top:1px;}
/* ---------- 궁합 ---------- */
.compat-people{display:flex; align-items:center; justify-content:center; gap:14px;}
.person-chip{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.8rem; min-width:0;}
.person-chip .av{
  width:46px; height:46px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center;
  justify-content:center; font-family:var(--font-body); font-weight:700; font-size:1.1rem; border:2px solid var(--border-strong);
  overflow:hidden;
}
.person-chip .av img{width:100%; height:100%; object-fit:cover; display:block;}
.compat-plus{color:var(--fg-faint); font-size:1.1rem;}
.score-ring-wrap{display:flex; flex-direction:column; align-items:center; gap:8px;}
.score-ring-outer{position:relative; width:128px; height:128px; display:flex; align-items:center; justify-content:center;}
.score-ring-outer::before{
  content:''; position:absolute; inset:-16px; border-radius:50%; opacity:.38; filter:blur(3px);
  background:radial-gradient(circle, var(--tier-color,var(--accent)) 0%, transparent 72%);
}
.score-ring-wrap .num{font-family:var(--font-body); font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums;}
.score-ring-wrap .lbl{font-size:.72rem; color:var(--fg-muted);}
.tier-chip{font-size:.76rem; font-weight:700; padding:4px 14px; border-radius:999px; display:inline-flex; align-items:center; gap:4px;}
.sub-scores{display:flex; flex-direction:column; gap:10px;}
.sub-score-row{display:flex; align-items:center; gap:10px; font-size:.82rem;}
.sub-score-row .nm{width:64px; flex:none; font-weight:600; color:var(--fg-muted);}
.sub-score-row .gauge{flex:1;}
.sub-score-row .pct{width:34px; flex:none; text-align:right; font-variant-numeric:tabular-nums; font-weight:700;}
.rel-line{display:flex; gap:8px; font-size:.84rem; align-items:flex-start;}
.rel-line .tag{flex:none; font-weight:700; color:var(--accent); font-size:.78rem; white-space:nowrap; padding-top:.1em;}
hr.sep{border:none; border-top:1px solid var(--border); margin:0;}
/* ---------- 마이룸 ---------- */
.myroom-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.myroom-count{font-size:.76rem; color:var(--fg-muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
.myroom-head-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.seg-sm{border-radius:9px;}
.seg-sm button{padding:5px 10px; font-size:.74rem;}
.myroom-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.myroom-card{
  position:relative; background:linear-gradient(165deg,var(--surface-2),var(--surface-3)); border-radius:16px; padding:14px 12px 12px;
  display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; min-width:0;
  border:1px solid var(--border); overflow:hidden; cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
}
.myroom-card:active{transform:scale(.96);}
.myroom-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.myroom-card:hover{box-shadow:0 5px 18px -6px var(--tier-color,var(--accent)), 0 2px 10px rgba(0,0,0,.08);}
.myroom-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:5px; background:var(--tier-color,var(--accent));
  box-shadow:0 2px 10px -1px var(--tier-color,var(--accent));
}
.myroom-card .av{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-body); font-weight:700; font-size:1.05rem; color:#fff; background:var(--tier-color,var(--accent));
  margin-top:4px; flex:none; box-shadow:0 0 0 4px var(--tier-soft,var(--surface-3)), 0 4px 12px -4px var(--tier-color,var(--accent));
}
.myroom-card .nm{font-weight:700; font-size:.88rem; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.myroom-card .sc{font-size:.72rem; color:var(--fg-muted); font-variant-numeric:tabular-nums;}
.myroom-score-bar{width:100%; height:5px; border-radius:999px; background:var(--surface-3); overflow:hidden; box-shadow:inset 0 0 0 1px var(--border);}
.myroom-score-fill{height:100%; border-radius:999px; background:var(--tier-color,var(--accent)); transition:width .3s ease;}
.myroom-badge{
  display:inline-flex; align-items:center; gap:4px; font-size:.7rem; font-weight:700; padding:3px 9px; border-radius:999px;
  background:var(--tier-soft,var(--surface-3)); color:var(--tier-color,var(--accent)); border:1px solid var(--tier-color,var(--accent));
}
.myroom-empty{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; padding:22px 10px; color:var(--fg-muted); font-size:.85rem;}
.myroom-empty-ill{width:84px; height:84px; border-radius:20px; display:block;}
.myroom-card .owner-tag{
  position:absolute; top:7px; left:8px; font-size:.6rem; font-weight:700; color:var(--fg-faint);
  background:var(--surface); border-radius:999px; padding:2px 7px; max-width:calc(100% - 16px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.myroom-sparkle{position:absolute; top:6px; right:8px; font-size:.95rem; animation:myroomTwinkle 1.6s ease-in-out infinite;}
.myroom-new{
  position:absolute; top:7px; left:8px; font-size:.6rem; font-weight:800; letter-spacing:.3px; color:#1c1406;
  background:var(--accent); border-radius:999px; padding:2px 7px;
}
@keyframes myroomTwinkle{0%,100%{opacity:.4; transform:scale(.9);}50%{opacity:1; transform:scale(1.15);}}
.myroom-card.is-legend{border-color:var(--tier-color,var(--accent)); box-shadow:0 0 0 1px var(--tier-color,var(--accent)), 0 4px 16px -4px var(--tier-color,var(--accent));}
.myroom-card.is-preview{width:100%; max-width:220px; margin:0 auto; padding:18px 16px 16px; gap:8px; cursor:default; flex-shrink:0;}
.myroom-card.is-preview:hover, .myroom-card.is-preview:active{box-shadow:0 0 0 1px var(--tier-color,var(--accent)), 0 4px 16px -4px var(--tier-color,var(--accent)); transform:none;}
.myroom-card.is-preview .nm{font-size:.92rem;}
.myroom-delete-btn{
  width:100%; padding:11px; border-radius:12px; border:1px solid rgba(224,90,90,.35); background:rgba(224,90,90,.08);
  color:var(--bad); font-size:.85rem; font-weight:700; cursor:pointer;
}
/* ---- 마이룸 카드 프레임(꾸미기, 크레딧 소비) ---- */
.myroom-card[data-frame]::after{
  content:''; position:absolute; inset:0; border-radius:16px; pointer-events:none;
  border:2px solid var(--frame-color,transparent); box-shadow:0 0 0 3px var(--frame-soft,transparent), 0 0 16px var(--frame-soft,transparent);
}
.myroom-card[data-frame="holo"]::after{
  border-color:rgba(255,255,255,.55);
  background:linear-gradient(115deg, rgba(255,120,180,0) 0%, rgba(255,210,120,.35) 18%, rgba(140,220,255,.35) 36%, rgba(190,140,255,.35) 54%, rgba(255,120,180,0) 72%);
  background-size:220% 220%;
  animation:myroomHolo 3.2s linear infinite;
  box-shadow:0 0 0 2px rgba(255,255,255,.4), 0 0 18px rgba(200,180,255,.35);
}
@keyframes myroomHolo{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
@media (prefers-reduced-motion: reduce){ .myroom-card[data-frame="holo"]::after{ animation:none; } }
.frame-picker{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.frame-swatch{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px 8px;
  border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; min-width:0;
}

/* ---- 일러스트 상세 리포트 ---- */
.report-grid{display:flex; flex-direction:column; gap:14px;}
.report-card{

.report-card .report-cover{

}

.report-card::after{

.report-card .report-play{

}
.report-card .report-text{

}
.report-card .nm{font-family:var(--font-body); font-weight:700; font-size:1.08rem; color:#fff; text-shadow:0 1px 8px rgba(0,0,0,.45); text-wrap:balance; line-height:1.3;}
.report-card .tagline{font-size:.76rem; color:rgba(255,255,255,.84); line-height:1.35;}

.report-cost-badge{

.report-cost-badge.unlocked{color:#fff; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.32);}
/* 이야기 리포트 — 팝업(바텀시트)이 아니라 전체 화면 전용 페이지(.report-page)로 열리고,
   본문도 "글이 메인, 이미지는 부속"이 아니라 이미지가 화면을 꽉 채우며 쭉 이어지는 웹툰형
   스크롤로 구성한다. 이미지가 있는 섹션은 풀블리드 패널로, 이미지가 없는(아직 준비 안 된)
   섹션은 나레이션 박스처럼 작게 묶어서 "이미지 빠진 느낌"이 아니라 의도된 캡션처럼 보이게 한다. */
.report-page{
  overscroll-behavior-y:contain; touch-action:pan-y;
  position:fixed; inset:0; z-index:45; max-width:480px; margin:0 auto;
  background:var(--surface); overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column;
}
.report-page-topbar{
  position:sticky; top:0; z-index:3; flex:none; display:flex; align-items:center; gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:linear-gradient(to bottom, rgba(7,11,28,.88), rgba(7,11,28,.88) 65%, transparent);
}
.report-page-back{
  width:32px; height:32px; border-radius:50%; border:none; flex:none; padding:0;
  display:flex; align-items:center; justify-content:center; font-size:1.25rem; line-height:1;
  background:rgba(255,255,255,.16); color:#fff; cursor:pointer;
}
.report-page-topbar-title{
  font-size:.86rem; font-weight:700; color:#fff; opacity:.92;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.report-page-hero{position:relative; width:100%; aspect-ratio:4/5; overflow:hidden; flex:none; background:var(--surface-2); margin-top:-48px;}
.report-page-hero.no-img{background:linear-gradient(145deg, var(--surface-2), var(--surface-3));}
.report-page-hero img{width:100%; height:100%; object-fit:cover; display:block;}
.report-page-hero-grad{position:absolute; left:0; right:0; bottom:0; height:60%; background:linear-gradient(to bottom, transparent, rgba(7,11,28,.94));}
.report-page-hero-text{position:absolute; left:20px; right:20px; bottom:18px;}
.report-page-eyebrow{font-size:.72rem; font-weight:700; color:var(--accent); letter-spacing:.04em; margin:0 0 5px;}
.report-page-title{font-size:1.3rem; font-weight:800; color:#fff; margin:0; line-height:1.32; text-wrap:balance;}
.report-page-body{padding:24px 20px calc(30px + env(safe-area-inset-bottom,0px));}
.report-article{display:flex; flex-direction:column; gap:26px;}
.report-section{position:relative;}
.report-section-img{
  display:block; width:calc(100% + 40px); margin:0 -20px 12px; aspect-ratio:4/3; overflow:hidden; background:var(--surface-2);
}
.report-section-img img{width:100%; height:100%; object-fit:cover; display:block;}
.report-caption{font-size:.92rem; line-height:1.85; color:var(--fg); margin:0;}
/* 아직 이미지가 없는 섹션은 작은 나레이션 박스로 묶어서, 글도 짧게 끊어 보이고 "컷 사이 설명"
   처럼 읽히게 한다 — 화면 전체를 글로 채우지 않는다. */
.report-section:not(.has-img){background:var(--surface-2); border-radius:14px; padding:16px 18px;}
.report-section:not(.has-img) .report-caption{font-size:.88rem; line-height:1.78; color:var(--fg-muted);}
/* 잠긴 뒷부분은 통째로 숨기지 않고 실제 글/이미지를 보여주다가 아래로 갈수록 배경색으로 서서히
   흐려지게(gradient fade) 해서, "이 아래로도 진짜 이야기가 더 있다"는 느낌을 준다. */
.report-article-fade-wrap{position:relative; max-height:420px; overflow:hidden; margin-top:-4px;}
.report-article-fade-wrap::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:200px;
  background:linear-gradient(to bottom, transparent, var(--surface) 92%); pointer-events:none;
}
.report-callout{border-radius:14px; padding:18px 20px; text-align:center;}
   .report-callout .report-caption{font-size:.9rem; line-height:1.8; margin:0;}
   .report-callout.formal{
        background:linear-gradient(160deg, rgba(255,212,59,.14), rgba(255,212,59,.04));
        border:1px solid rgba(255,212,59,.38);
   }
   .report-callout.formal .report-caption{color:var(--fg); letter-spacing:.01em;}
   .report-callout.warning{
        background:rgba(255,93,93,.09);
        border:1px solid rgba(255,93,93,.4);
   }
   .report-callout.warning .report-caption{color:#ffd0d0;}.report-caption + .report-caption{margin-top:12px;}.report-section.has-img .report-caption:not(:first-child){margin-top:12px;}
   .mini-teaser-card{
        display:flex; gap:12px; align-items:flex-start; padding:14px 16px;
        background:var(--surface-2); border-radius:14px; border:1px dashed var(--border-strong);
   }
   .mini-teaser-card .mini-teaser-lock{font-size:1.1rem; flex:none; line-height:1.4;}
   .mini-teaser-title{font-size:.84rem; font-weight:700; color:var(--fg); margin:0 0 6px;}
   .mini-teaser-list{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px;}
   .mini-teaser-list li{font-size:.78rem; color:var(--fg-muted); padding-left:16px; position:relative;}
   .mini-teaser-list li::before{content:'✓'; position:absolute; left:0; color:var(--accent); font-weight:700;}
   .review-strip{display:flex; flex-direction:column; gap:12px;}
      #report-panel-list .mini-teaser-card, #report-panel-list .review-strip, #report-panel-list .locked-card, #report-panel-list .share-btn{margin-top:22px;}

.review-stars{color:var(--accent); font-size:.86rem; letter-spacing:1px;}
.review-score{font-weight:700; font-size:.92rem;}
.review-count{font-size:.74rem; color:var(--fg-muted);}

.review-item{background:var(--surface-2); border-radius:12px; padding:13px 14px;}
.review-item-head{display:flex; align-items:center; gap:6px; margin-bottom:8px;}

.report-admin-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border);}

.report-edit-img-row{display:flex; align-items:center; gap:12px;}
.report-edit-img-row .report-admin-thumb{width:56px; height:56px; font-size:1.3rem;}
/* ---- 결과 공개(reveal) 연출 ---- */
.reveal-overlay{
  position:fixed; inset:0; z-index:500;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 42%, rgba(35,29,20,.97) 0%, rgba(13,17,32,.99) 72%);
  opacity:0; transition:opacity .4s ease;
}
.reveal-overlay.show{opacity:1;}
.reveal-overlay.hide{opacity:0; pointer-events:none;}
.reveal-inner{display:flex; flex-direction:column; align-items:center; gap:16px; padding:0 30px; text-align:center;}
.reveal-mark{width:54px; height:54px; position:relative;}
.reveal-mark svg{width:100%; height:100%; animation:revealSpin 2.4s linear infinite; display:block;}
.reveal-mark::after{content:''; position:absolute; inset:-16px; border-radius:50%; background:radial-gradient(circle, rgba(224,173,85,.38), transparent 70%); animation:revealPulse 1.7s ease-in-out infinite;}
.reveal-txt{font-family:var(--font-body); font-weight:700; font-size:1.02rem; line-height:1.6; color:#f3e6c8; letter-spacing:0;}
.reveal-sub{font-size:.8rem; color:rgba(255,255,255,.52);}
.reveal-dots span{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--accent); margin:0 3px; opacity:.35; animation:revealDot 1.2s ease-in-out infinite;}
.reveal-dots span:nth-child(2){animation-delay:.15s;}
.reveal-dots span:nth-child(3){animation-delay:.3s;}
@keyframes revealSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@keyframes revealPulse{0%,100%{opacity:.45; transform:scale(.88);}50%{opacity:1; transform:scale(1.18);}}
@keyframes revealDot{0%,80%,100%{opacity:.3; transform:translateY(0);}40%{opacity:1; transform:translateY(-3px);}}
.reveal-fadeup{animation:revealFadeUp .6s cubic-bezier(.22,.9,.32,1) both;}
@keyframes revealFadeUp{0%{opacity:0; transform:translateY(16px);}100%{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){
  .reveal-mark svg, .reveal-mark::after, .reveal-dots span, .reveal-fadeup{animation:none;}
}

          <p class="eyebrow">내 사주 속, 아직 몰랐던 이야기</p>
          <h1 class="section-title">나는 어떤 사람일까?</h1>
          <p class="section-desc">생년월일만 알려주면 돼요. 타고난 성격부터 숨겨진 기운, 오늘의 흐름까지 무료로 풀어드려요.</p>
        </div>

        <div class="field">
          <label for="f-name">이름 <span class="hint">(선택)</span></label>
          <input type="text" id="f-name" placeholder="이름을 입력해주세요 (예: 홍길동)" maxlength="12" autocomplete="name" aria-describedby="name-help">
          <p class="hint" id="name-help">풀이를 볼 분의 이름을 입력해주세요. 이름은 호칭에만 사용해요. 한자·획수를 보는 성명학은 포함하지 않아요.</p>
        </div>

        <div class="two-col">
          <div class="field">
            <label>성별</label>
            <div class="seg" id="f-gender" role="group">
              <button type="button" data-val="f" class="active">여성</button>
              <button type="button" data-val="m">남성</button>
            </div>
          </div>
          <div class="field">
            <label>달력 기준</label>
            <div class="seg" id="f-calendar" role="group">
              <button type="button" data-val="solar" class="active">양력</button>
              <button type="button" data-val="lunar">음력</button>
            </div>
          </div>
        </div>

        <label class="check-row" id="leap-row" hidden>
          <input type="checkbox" id="f-leap">윤달입니다
        </label>

        <div class="field">
          <label for="f-date">생년월일</label>
          <input type="date" id="f-date" required min="1900-01-01" value="1996-05-15">
          <p class="hint" id="date-hint" hidden>음력을 선택했다면 음력 연·월·일 숫자를 그대로 입력하세요.</p>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="f-time">출생시간</label>
            <input type="time" id="f-time" value="14:30">
          </div>
          <div class="field" style="justify-content:flex-end;">
            <label class="check-row"><input type="checkbox" id="f-unknown-time">태어난 시간 모름</label>
          </div>
        </div>

        <div class="field">
          <label for="f-city">출생 지역 <span class="hint">(경도 보정용)</span></label>
          <select id="f-city"></select>
          <label class="check-row"><input type="checkbox" id="f-correction" checked>지역 경도 보정 적용 (진태양시 근사)</label>
          <p class="hint">한국 표준시(동경 135도)와 실제 출생지 경도 차이를 보정해 시주를 더 정확히 계산합니다.</p>
        </div>

        <button type="submit" class="btn-primary">내 사주 확인하기</button>
      </form>

      <div id="saju-result" hidden></div>

    </section>

    <!-- ===================== 탭 2: 오늘의 운세 ===================== -->
    <section class="view" id="view-today" hidden></section>

    <!-- ===================== 탭 3: 궁합보기 ===================== -->
    <section class="view" id="view-compat" hidden></section>

    <!-- ===================== 탭 4: 이야기(구 리포트, 건별결제) ===================== -->
    <section class="view" id="view-reports" hidden></section>

三年之内连遭祸，事事教君没始终。","{xx.tail}":"尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。","{xx.ji}":"箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。","{xx.dou}":"斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。","{xx.niu}":"牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。","{xx.nv}":"女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。","{xx.xu}":"虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。","{xx.wei}":"危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。","{xx.shi}":"室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。","{xx.qiang}":"壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。","{xx.kui}":"奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。","{xx.lou}":"娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。","{xx.vei}":"胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。","{xx.mao}":"昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。","{xx.bi}":"毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。","{xx.zi}":"觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。","{xx.can}":"参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。","{xx.jing}":"井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。","{xx.gui}":"鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。","{xx.liu}":"柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。","{xx.xing}":"星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。","{xx.zhang}":"张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。","{xx.yi}":"翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。","{xx.zhen}":"轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。"},ZHENG:{"{xx.jiao}":"{wx.mu}","{xx.jing}":"{wx.mu}","{xx.kui}":"{wx.mu}","{xx.dou}":"{wx.mu}","{xx.kang}":"{wx.jin}","{xx.gui}":"{wx.jin}","{xx.lou}":"{wx.jin}","{xx.niu}":"{wx.jin}","{x     var scoreB = GOODNESS[dailyFortuneRelation(resB.dayGanWx, g.wxGan)];
    rows.push({ month:m+1, score:(scoreA+scoreB)/2 });
  }
  return rows;
}

/* ============================================================
   계산 엔진 (library 전역: Solar, Lunar, LunarUtil)
   ============================================================ */
function pairKey(a,b){ return a<b? a+b : b+a; }
function buildRelMap(pairs){ var m={}; pairs.forEach(function(p){ m[pairKey(p[0],p[1])]=1; }); return m; }
var LIUHE = buildRelMap([['子','丑'],['寅','亥'],['卯','戌'],['辰','酉'],['巳','申'],['午','未']]);
var SANHE_GROUPS = [['寅','午','戌'],['亥','卯','未'],['申','子','辰'],['巳','酉','丑']];
var CHONG = buildRelMap([['子','午'],['丑','未'],['寅','申'],['卯','酉'],['辰','戌'],['巳','亥']]);
var XING = buildRelMap([['子','卯'],['寅','巳'],['寅','申'],['巳','申'],['丑','戌'],['丑','未'],['戌','未'],
            ['辰','辰'],['午','午'],['酉','酉'],['亥','亥']]);
var HAI  = buildRelMap([['子','未'],['丑','午'],['寅','巳'],['卯','辰'],['申','亥'],['酉','戌']]);
var YUANJIN = buildRelMap([['子','未'],['丑','午'],['寅','酉'],['卯','申'],['辰','亥'],['巳','戌']]);

function zhiRelation(a,b){
  if(a===b) return 'same';
  var k = pairKey(a,b);
  if (LIUHE[k]) return 'liuhe';
  for (var i=0;i<SANHE_GROUPS.length;i++){
    var g = SANHE_GROUPS[i];
    if (g.indexOf(a)>=0 && g.indexOf(b)>=0) return 'sanhe';
  }
  if (CHONG[k]) return 'chong';
  if (XING[k]) return 'xing';
  if (HAI[k]) return 'hai';
  if (YUANJIN[k]) return 'yuanjin';
  return 'none';
}

/* ---- 신살(神殺): 도화살/역마살/화개살 — 삼합 4국(인오술·해묘미·신자진·사유축) 기준으로
   왕지 다음 글자(도화)·충 자리의 생지(역마)·그룹 자신의 고지(화개)가 정해진다. 일지를 기준으로
   그룹을 판단하고, 사주 네 기둥의 지지 중에 그 글자가 하나라도 있으면 그 신살을 보유한 것으로 본다. */
var SHINSAL_BY_GROUP = [
  {yeokma:'申', dohwa:'卯', hwagae:'戌'}, /* 寅午戌국 */
  {yeokma:'巳', dohwa:'子', hwagae:'未'}, /* 亥卯未국 */
  {yeokma:'寅', dohwa:'酉', hwagae:'辰'}, /* 申子辰국 */
  {yeokma:'亥', dohwa:'午', hwagae:'丑'}  /* 巳酉丑국 */
];
function computeShinsal(baseZhi, allZhiList){
  var idx = -1;
  for (var i=0;i<SANHE_GROUPS.length;i++){ if (SANHE_GROUPS[i].indexOf(baseZhi)>=0){ idx=i; break; } }
  if (idx===-1) return [];
  var m = SHINSAL_BY_GROUP[idx];
  var out = [];
  if (allZhiList.indexOf(m.yeokma)>=0) out.push('yeokma');
  if (allZhiList.indexOf(m.dohwa)>=0) out.push('dohwa');
  if (allZhiList.indexOf(m.hwagae)>=0) out.push('hwagae');
  return out;
}

var SHENG = {'木':'火','火':'土','土':'金','金':'水','水':'木'};
var KE    = {'木':'土','火':'金','土':'水','金':'木','水':'火'};
function wuxingRelation(fromWx,toWx){
  if (fromWx===toWx) return 'same';
  if (SHENG[fromWx]===toWx) return 'sheng';
  if (SHENG[toWx]===fromWx) return 'shengBack';
  if (KE[fromWx]===toWx) return 'ke';
  if (KE[toWx]===fromWx) return 'keBack';
  return 'none';
}
var KR_TO_ZH = {}; for (var _zh in WX_KR) KR_TO_ZH[WX_KR[_zh]] = _zh;

function lonCorrectionMinutes(city){
  var lon = CITY_LON[city]!=null ? CITY_LON[city] : CITY_LON['서울'];
  return (lon-135)*4;
}

function computeSaju(opts){
  var solar;
  if (opts.isLunar){
    var lunar0;
    try{
      lunar0 = Lunar.fromYmd(opts.year, opts.isLeapMonth? -opts.month : opts.month, opts.day);
    }catch(e){
      if (opts.isLeapMonth) throw new Error('해당 연도의 '+opts.month+'월에는 윤달이 없습니다. 윤달 체크를 해제해주세요');
      throw new Error('음력 날짜가 올바르지 않습니다. 날짜를 다시 확인해주세요');
    }
    var s0 = lunar0.getSolar();
    solar = Solar.fromYmdHms(s0.getYear(), s0.getMonth(), s0.getDay(),
                              opts.unknownTime?12:opts.hour, opts.unknownTime?0:opts.minute, 0);
  } else {
    solar = Solar.fromYmdHms(opts.year, opts.month, opts.day,
                              opts.unknownTime?12:opts.hour, opts.unknownTime?0:opts.minute, 0);
  }

  var correctionMin = 0;
  var correctedSolar = solar;
  if (opts.useCorrection && !opts.unknownTime){
    correctionMin = Math.round(lonCorrectionMinutes(opts.city));
    var jd = solar.getJulianDay() + correctionMin/1440;
    correctedSolar = Solar.fromJulianDay(jd);
  }

  var lunar = correctedSolar.getLunar();
  var ec = lunar.getEightChar();

  function pillar(ganZh, zhiZh){
    return {
      gan:ganZh, zhi:zhiZh, ganKr:GAN_KR[ganZh], zhiKr:ZHI_KR[zhiZh],
      wxGan:WX_KR[LunarUtil.WU_XING_GAN[ganZh]], wxZhi:WX_KR[LunarUtil.WU_XING_ZHI[zhiZh]]
    };
  }
  var yearP = pillar(ec.getYearGan(), ec.getYearZhi());
  var monthP = pillar(ec.getMonthGan(), ec.getMonthZhi());
  var dayP = pillar(ec.getDayGan(), ec.getDayZhi());
  var timeP = opts.unknownTime ? null : pillar(ec.getTimeGan(), ec.getTimeZhi());

  var deepPillars=['Year','Month','Day'].concat(opts.unknownTime?[]:['Time']).map(function(key,i){
    return {label:['연주','월주','일주','시주'][i],hidden:ec['get'+key+'HideGan']().map(function(g){return GAN_KR[g]||g;}),hiddenSS:ec['get'+key+'ShiShenZhi']().map(function(v){return SS_KR[v]||v;})};
  });
  var dayGanWxZh = LunarUtil.WU_XING_GAN[ec.getDayGan()];
  var yearSS = SS_KR[ec.getYearShiShenGan()] || '일주';
  var monthSS = SS_KR[ec.getMonthShiShenGan()] || '일주';
  var timeSS = opts.unknownTime ? null : (SS_KR[ec.getTimeShiShenGan()] || '일주');

  var wxCount = {'목':0,'화':0,'토':0,'금':0,'수':0};
  var pillars = [yearP, monthP, dayP];
  if (timeP) pillars.push(timeP);
  pillars.forEach(function(p){ wxCount[p.wxGan]++; wxCount[p.wxZhi]++; });
  var totalCount = pillars.length*2;

  var dayWxKr = WX_KR[dayGanWxZh];

  /* 신강·신약 가중 계산 — 겉으로 드러난 글자 개수(wxCount)만 세던 방식에서 한 단계 더 들어가,
     ① 지지 속 지장간(본기·중기·여기)의 영향력을 비율로 반영하고 ② 월지(월령)의 영향력을
     다른 지지보다 크게 반영한다. 아주 간이화한 가중치일 뿐, 정밀한 날짜별 절입 비중까지
     따지는 전문 명리 계산과는 차이가 있다. */
  var HIDE_GAN_WEIGHTS = {1:[1], 2:[0.7,0.3], 3:[0.6,0.3,0.1]};
  var MONTH_ZHI_WEIGHT_MULT = 2;
  var wxWeighted = {'목':0,'화':0,'토':0,'금':0,'수':0};
  var pillarKeys = ['Year','Month','Day'].concat(opts.unknownTime?[]:['Time']);
  pillars.forEach(function(p, pi){
    wxWeighted[p.wxGan] += 1;
    var hideGans = ec['get'+pillarKeys[pi]+'HideGan']();
    var hw = HIDE_GAN_WEIGHTS[hideGans.length] || [1];
    var mult = (pillarKeys[pi]==='Month') ? MONTH_ZHI_WEIGHT_MULT : 1;
    hideGans.forEach(function(g, gi){
      var wx = WX_KR[LunarUtil.WU_XING_GAN[g]];
      wxWeighted[wx] += (hw[gi]||0) * mult;
    });
  });
  var supportWx = [dayWxKr];
  for (var k in SHENG){ if (WX_KR[SHENG[k]]===dayWxKr) supportWx.push(WX_KR[k]); }
  var supportWeight = 0, totalWeight = 0;
  supportWx.forEach(function(w){ supportWeight += wxWeighted[w]||0; });
  for (var wk in wxWeighted){ totalWeight += wxWeighted[wk]; }
  var strengthRatio = supportWeight/totalWeight;
  var strength = strengthRatio>=0.5 ? 'strong' : 'weak';

  /* 용신(간이) — 신강이면 일간의 기운을 덜어내는 식상·재성·관성 중, 신약이면 일간을 돕는
     인성·비겁 중에서, 내 사주 안에 실제로(가중치 기준) 가장 잘 갖춰진 쪽을 추천한다.
     전문 상담에서 쓰는 조후·통관까지 고려한 확정 판단은 아니다. */
  var YS_LABEL = {bigyeop:'비겁', siksang:'식상', jaeseong:'재성', gwanseong:'관성', inseong:'인성'};
  function ysElemOf(rel){
    if (rel==='bigyeop') return dayWxKr;
    if (rel==='siksang') return WX_KR[SHENG[dayGanWxZh]];
    if (rel==='jaeseong') return WX_KR[KE[dayGanWxZh]];
    if (rel==='gwanseong'){ for (var z1 in KE){ if (KE[z1]===dayGanWxZh) return WX_KR[z1]; } }
    if (rel==='inseong'){ for (var z2 in SHENG){ if (SHENG[z2]===dayGanWxZh) return WX_KR[z2]; } }
  }
  var yongshinCandidates = strength==='strong' ? ['siksang','jaeseong','gwanseong'] : ['inseong','bigyeop'];
  var yongshin = null;
  yongshinCandidates.forEach(function(rel){
    var wx = ysElemOf(rel), w = wxWeighted[wx]||0;
    if (!yongshin || w>yongshin.weight) yongshin = {rel:rel, label:YS_LABEL[rel], wx:wx, weight:w};
  });

  /* 일지를 기준으로 도화/역마/화개 3대 신살 보유 여부를 계산 (네 기둥 지지 전체를 대조) */
  var shinsal = computeShinsal(dayP.zhi, pillars.map(function(p){ return p.zhi; }));

  /* 공망(空亡) — 일주를 기준으로 그 순(旬)에 짝이 없는 두 지지. 내 사주의 네 기둥 중
     이 두 글자에 해당하는 기둥이 있으면 그 기둥의 기운이 비어 보이는 자리로 참고한다. */
  var gongmangZh = lunar.getDayXunKong();
  var gongmang = gongmangZh.split('').map(function(z){ return ZHI_KR[z]||z; });
  var pillarLabels = ['연주','월주','일주'].concat(opts.unknownTime?[]:['시주']);
  var gongmangHit = pillars.filter(function(p){ return gongmangZh.indexOf(p.zhi)>=0; })
    .map(function(p){ return pillarLabels[pillars.indexOf(p)]; });

  /* 합충형파해(合沖刑破害) — 기존에는 일지와 다른 지지 하나를 비교하는 용도로만 zhiRelation을
     썼지만, 여기서는 원국 네 기둥의 지지를 서로 전부 짝지어 비교해 육합·삼합·충·형·해·원진에
     해당하는 조합을 모두 찾는다. 추가로 삼합 그룹의 세 글자가 모두 갖춰진 경우는 완전한
     삼합으로 별도 표시한다. */
  var REL_LABEL_FULL = {liuhe:'육합', sanhe:'삼합', chong:'충', xing:'형', hai:'해', yuanjin:'원진'};
  var zhiInteractions = [];
  for (var zi=0; zi<pillars.length; zi++){
    for (var zj=zi+1; zj<pillars.length; zj++){
      var relK = zhiRelation(pillars[zi].zhi, pillars[zj].zhi);
      if (relK!=='none' && relK!=='same'){
        zhiInteractions.push({
          aLabel: pillarLabels[zi], bLabel: pillarLabels[zj],
          aZhi: pillars[zi].zhiKr, bZhi: pillars[zj].zhiKr,
          rel: relK, relLabel: REL_LABEL_FULL[relK]
        });
      }
    }
  }
  var fullSanhe = [];
  SANHE_GROUPS.forEach(function(g){
    var matched = pillars.filter(function(p){ return g.indexOf(p.zhi)>=0; });
    var uniqueZhi = {};
    matched.forEach(function(p){ uniqueZhi[p.zhi]=1; });
    if (Object.keys(uniqueZhi).length===3){
      fullSanhe.push({
        groupKr: g.map(function(z){ return ZHI_KR[z]||z; }).join('·'),
        pillarLabels: matched.map(function(p){ return pillarLabels[pillars.indexOf(p)]; })
      });
    }
  });

  /* 대운(大運) — 라이브러리의 EightChar.getYun(성별)로 10년 단위 운세 기둥을 뽑는다.
     인덱스 0은 첫 대운 이전의 소운 구간이라 표시에서 제외하고, 실제 10년 대운부터 보여준다. */
  var daeun = [];
  try {
    var isFemaleForYun = (opts.gender==='f' || opts.gender==='female');
    var daYunList = ec.getYun(isFemaleForYun?0:1).getDaYun();
    var nowYear = new Date().getFullYear();
    daeun = daYunList.slice(1).map(function(d){
      var gz = d.getGanZhi();
      if (!gz) return null;
      var dGanZh = gz.charAt(0), dZhiZh = gz.charAt(1);
      return {
        startAge:d.getStartAge(), endAge:d.getEndAge(),
        startYear:d.getStartYear(), endYear:d.getEndYear(),
        ganKr:GAN_KR[dGanZh]||dGanZh, zhiKr:ZHI_KR[dZhiZh]||dZhiZh,
        wxGan:WX_KR[LunarUtil.WU_XING_GAN[dGanZh]],
        ss:dailyShishenKey(dayP.gan, dayWxKr, dGanZh, WX_KR[LunarUtil.WU_XING_GAN[dGanZh]]),
        current:(nowYear>=d.getStartYear() && nowYear<=d.getEndYear())
      };
    }).filter(Boolean);
  } catch(e){ daeun = []; }

  return {
    solar:correctedSolar, originalSolar:solar, correctionMin:correctionMin,
    year:yearP, month:monthP, day:dayP, time:timeP,
    deepPillars:deepPillars, yearSS:yearSS, monthSS:monthSS, timeSS:timeSS,
    dayGanWx:dayWxKr, wxCount:wxCount, totalCount:totalCount,
    strength:strength, strengthRatio:strengthRatio, shinsal:shinsal,
    yongshin:yongshin, gongmang:gongmang, gongmangHit:gongmangHit, daeun:daeun,
    zhiInteractions:zhiInteractions, fullSanhe:fullSanhe,
    unknownTime: !!opts.unknownTime, gender:opts.gender, name:opts.name||''
  };
}

function todayGanZhi(dateObj){
  var s = Solar.fromDate(dateObj || new Date());
  var l = s.getLunar();
  var ganZh = l.getDayGan(), zhiZh = l.getDayZhi();
  return { gan:ganZh, zhi:zhiZh, ganKr:GAN_KR[ganZh], zhiKr:ZHI_KR[zhiZh],
           wxGan:WX_KR[LunarUtil.WU_XING_GAN[ganZh]], solar:s };
}
/* 월간/신년(세운) 프리미엄 운세용 — 실제 월주·세운(태어난 날이 아니라 "지금" 기준 월/연 기둥)을 계산.
   사주 뽑을 때 쓰는 것과 같은 EightChar API를 날짜만 "오늘"로 바꿔서 그대로 재사용한다. */
function monthGanZhi(dateObj){
  var s = Solar.fromDate(dateObj || new Date());
  var ec = s.getLunar().getEightChar();
  var ganZh = ec.getMonthGan(), zhiZh = ec.getMonthZhi();
  return { gan:ganZh, zhi:zhiZh, ganKr:GAN_KR[ganZh], zhiKr:ZHI_KR[zhiZh],
           wxGan:WX_KR[LunarUtil.WU_XING_GAN[ganZh]], wxZhi:WX_KR[LunarUtil.WU_XING_ZHI[zhiZh]], solar:s };
}
function yearGanZhi(dateObj){
  var s = Solar.fromDate(dateObj || new Date());
  var ec = s.getLunar().getEightChar();
  var ganZh = ec.getYearGan(), zhiZh = ec.getYearZhi();
  return { gan:ganZh, zhi:zhiZh, ganKr:GAN_KR[ganZh], zhiKr:ZHI_KR[zhiZh],
           wxGan:WX_KR[LunarUtil.WU_XING_GAN[ganZh]], wxZhi:WX_KR[LunarUtil.WU_XING_ZHI[zhiZh]], solar:s };
}

function dailyFortuneRelation(myWxKr, todayWxKr){
  if (myWxKr===todayWxKr) return 'bigyeop';
  var rel = wuxingRelation(KR_TO_ZH[myWxKr], KR_TO_ZH[todayWxKr]);
  if (rel==='sheng') return 'siksang';
  if (rel==='shengBack') return 'inseong';
  if (rel==='ke') return 'jaeseong';
  if (rel==='keBack') return 'gwanseong';
  return 'bigyeop';
}
/* relKey(5종: 비겁/식상/재성/관성/인성)는 요일별 달력, 커플운 라벨처럼 "구조"를 나타낼 때 쓰는 큰 분류명.
   실제 명리학에서는 같은 오행 관계라도 일간과 음양이 같은지(편) 다른지(정)에 따라 결이 또렷이 갈려서
   십성 10가지(비견·겁재·식신·상관·편재·정재·편관·정관·편인·정인)로 나뉜다. 오늘의 운세 본문처럼
   가장 많이 보는 콘텐츠는 이 10종 십성 단위로 더 세밀하게 써서 전문성과 다양성을 둘 다 살린다. */
var GAN_YANG = {'甲':true,'乙':false,'丙':true,'丁':false,'戊':true,'己':false,'庚':true,'辛':false,'壬':true,'癸':false};
var SHISHEN_FROM_RELTYPE = {
  bigyeop:{same:'비견', diff:'겁재'},
  siksang:{same:'식신', diff:'상관'},
  jaeseong:{same:'편재', diff:'정재'},
  gwanseong:{same:'편관', diff:'정관'},
  inseong:{same:'편인', diff:'정인'}
};
var RELTYPE_LABEL = {bigyeop:'비겁운', siksang:'식상운', jaeseong:'재성운', gwanseong:'관성운', inseong:'인성운'};
function dailyShishenKey(myDayGan, myDayGanWx, otherGan, otherWx){
  var relType = dailyFortuneRelation(myDayGanWx, otherWx);
  var same = GAN_YANG[myDayGan] === GAN_YANG[otherGan];
  return SHISHEN_FROM_RELTYPE[relType][same ? 'same' : 'diff'];
}

function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }

/* 특정 날짜의 나-대비 오늘운세 관계 데이터를 반환 */
var GOODNESS = { inseong:2, siksang:2, jaeseong:1, bigyeop:0, gwanseong:-1 };
function dayRelationData(my, dateObj){
  var g = todayGanZhi(dateObj);
  var relKey = dailyFortuneRelation(my.dayGanWx, g.wxGan);
  /* relKey는 PERIOD_BRIEF/PERIOD_TEXT 본문 콘텐츠를 고르는 5종 구조 키로 그대로 두고,
     ssKey(10종 십성)는 화면에 보이는 라벨만 더 정밀하게 바꿔서 보여주는 용도. */
  var ssKey = dailyShishenKey(my.day.gan, my.dayGanWx, g.gan, g.wxGan);

/* dayGanA/dayGanB(일간 한자)는 선택 인자 — 풀 사주 결과가 있을 때만(궁합 화면) 넘겨서
   10종 십성 라벨(ssA/ssB)까지 정확히 뽑아낸다. 마이룸처럼 오행만 저장된 경우엔 생략되고
   케미 등급(tier)만 그대로 계산된다. */
function coupleTodayInfo(dayGanWxA, dayGanWxB, dayGanA, dayGanB){
  var today = todayGanZhi();
  var relA = dailyFortuneRelation(dayGanWxA, today.wxGan);
  var relB = dailyFortuneRelation(dayGanWxB, today.wxGan);
  var ssA = dayGanA ? dailyShishenKey(dayGanA, dayGanWxA, today.gan, today.wxGan) : null;
  var ssB = dayGanB ? dailyShishenKey(dayGanB, dayGanWxB, today.gan, today.wxGan) : null;
  var avg = (GOODNESS[relA] + GOODNESS[relB]) / 2;
  var tier = COUPLE_TODAY_TIER[COUPLE_TODAY_TIER.length-1];
  for (var i=0;i<COUPLE_TODAY_TIER.length;i++){ if (avg >= COUPLE_TODAY_TIER[i].min){ tier = COUPLE_TODAY_TIER[i]; break; } }
  return { relA:relA, relB:relB, ssA:ssA, ssB:ssB, avg:avg, tier:tier, today:today };
}

function weekRangeDates(base){
  var d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  var dow = d.getDay(); // 0=일 ... 6=토
  var mondayOffset = (dow===0) ? -6 : (1-dow);
  var monday = new Date(d); monday.setDate(d.getDate()+mondayOffset);
  var days = [];
  for (var i=0;i<7;i++){ var x=new Date(monday); x.setDate(monday.getDate()+i); days.push(x); }
  return days;
}
function weeklyFortuneData(my){
  var days = weekRangeDates(new Date());
  return days.map(function(d){ return dayRelationData(my, d); });
}
function monthlyFortuneData(my){
  var now = new Date();
  var lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  var rows = [];
  for (var i=1;i<=lastDay;i++){
    rows.push(dayRelationData(my, new Date(now.getFullYear(), now.getMonth(), i)));
  }
  return rows;
}
function yearlyFortuneData(my){
  var now = new Date();
  var rows = [];
  for (var m=0;m<12;m++){
    rows.push(dayRelationData(my, new Date(now.getFullYear(), m, 15)));
  }
  return rows;
}

function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }
/* db 문서 경로 세그먼트는 영문·숫자·_-.~:@+ 만 허용되므로, 한글/한자가 섞인 식별자를
   안전하게 변환한다(각 글자를 코드포인트 기반으로 치환 — 결정적이며 충돌 없음). */
function dbSafeId(str){
  return String(str).split('').map(function(ch){
    var code = ch.codePointAt(0);
    return (code < 128 && /[A-Za-z0-9_\-.~:@+]/.test(ch)) ? ch : ('u'+code.toString(16));
  }).join('');
}
/* 긴 설명 텍스트를 문장 2개 단위로 끊어 여러 <p>로 렌더링해 가독성을 높인다. */
function autoParas(text, cls){
  if (!text) return '';
  cls = cls || 'section-desc';
  var sentences = text.split(/(?<=[.!?])\s+(?=\S)/);
  var paras = [];
  for (var i=0;i<sentences.length;i+=2){
    paras.push(sentences.slice(i, i+2).join(' '));
  }
  return paras.map(function(p){ return '<p class="'+cls+'">'+p+'</p>'; }).join('');
}

/* 브라우저에서 이미지를 캔버스로 리사이즈해 용량을 줄인 뒤 base64로 돌려준다(서버 업로드용). */
function resizeImageFileToBase64(file, maxDim){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read failed')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('decode failed')); };
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width*scale));
        var h = Math.max(1, Math.round(img.height*scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.86);
        resolve({ base64: dataUrl.split(',')[1], mime:'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function saveDevice(){

function initDevice(){
  var raw = null;
  try{ raw = localStorage.getItem(DEVICE_KEY); }catch(e){}
  if (!raw){
    /* mysaju_credits_v1(예전 크레딧 저장소)에 shareCode/unlocked가 남아있다면 이어서 쓴다 —
       기기 식별자가 바뀌면 이미 결제해서 열어본 리포트/궁합 상세를 다시 결제해야 하는 것처럼
       보일 수 있어서, device_id만큼은 그대로 승계한다. */
    try{
      var legacy = localStorage.getItem('mysaju_credits_v1');
      if (legacy){
        var ld = JSON.parse(legacy);
        if (ld && ld.shareCode) raw = JSON.stringify({ unlocked: ld.unlocked||{}, shareCode: ld.shareCode, pendingInviteCode: ld.pendingInviteCode||null });
      }
    }catch(e){}
  }
  if (raw){
    try{ var d = JSON.parse(raw); for (var k in d) DEVICE[k]=d[k]; }catch(e){}
  }
  if (!DEVICE.shareCode) DEVICE.shareCode = genShareCode();
  var invited = false;
  var inviteNow = parseInviteHash();
  if (inviteNow && inviteNow !== DEVICE.shareCode){
    /* 나중에(사주 입력을 실제로 마칠 때) 서버에 등록을 보고하기 위해 기억해둔다 */
    DEVICE.pendingInviteCode = inviteNow;
    invited = true;
  }
  if (inviteNow){
    /* 초대 코드는 DEVICE.pendingInviteCode(로컬 저장)에 이미 기억해뒀다. 주소창 해시에 그대로
       남겨두면, 다음에 새로고침할 때마다 initDevice()가 똑같은 코드를 "방금 받은 초대"로 다시 읽어서
       pendingInviteCode를 되살리고, 그 상태에서 사주를 다시 제출하면 서버에 등록을 또 시도하게 된다
       (서버 쪽 유니크 제약 덕에 중복 등록은 막히지만, 불필요한 재시도와 혼란스러운 상태가 남는다).
       한 번 읽었으면 바로 지워서 다음 로드부터는 깨끗한 상태로 시작한다. */
    try{
      var _u = new URL(location.href);
      _u.hash = '';
      history.replaceState({}, '', _u.pathname + (_u.search||''));
    }catch(e){}
  }
  saveDevice();
  return invited;
}

   사운드 & 햅틱 — 별도 음원 파일 없이 Web Audio API로 가벼운 합성 차임만 사용.
   (추후 실제 사운드 디자인 에셋이 들어오면 이 톤들을 교체하면 됨)
   on/off 상태는 localStorage에 저장, 헤더의 종 아이콘으로 토글. */
var SOUND_KEY = 'mysaju_sound_v1';

  try{ var v = localStorage.getItem(SOUND_KEY); return v===null ? true : v==='1'; }catch(e){ return true; }
}

var _audioCtx = null;
function getAudioCtx(){
  if (!isSoundOn()) return null;
  try{
    if (!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (_audioCtx.state==='suspended') _audioCtx.resume().catch(function(){});
    return _audioCtx;
  }catch(e){ return null; }
}
function playTone(freqs, opts){
  var ctx = getAudioCtx();
  if (!ctx) return;
  opts = opts || {};
  var dur = opts.dur || 0.22, type = opts.type || 'sine', gainPeak = opts.gain || 0.08;
  freqs.forEach(function(freq, i){
    var t0 = ctx.currentTime + (opts.stagger ? i*opts.stagger : 0);
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainPeak, t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  });
}
function hapticPulse(pattern){ try{ if (navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

function tossOrderId(){ return 'sazubara_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

/* 결제 성공 후 success.html -> /?paid=1 로 돌아왔을 때, 실제 지급 여부는 서버에서 pull로 받아온다 */
function handleTossPaymentCallback(){
  var params=new URLSearchParams(location.search);
  if(!params.get('paid'))return;
  var reportId=params.get('report'),stage=params.get('stage')||'story',returnTab=params.get('tab')||'saju';
  var clean=new URL(location.href);['paid','order','report','stage','tab'].forEach(function(k){clean.searchParams.delete(k);});
  history.replaceState({},'',clean.pathname+clean.search+clean.hash);
  Promise.all([pullPaidUnlocks(),pullReportUnlocks()]).then(function(){
    if(reportId){switchTab('reports');return loadReportList(true).then(function(list){var c=list.filter(function(x){return String(x.id)===reportId;})[0];if(c)openReportViewer(c,stage);});}
    switchTab(returnTab);if(STATE.mySaju)renderSajuResult(STATE.mySaju);showToast('구매한 풀이가 열렸어요.');
  }).catch(function(){showToast('구매 내역을 불러오지 못했어요. 잠시 후 다시 열어주세요.');});
}
/* 서버(paid_unlocks)에서 이 기기가 실제로 결제해 보유 중인 항목(기본사주 심층/오늘운세 프리미엄/
   궁합 상세) 목록을 받아와 로컬 잠금 상태에 반영한다. 리포트 건별결제와는 별개 경로(pullReportUnlocks). */
function pullPaidUnlocks(){
  if (!DEVICE.shareCode) return Promise.resolve();
  return fetch('/api/unlock?device_id='+encodeURIComponent(DEVICE.shareCode))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data || !data.ok || !data.rows) return;
      data.rows.forEach(function(key){ DEVICE.unlocked[key] = true; });
      saveDevice();
    })
    .catch(function(){});
}
/* 서버(report_unlocks)에서 이 기기가 실제로 결제해 보유 중인 리포트 목록을 받아와 로컬 잠금 상태에
   반영한다. 매번 전체 목록 — 리포트는 가짓수가 적어 가볍다. */
function pullReportUnlocks(){
  if (!DEVICE.shareCode) return;
  return fetch('/api/reports/unlock?device_id='+encodeURIComponent(DEVICE.shareCode))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data || !data.ok || !data.rows) return;
      data.rows.forEach(function(conceptId){ DEVICE.unlocked['report-'+conceptId] = true; });
      (data.stageKeys||[]).forEach(function(key){DEVICE.unlocked[key]=true;});
      saveDevice();
    })
    .catch(function(){});
}
/* 초대 링크로 들어온 사람이 "자기 사주"를 직접 입력해서 제출했을 때 1회 호출.
   서버가 (a) 자기 자신 초대 (b) 이 기기의 중복 적립을 모두 막아주므로, 여러 번 호출돼도 안전하다. */
function attemptInviteRedeem(opts){
  if (!DEVICE.pendingInviteCode) return;
  if (DEVICE.pendingInviteCode === DEVICE.shareCode){ DEVICE.pendingInviteCode = null; saveDevice(); return; }
  fetch('/api/invite?action=redeem', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      code: DEVICE.pendingInviteCode,
      inviteeDeviceId: DEVICE.shareCode,
      inviteeName: opts.name || '',
      sajuOpts: opts
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    if (data && data.ok){
      DEVICE.pendingInviteCode = null;
      saveDevice();
    }
  }).catch(function(){ /* 다음 사주 입력/제출 때 다시 시도됨 */ });
}

   invite_redemptions에는 초대받은 쪽 사주만 저장되므로, 내가 사주를 입력/수정할 때마다

   심층 + 오늘운세 프리미엄)를 결제 없이 잠금 해제해준다 — 더 이상 크레딧을 적립하지 않는다. */
function redeemPromoCode(){
  var input = $('#promo-code-input');
  var code = ((input && input.value) || '').trim();
  if (!code){ showToast('코드를 입력해주세요.'); return; }
  var btn = $('#promo-code-btn');
  if (btn){ btn.disabled = true; btn.textContent = '확인 중...'; }
  fetch('/api/promo/redeem', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ code: code, deviceId: DEVICE.shareCode })
  }).then(function(r){ return r.json().then(function(data){ return { ok:r.ok, data:data }; }); })
    .then(function(res){
      if (res.data && res.data.ok){
        (res.data.unlockKeys||[]).forEach(function(k){ setUnlocked(k); });
        showToast('프로모션 코드가 적용됐어요. 유료 콘텐츠가 모두 열렸어요 🎁');

        refreshCompatPersonA();
        return;
      }
      var msgs = {
        INVALID_CODE: '존재하지 않는 코드예요.',
        CODE_EXHAUSTED: '이미 모두 소진된 코드예요.',
        ALREADY_REDEEMED: '이미 이 기기에서 사용한 코드예요.',
        MISSING_FIELDS: '코드를 입력해주세요.'
      };
      showToast((res.data && msgs[res.data.error]) || '코드를 사용할 수 없어요.');

    })
    .catch(function(){

      if (btn){ btn.disabled = false; btn.textContent = '코드 사용하기'; }
    });
}

/* 오행 분포 도넛 - SVG stroke-dasharray 세그먼트 방식.
   conic-gradient 대신 쓰는 이유: 세그먼트 사이에 실제 여백(2~3px)을 주고 끝을 둥글게(rounded data-end)
   처리할 수 있어서, 앱 전반의 알약(pill) 모양 UI와 결이 맞고 세그먼트 구분도 더 또렷해짐. */
function wxDonutSvg(wxCount, total){
  var CX=46, CY=46, R=37, SW=13;
  var C = 2*Math.PI*R;
  var cum = 0;
  var segs = WX_ORDER.map(function(wx){
    var cnt = wxCount[wx]||0;
    if (!cnt) return '';
    var frac = cnt/total;
    var startDeg = cum*360 - 90;
    cum += frac;
    var arcLen = frac*C;
    var gapPx = Math.min(arcLen*0.3, 3);
    var dash = Math.max(arcLen-gapPx, 0.001);
    var rest = C-dash;
    return '<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="var('+WUXING_INFO[wx].var+')" stroke-width="'+SW+'" stroke-linecap="round" '+
      'stroke-dasharray="'+dash.toFixed(2)+' '+rest.toFixed(2)+'" transform="rotate('+startDeg.toFixed(2)+' '+CX+' '+CY+')"></circle>';
  }).join('');
  return '<svg width="92" height="92" viewBox="0 0 92 92" style="flex:none;" aria-hidden="true">'+
    '<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="var(--surface-2)" stroke-width="'+SW+'"></circle>'+
    segs+
  '</svg>';
}
/* 가장 강한/빈(0개) 오행 - 동률이면 WX_ORDER 순서(목화토금수)상 먼저 나오는 쪽을 대표로 */
function dominantWx(wxCount){
  var best='목', bestN=-1;
  WX_ORDER.forEach(function(wx){ var c=wxCount[wx]||0; if (c>bestN){ bestN=c; best=wx; } });
  return { wx:best, count:bestN };
}
function emptyWx(wxCount){
  return WX_ORDER.filter(function(wx){ return !(wxCount[wx]>0); });
}
function weakestWx(wxCount){
  var worst=WX_ORDER[0], worstN=Infinity;
  WX_ORDER.forEach(function(wx){ var c=wxCount[wx]||0; if (c<worstN){ worstN=c; worst=wx; } });
  return { wx:worst, count:worstN };
}

/* 카테고리별 990원. 기존 전체 카테고리 구매자는 모든 카테고리 유지. */
function isWorryUnlocked(cat){return isUnlocked('feature-saju-deep')||isUnlocked('feature-saju-deep:'+cat);}
var FEATURE_SAJU_DEEP_PRICE = 990;
function showWorryCategory(my, cat){
  $all('#worry-chips .chip-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.cat===cat); });
  var body = $('#worry-content');
  var unlockKey = 'feature-saju-deep:'+cat;
  if (!isWorryUnlocked(cat)){
    body.innerHTML = worryPreviewHtml(my,cat)+lockedCardHtml(FEATURE_SAJU_DEEP_PRICE, cat+' 이야기 더 알아보기', cat+'의 기본 성향과 일간별 해석, 선택할 때 참고할 점, 상황별 조언을 볼 수 있어요. 선택한 주제만 열리며 다른 주제는 별도 구매입니다.', '990원으로 '+cat+' 풀이 이어보기');
    $('.unlock-btn', body).addEventListener('click', function(){
      tryUnlock(unlockKey, FEATURE_SAJU_DEEP_PRICE, cat+' 카테고리 풀이', function(){
        $all('#worry-chips .chip-btn').forEach(function(b){b.classList.toggle('unlocked',isWorryUnlocked(b.dataset.cat));});
        renderWorryContent(my, cat, body);
      });
    });
    return;
  }
  renderWorryContent(my, cat, body);
}
function renderWorryContent(my, cat, body){
  body.innerHTML = personaWrap('worry',
    '<div class="detail-block"><p class="ttl">'+WORRY_ICON[cat]+' '+cat+'</p>'+autoParas(WORRY_INTRO[cat])+'</div>'+

  ) +
  '<hr class="sep">'+
  '<p class="section-title" style="font-size:.92rem;">지금 상황에 가장 가까운 건요?</p>'+
  '<p class="section-desc" style="margin-top:-4px;">더 구체적인 상황을 고르면 거기에 맞춘 조언을 추가로 보여드려요.</p>'+
  '<div class="chip-row" id="situation-chips">'+
    SITUATION_TEXT[cat].map(function(s){ return '<button type="button" class="chip-btn" data-sid="'+s.id+'">'+s.label+'</button>'; }).join('')+
  '</div>'+
  '<div id="situation-content"></div>';

  $all('#situation-chips .chip-btn', body).forEach(function(btn){
    btn.addEventListener('click', function(){
      $all('#situation-chips .chip-btn', body).forEach(function(b){ b.classList.toggle('active', b===btn); });

      if (sc && s) sc.innerHTML = '<div class="detail-block situation-block"><p class="ttl">'+ICO_SEARCH+' '+s.label+'</p>'+autoParas(s.text)+'</div>';
    });
  });

      '<button type="button" data-val="year">올해</button>'+
    '</div>'+
    '<div id="today-period-body"></div>';
  wireSeg($('#today-period-seg'), function(val){ renderTodayPeriod(val); });

function renderTodayPeriod(period){
  var body = $('#today-period-body');
  var my = STATE.mySaju;
  STATE.todayPeriod = period;
  if (period==='day'){
    body.innerHTML = dayFortuneHtml(my) + '<div class="card" id="today-timeblock-card"></div>';
    renderTimeBlockSection(my, $('#today-timeblock-card'));
    var shareBtn = $('#btn-share-today');
    if (shareBtn) shareBtn.addEventListener('click', function(){ doShareDaily(my); });
    return;
  }

  /* 오늘의 운세 탭은 전부 무료로 전환 — 주/월/년 상세도 바로 보여줌 */
  renderTodayPeriodContent(period, my, body);
}

function renderTodayPeriodContent(period, my, body){
  if (period==='week') body.innerHTML = weekFortuneHtml(my);
  else if (period==='month'){ body.innerHTML = monthFortuneHtml(my); wirePremiumPeriodUnlock(my, 'month'); }
  else if (period==='year'){ body.innerHTML = yearFortuneHtml(my); wirePremiumPeriodUnlock(my, 'year'); }
}

var FRAME_DEFS = [
  { key:'rose',   label:'로즈',     color:'#ff8fa8', soft:'rgba(255,143,168,.28)' },
  { key:'gold',   label:'골드',     color:'#e0ad55', soft:'rgba(224,173,85,.28)' },

  { key:'holo',   label:'홀로그래픽', color:null,    soft:null }
];
function frameDef(key){ return FRAME_DEFS.find(function(f){ return f.key===key; }) || null; }
function frameStyleVars(frameKey){
  var f = frameDef(frameKey);
  if (!f || !f.color) return '';
  return '--frame-color:'+f.color+'; --frame-soft:'+f.soft+';';
}
/* 프레임 적용 상태는 카드 id 기준으로 따로 저장 — 로컬 궁합기록이든(마이룸) 초대로 받은 카드든(배포판) 동일하게 동작 */
var MYROOM_FRAMES_KEY = 'mysaju_frames_v1';
function loadMyRoomFrames(){
  try{ var raw = localStorage.getItem(MYROOM_FRAMES_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}
function getMyRoomFrame(id){ return loadMyRoomFrames()[id] || ''; }
function setMyRoomFrame(id, frameKey){
  try{
    var m = loadMyRoomFrames();
    if (frameKey) m[id] = frameKey; else delete m[id];
    localStorage.setItem(MYROOM_FRAMES_KEY, JSON.stringify(m));
  }catch(e){}
}
function loadMyRoomList(){
  try{
    var raw = localStorage.getItem(MYROOM_KEY);
    var list = raw ? JSON.parse(raw) : [];
    var hidden = getHiddenMyRoomIds();
    if (hidden.length) list = list.filter(function(e){ return hidden.indexOf(e.id)===-1; });
    return list;
  }catch(e){ return []; }

/* ============================================================

/* 사람마다 진짜 다른 해석이 나오도록, 단순 치환 외에 조건 분기 문법을 하나 지원한다:
     {{branch:VAR|key1::text1||key2::text2||...||else::fallback}}
   VAR의 실제 값이 key와 일치하는 분기의 text를 쓰고, 없으면 else, 그것도 없으면 빈 문자열.
   text 안에 {dayGan} 같은 일반 치환 토큰을 또 써도 된다(분기 처리가 먼저 끝난 뒤에 치환됨).
   구분자로 "||"와 "::"를 쓰는 건 일반 문장에서 거의 등장하지 않는 조합이라 충돌 위험이 낮다. */
function fillReportTemplate(tpl, result){
  if (!tpl) return '';
  var dom = dominantWx(result.wxCount);
  var weak = weakestWx(result.wxCount);
  var map = {
    name: result.name || '당신',
    dayGan: result.day.ganKr,
    dayGanWx: result.dayGanWx,
    domWx: dom.wx,
    weakWx: weak.wx,
    strength: result.strength==='strong' ? '강한' : '약한',
    gender: result.gender==='f'||result.gender==='female' ? '여성' : '남성'
  };
  var branched = String(tpl).replace(/\{\{branch:(\w+)\|((?:(?!\}\})[\s\S])*?)\}\}/g, function(m, varName, body){
    var actual = (varName in map) ? String(map[varName]) : '';
    var pairs = body.split('||');
    var fallback = null;
    for (var i=0;i<pairs.length;i++){
      var idx = pairs[i].indexOf('::');
      if (idx===-1) continue;
      var key = pairs[i].slice(0, idx).trim();
      var text = pairs[i].slice(idx+2);
      if (key===actual) return text;
      if (key==='else') fallback = text;
    }
    return fallback!==null ? fallback : '';
  });
  return esc(branched).replace(/\{(\w+)\}/g, function(m, k){ return (k in map) ? esc(String(map[k])) : m; });
}

 map)?esc(String(map[k]))+MARK:m;});filled=filled.replace(/([가-힣])⁠([)\]"'\s]{0,2})(이에요|예요|은|는|이|가|을|를|과|와)/g,function(m,lastChar,between,josa){var fix=JOSA_FIX[josa];return lastChar+between+(hasBatchim(lastChar)?fix.batchim:fix.no);});return filled.replace(/⁠/g,'').replace(/당신님/g,'당신');};var reportSectionHtml=function(panel,result){var hasImg=!!panel.img_url;var imgHtml=hasImg?'<span class="report-section-img"><img src="'+panel.img_url+'" alt=""></span>':'';var filledHtml=fillReportTemplate(panel.caption_template,result);if(!hasImg&&(panel.tone==='formal'||panel.tone==='warning')){return '<div class="report-callout '+panel.tone+'">'+reportCaptionParasHtml(filledHtml)+'</div>';}return '<div class="report-section'+(hasImg?' has-img':'')+'">'+imgHtml+reportCaptionParasHtml(filledHtml)+'</div>';};

function readerKeydown(e){

  var first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}

 ['수입이 줄거나 불규칙해졌을 때','예상했던 돈이 들어오지 않아 이번 달 생활비부터 걱정되는 상황이에요.','현재 잔액과 예정된 필수 지출을 적으세요. 당장 미룰 수 있는 선택 지출을 나눈 뒤, 다음 수입이 들어올 때까지 필요한 금액을 계산하세요.','첫 정리: 반드시 낼 돈 / 날짜를 조정할 돈 / 이번 달 멈출 돈을 세 칸에 적어보세요.','불안을 없애려고 확인되지 않은 고수익 제안에 급히 돈을 넣지 마세요. 큰 결정을 할수록 실제 조건 확인이 먼저예요.'],
 ['지인이 돈을 빌려달라고 할 때','거절하면 관계가 나빠질까 봐 기준을 말하기 어려운 상황이에요.','빌려줘도 내 필수 지출에 문제가 없는지 먼저 확인하세요. 어렵다면 이유를 길게 변명하지 말고 가능한 범위를 분명히 말하세요.','거절할 말: 이번에는 돈을 빌려주기 어려워. 내 생활비 계획도 지켜야 해서 양해해줘.','돌려받을 날짜가 없거나 기록을 꺼린다면 서두르지 마세요. 친한 관계와 돈 거래의 조건은 따로 확인해야 해요.'],
 ['가족이나 연인과 돈 문제를 이야기할 때','함께 쓰는 돈의 기준이 달라 서운함이 쌓인 상황이에요.','공동 비용과 개인 지출을 구분하고, 소득과 생활 여건을 고려해 각자 부담할 범위를 정하세요. 바뀐 상황은 정기적으로 다시 이야기하세요.','시작할 말: 누가 더 썼는지 따지기 전에, 함께 쓰는 비용과 각자 쓸 돈부터 정해볼까?','사랑이나 책임감을 증명하라며 감당하기 어려운 비용을 요구하는 상황은 조심하세요. 합의 없는 부담을 당연하게 받지 않아도 돼요.'],
 ['큰 지출을 앞두고 있을 때','가전·여행·이사처럼 한 번에 큰돈이 드는 선택을 고민하는 상황이에요.','구매 가격만 보지 말고 유지 비용과 취소 비용까지 더하세요. 지금 구매, 시기 조정, 대체안 세 가지를 같은 기준으로 비교하세요.','비교 메모: 총비용 / 사용할 기간 / 취소 조건 / 구매 후 남는 생활비를 적어보세요.','월 할부금만 보고 부담이 작다고 판단하지 마세요. 총액과 앞으로 겹칠 고정 지출도 함께 확인하세요.'],
 ['실패한 선택을 만회하고 싶을 때','이미 쓴 돈이 아까워서 더 큰돈이나 시간을 넣고 싶은 상황이에요.','이미 지출한 금액과 앞으로 추가할 금액을 구분하세요. 처음 선택하지 않은 상태라면 지금 조건에도 새로 시작할지 자문해보세요.','멈춤 질문: 이미 쓴 돈을 제외해도 이 선택을 계속할 이유가 있나요? 어떤 조건이면 중단할 건가요?','손실을 빨리 만회하려고 규모를 키우지 마세요. 감정이 가라앉은 뒤 제삼자의 의견과 실제 자료를 함께 확인하세요.'],
 ['기록을 꾸준히 하고 싶을 때','가계부를 시작했지만 며칠 뒤 밀리거나 귀찮아지는 상황이에요.','모든 항목을 완벽하게 적기보다 하루 한 건의 선택 지출부터 기록하세요. 금액 옆에 구매 이유와 만족도를 짧게 남기세요.','일주일 점검: 반복된 구매 이유 / 후회한 지출 / 다음 주에 유지할 기준을 하나씩 적어보세요.','기록을 못 한 날 때문에 전부 포기하지 마세요. 정확한 결산보다 반복되는 습관을 찾는 것이 첫 목표예요.']
 ]:[
 ['답장이 늦어 불안할 때','평소보다 연락이 늦어 혼자 여러 이유를 예상하는 상황이에요.','마지막 연락 시간과 평소 연락 습관처럼 확인된 사실을 먼저 보세요. 급한 용건이 아니라면 메시지를 연달아 보내기보다 다음 대화에서 연락 기준을 물어보세요.','말해볼 문장: 바쁠 때는 답장이 늦어도 괜찮아. 우리 둘 다 편한 연락 방식이 어떤 건지 이야기해볼까?','답장 한 번으로 마음을 단정하지 마세요. 다만 약속한 연락을 반복해서 무시한다면 그 행동 자체는 따로 이야기할 필요가 있어요.'],
 ['마음을 고백하거나 다음 약속을 잡을 때','좋아하는 마음은 있지만 부담을 줄까 봐 말을 못 꺼내는 상황이에요.','상대의 마음을 미리 판단하기보다 내 바람을 짧게 전하고 선택할 여지를 주세요. 구체적인 제안 한 번이면 충분해요.','말해볼 문장: 너랑 이야기하는 시간이 좋았어. 괜찮으면 다음 주에 둘이 밥 먹을래?','답을 재촉하거나 거절 이유를 캐묻지 마세요. 망설임이나 거절도 상대의 선택으로 존중해야 해요.'],
 ['만나는 속도가 다를 때','나는 자주 만나고 싶은데 상대는 혼자 보내는 시간이 더 필요한 상황이에요.','원하는 만남 횟수와 혼자 쉬는 시간을 각각 말해보세요. 당장 가능한 일정으로 한 번 맞춰보고 편했는지 다시 확인하세요.','말해볼 문장: 나는 일주일에 한 번쯤 만나면 좋겠어. 너에게 편한 횟수는 어느 정도야?','희생한 횟수를 계산하며 상대를 압박하지 마세요. 차이가 계속 크다면 억지로 맞추기보다 서로 감당할 수 있는지 살펴보세요.'],
 ['서운한 마음을 꺼내야 할 때','참고 넘긴 일이 반복돼 작은 일에도 예민해지는 상황이에요.','최근 사건 하나만 골라 상황, 감정, 바라는 행동을 순서대로 말하세요. 상대가 알고 있었는지도 먼저 확인해보세요.','말해볼 문장: 약속이 당일에 바뀌어서 당황했어. 다음에는 알게 되는 대로 먼저 말해주면 좋겠어.','항상 그렇다거나 원래 그런 사람이라는 평가를 피하세요. 여러 문제를 한 번에 꺼내면 무엇을 바꿀지 합의하기 어려워져요.'],
 ['다툼이 커질 것 같을 때','목소리가 커지고 같은 말을 반복해 대화가 풀리지 않는 상황이에요.','진정할 시간을 갖자고 말하고 다시 대화할 시간을 정하세요. 돌아온 뒤에는 해결할 문제 하나와 서로 원하는 행동부터 확인하세요.','말해볼 문장: 지금은 감정이 격해져서 잘 듣기 어려워. 잠깐 쉬고 오늘 저녁에 다시 이야기하자.','말없이 사라지거나 침묵으로 벌주지 마세요. 모욕·위협·강압이 있다면 대화 기술보다 내 안전과 도움을 받을 방법이 우선이에요.'],
 ['내 시간과 기준을 지키고 싶을 때','상대에게 맞추다 내가 쉬거나 해야 할 일을 계속 미루는 상황이에요.','가능한 것과 어려운 것을 함께 말하세요. 거절 뒤에 지킬 수 있는 대안이 있다면 제안하되, 무리한 보상 약속은 하지 마세요.','말해볼 문장: 오늘은 쉬어야 해서 만나기 어려워. 대신 토요일 오후는 괜찮아.','비밀번호·위치 공유나 인간관계 제한을 사랑의 증명으로 요구하는 상황은 조심하세요. 친밀함이 내 선택권을 없애지는 않아요.'],
 ['이 관계가 나에게 맞는지 고민될 때','설렘은 있지만 존중받는 느낌이 부족하거나 자주 지치는 상황이에요.','좋았던 말보다 반복되는 행동을 적어보세요. 약속, 거절 존중, 갈등 뒤 책임지는 태도를 각각 확인하고 불편한 부분을 대화로 물어보세요.','점검 질문: 싫다고 말해도 존중받나요? 문제가 생기면 함께 해결하나요? 나는 내 모습으로 편하게 있을 수 있나요?','궁합 점수나 사주만으로 계속 만날지 결정하지 마세요. 반복되는 무시와 통제는 실제 행동을 기준으로 판단해야 해요.'],
 ['관계가 끝난 뒤 다시 시작하고 싶을 때','외로움 때문에 연락하고 싶지만 같은 문제가 반복될까 걱정되는 상황이에요.','그리운 감정과 끝났던 이유를 따로 적으세요. 다시 만난다면 실제로 달라져야 할 행동이 무엇인지 구체적으로 확인하세요.','스스로 묻기: 외로움을 줄이고 싶은 건가요, 이 사람과 다시 만나고 싶은 건가요? 이전 문제를 함께 해결할 변화가 있나요?','상대가 연락을 원하지 않는다고 밝혔다면 반복해서 연락하지 마세요. 재회를 확답하는 문구보다 현재 의사와 행동을 우선하세요.']
 ];
 return rows.map(function(row,i){return '<section class="report-analysis situation-guide" id="premium-'+String(i+8).padStart(2,'0')+'"><p class="reader-kicker">상황별 가이드 · '+String(i+1).padStart(2,'0')+'</p><h2>'+esc(row[0])+'</h2><p class="report-caption">'+esc(row[1])+'</p><div class="guide-personal"><strong>내 성향에 맞춰</strong><p>'+esc(v.domWx+' 기운의 '+({목:'확장',화:'표현',토:'안정',금:'기준',수:'관찰'}[v.domWx])+' 성향이 두드러져요. '+prompts[v.domWx])+'</p></div><dl class="guide-actions"><div><dt>이렇게 해보세요</dt><dd>'+reportEmphasis(esc(row[2]))+'</dd></div><div><dt>'+(money?'확인할 질문':'말해볼 문장')+'</dt><dd>'+reportEmphasis(esc(row[3]))+'</dd></div><div class="guide-caution"><dt>주의할 점</dt><dd>'+reportEmphasis(esc(row[4]))+'</dd></div></dl></section>';}).join('');
}

function detailReportHtml(concept,panels,result){
 if(isPocha(concept))return pochaDetail(panels,result);
  var vars=reportVariables(result),money=storyCategory(concept)==='wealth';
  var headings=money?['내 재물운의 출발점','돈을 대하는 나의 방식','기회와 소비의 균형','반복되는 재물 패턴','실천할 수 있는 선택']:['내 연애 성향의 출발점','관계를 이끄는 나의 방식','끌림과 표현의 차이','반복되는 관계 패턴','다가오는 인연을 대하는 선택'];
  var ranges=[[0,4],[4,8],[8,13],[13,17],[17,20]];
  var evidence='<section class="report-evidence"><p class="reader-kicker">나의 사주 · 해석 기준</p><h2>'+esc(result.name?result.name+'님의':'나의')+' 심층 리포트</h2>'+
    '<dl><div><dt>일간</dt><dd>'+esc(result.day.ganKr)+' · '+esc(result.dayGanWx)+'</dd></div><div><dt>가장 강한 기운</dt><dd>'+esc(vars.domWx)+'</dd></div><div><dt>보완할 기운</dt><dd>'+esc(vars.weakWx)+'</dd></div><div><dt>신강·신약</dt><dd>'+esc(vars.strength)+' 기운</dd></div></dl></section>';
  var content=ranges.map(function(range,i){var items=panels.slice(range[0],range[1]);if(!items.length)return '';return '<section class="report-analysis" id="analysis-'+i+'"><span class="reader-kicker">0'+(i+1)+'</span><h2>'+headings[i]+'</h2>'+items.map(function(p){return '<div class="report-analysis-text">'+reportCaptionParasHtml(fillReportTemplate(p.caption_template,result))+'</div>';}).join('')+'</section>';}).join('');
  return evidence+'<nav class="report-toc" aria-label="심층 리포트 목차">'+headings.map(function(h,i){return panels.length>ranges[i][0]?'<a href="#analysis-'+i+'">'+h+'</a>':'';}).join('')+['해석 기준과 오행 분포','나의 기본 반응','강점과 보완할 습관','신강·신약과 선택의 속도','십신과 생활 패턴','상황별 점검 질문','일주일 실천 계획'].map(function(h,i){return '<a href="#premium-'+String(i+1).padStart(2,'0')+'">'+h+'</a>';}).join('')+'<a href="#premium-08">'+(money?'구매·제안·돈 거래 등 8가지 행동 가이드':'연락·고백·갈등 등 8가지 행동 가이드')+'</a>'+'</nav>'+sajuDepthHtml(result)+content+premiumReportHtml(concept,result)+reportSituationGuides(concept,result)+
    '<section class="report-action"><p class="reader-kicker">읽고 난 뒤, 한 가지</p><h2>'+(money?'돈의 흐름을 기록해보세요.':'마음의 흐름을 기록해보세요.')+'</h2><p>'+(money?'최근 한 달의 지출 중 만족했던 선택과 아쉬웠던 선택을 하나씩 적어보세요. 반복되는 이유를 찾는 데서 다음 선택이 시작됩니다.':'편안했던 관계와 지쳤던 관계를 하나씩 떠올려보세요. 그때 내가 표현한 마음과 참았던 마음을 나눠 적어보면 반복되는 패턴을 살펴볼 수 있어요.')+'</p></section>'+
    '<p class="disclaimer">명리학의 오행·신강·신약을 바탕으로 한 참고용 콘텐츠입니다. 특정 사건이나 수익, 만남의 시기를 보장하지 않습니다.</p>';
}

function storyAtlasArt(concept,result,index){
 var gender=(result.gender==='m'||result.gender==='male')?'m':'f';
 return '<div class="story-illustration"><img src="/assets/webtoon/reader-v2/'+storyCategory(concept)+'-'+gender+'-'+index+'.webp?v=reader-2.1" alt="'+(storyCategory(concept)==='wealth'?'돈과 선택을 돌아보는':'마음과 관계를 돌아보는')+' 이야기 장면" loading="'+(index<2?'eager':'lazy')+'" decoding="async"></div>';
}
// Emphasis is authored per sentence; matching a generic keyword never adds a highlight.
function reportEmphasis(html){return String(html).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');}
function readingPreviewHtml(concept,result){
 var p=storyProfile(result),career=isPocha(concept),money=storyCategory(concept)==='wealth';
 var traits={
 목:{love:'함께 새로운 경험을 할 때 마음이 움직이는 성향',money:'새로운 가능성과 경험에 먼저 눈이 가는 성향',career:'새로운 방법을 찾고 직접 시도할 때 드러나는 강점',watch:'시작할 때의 기대와 꾸준히 이어갈 조건을 함께 확인해보세요.'},

 ['오늘은 좀 쉬었다 가자.','바로 집으로 가려다 골목 안쪽으로 발길을 돌렸다. 비를 피할 곳을 찾다가, 불이 켜진 포장마차가 눈에 들어왔다.'],
 ['여기 앉아도 되죠?','빈자리에 앉아 따뜻한 잔을 감쌌다. 잠깐 숨을 돌리자, 바쁜 동안 미뤄뒀던 생각이 다시 떠올랐다.'],
 ['열심히는 사는데… 잘하고 있는 건지 모르겠어요.','누구에게 하는 말인지도 모르게 속마음이 나왔다. 지금 필요한 건 무작정 힘내라는 말보다, 내게 맞는 방향을 찾을 실마리였다.'],
 ['남들이 좋다는 일보다, 나한테 맞는 일이 궁금하신 거죠?','옆자리의 남자가 조심스럽게 말을 건넸다. 이름은 서도윤. 내 생년월일과 태어난 시간을 확인한 뒤, 일간 '+result.day.ganKr+'('+p.wx+')부터 차근차근 설명하기 시작했다.'],
 [(result.name?result.name+'님은 ':'')+'어떤 방식으로 일할 때 편한지부터 볼게요.','이직을 할지 말지부터 정할 필요는 없다고 했다. 먼저 내 성향을 보고, 지금 힘든 이유가 일 때문인지 환경 때문인지 나눠보자고 했다.'],
 ['일간 '+result.day.ganKr+'('+p.wx+')을 기준으로 보면, '+fit[p.wx]+' 강점을 살펴볼 수 있어요.','내가 입력한 출생정보로 계산한 사주였다. 서도윤은 직업 이름을 하나 찍어주는 대신, 이 성향이 실제 내 경험과 맞는지 물었다.'],
 ['나는 어떤 일을 할 때 집중이 잘됐더라?','남들에게 인정받았던 순간보다, 내가 덜 힘들게 몰입했던 순간을 떠올려봤다. 같은 업무라도 어떤 과정을 맡았는지에 따라 느낌이 달랐다.'],
 ['잘한다고 해서, 계속하고 싶은 일은 아니었네.','칭찬을 받으면 잘 맞는 일이라고 생각했다. 그런데 끝내고 나면 유난히 지치는 일도 있었다. 잘할 수 있는 일과 오래 하고 싶은 일을 따로 생각해보기로 했다.'],
 ['사주에 드러난 '+p.dom+' 기운도 함께 볼게요.','서도윤은 일간뿐 아니라 오행 분포도 함께 설명했다. 내 사주에서 상대적으로 두드러지는 '+p.dom+' 기운은 '+dom.work+'과 연결해 볼 수 있다고 했다.'],
 [(result.name?result.name+'님에게는 ':'')+l.environment+'이 어떤지 확인해보세요.','직업이 맞지 않는다고 생각했는데, 어쩌면 일하는 조건이 힘들었던 걸 수도 있다. 혼자 집중할 시간, 업무 기준, 함께 일하는 방식 중 무엇이 필요한지 생각해봤다.'],
 [shadow[p.wx],'장점이라고 여겼던 방식이 언제 부담이 되는지 돌아봤다. 성격을 바꾸기보다, 같은 방식을 모든 일에 적용하고 있지는 않은지 살펴볼 필요가 있었다.'],
 ['회사를 옮기면, 내가 힘든 이유도 달라질까?','떠나고 싶다는 마음 뒤에 무엇이 있는지 적어봤다. 업무인지, 사람인지, 보상인지, 시간인지. 새 자리에서도 반복될 문제라면 미리 확인하고 싶었다.'],
 ['그 일을 실제로 조금 해보면 어떨까요?','서도윤은 관심 있는 분야를 작은 경험으로 확인해보라고 했다. 사주에서 상대적으로 적은 '+p.weak+' 기운도 못한다는 뜻은 아니라고 했다. 익숙하지 않은 방식이라면, 직접 해보면서 알아갈 수 있다고.'],
 ['지금 내 생활에서 꼭 지켜야 할 건 뭘까?','더 배우고 싶은 마음도 있지만 당장 필요한 수입도 있다. 무조건 좋은 조건을 찾기보다, 지금 포기하기 어려운 것과 조정할 수 있는 것을 나눠봤다.'],
 ['사주만으로 결정하지 마세요. 실제 조건도 함께 봐야 해요.','내 사주만으로 퇴사나 이직의 결과를 정할 수는 없다고 했다. '+(p.strong?'자기 생각을 밀고 가는 힘을 살펴보는 분류인 만큼, 확신이 들 때 놓친 조건도 확인해보라는 조언이 남았다.':'주변 조건에 맞춰 조정하는 모습을 살펴보는 분류인 만큼, 조언을 듣더라도 내가 원하는 조건은 분명히 해두라는 말이 남았다.')+' 십신 '+(p.ss.length?p.ss.join('·'):'정보')+'도 실제로 맡아온 역할과 비교해 설명해줬다.'],
 ['지킬 것. 바꿀 것. 더 알아볼 것.','복잡했던 고민을 세 가지로 나눠봤다. 다음에 채용 공고를 보거나 제안을 받으면, 무엇부터 물어봐야 할지 조금 알 것 같았다.'],
 [l.action,'한 번에 진로를 정하려고 하니 막막했다. 하지만 이번 주에 해볼 일 하나를 고르는 건 할 수 있을 것 같았다. 직접 해본 뒤 내게 맞았는지 다시 생각해보기로 했다.'],
 ['앞으로 뭘 할지는 몰라도, 내일부터 해볼 건 있네.','밖으로 나오니 비가 그쳐 있었다. 갑자기 모든 고민이 해결된 건 아니다. 그래도 남들이 좋다는 방향 대신, 내 기준으로 확인해볼 일이 생겼다.']
 ];

function pochaArt(index){
 return '<div class="pocha-art"><img src="/assets/pocha/cinematic/scene-'+String(index+1).padStart(2,'0')+'.webp" alt="'+esc(POCHA_SCENES[index][0])+'" loading="'+(index<2?'eager':'lazy')+'" decoding="async"></div>';
}
function pochaScene(result,plan,i,rows){
 var extra=rows&&rows.length?'<div class="scene-insight"><span class="insight-label">'+esc(result.name?result.name+'님의 사주 풀이':'나의 사주 풀이')+'</span>'+rows.map(function(row){return reportCaptionParasHtml(fillReportTemplate(row.caption_template,result));}).join('')+'</div>':'';
 return '<section class="pocha-scene" data-scene="'+(i+1)+'" aria-label="'+esc(POCHA_SCENES[i][0])+'">'+pochaArt(i)+'<div class="pocha-dialogue">'+(POCHA_SCENES[i][1]==='서도윤'?'<span>서도윤</span>':'')+'<p>'+esc(plan[i][0])+'</p></div><div class="pocha-narration"><p>'+reportEmphasis(esc(plan[i][1]))+'</p>'+extra+'</div></section>';
}
function pochaOffer(concept,stage){
 var detail=stage==='detail';
 var benefits=detail?['일간·오행·십신(나를 설명하는 사주 기호)으로 풀이의 근거 확인','이직·새 분야·협업·보상 등 20개 주제','상황별 점검 질문과 일주일 실천 방법']:['내 강점이 드러나는 일과 편한 업무 환경','일할 때 반복되는 방식과 보완할 습관','다음 선택을 위해 확인할 조건과 작은 실천'];
 return '<section class="reader-offer pocha-offer" data-gate="'+stage+'"><p class="reader-kicker">'+(detail?'일·진로 심층 리포트':'일·진로 사주 풀이')+'</p><h2>'+(detail?'내 상황에 맞춰 더 살펴보기':'나에게 맞는 일은 어떤 모습일까요?')+'</h2><ul class="offer-benefits">'+benefits.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul><button type="button" class="btn-primary report-stage-buy" data-stage="'+stage+'">'+(detail?'심층 리포트 열기 · 12,900원':'내게 맞는 업무 환경 확인하기 · 4,900원')+'</button><p class="reader-price-note">'+(detail?'선택 구매 · 콘텐츠와 별도 결제 · 1회 결제':'1회 결제 · 이 콘텐츠 소장<br>풀이 근거·상황별 실천 방법을 담은 세부 리포트는 별도 선택 구매 · <strong>12,900원</strong>')+'</p></section>';
}
function pochaSample(result){
 var p=storyProfile(result),l=POCHA_LENS[p.wx];
 return '<section class="report-real-sample"><p class="reader-kicker">심층 리포트 · 내 해석 미리 읽기</p><h2>나에게 편한 업무 환경</h2><p>일간 <strong>'+esc(result.day.ganKr)+'('+esc(p.wx)+')</strong>을 기준으로 '+esc(l.environment)+'에 주목해요. 실제로 집중이 잘됐던 업무의 조건과 비교해보세요.</p><p>표면 오행에서는 <strong>'+esc(p.dom)+' '+(Number(result.wxCount[p.dom])||0)+'개</strong>가 나타나요. '+esc(EVERYDAY_TRAITS[p.dom][1])+'이 어떤 업무에서 드러났는지도 함께 살펴보세요. 일간과 오행 개수는 서로 다른 기준이며, 동률일 때는 대표 기운 하나가 표시돼요.</p><div class="sample-question"><b>생각해볼 질문</b><p>'+esc(l.question)+'</p></div><div class="sample-action"><b>먼저 해볼 일</b><p>'+esc(l.action)+'</p></div></section>';
}
function pochaDetail(panels,result){
 var p=storyProfile(result),l=POCHA_LENS[p.wx];
 return '<section class="report-evidence"><p class="reader-kicker">일·진로 심층 리포트</p><h2>내가 일하는 방식</h2><p>일간 '+esc(result.day.ganKr)+'('+esc(p.wx)+'), 표면 오행 분포, 간이 신강·신약과 십신을 참고해 읽어요. 출생시간을 모르면 시주는 제외해요. 직업의 적합성이나 이직 결과를 확정하는 해석은 아니에요.</p></section>'+sajuDepthHtml(result)+'<nav class="report-toc" aria-label="일·진로 리포트 목차">'+panels.map(function(row,i){return '<a href="#pocha-detail-'+i+'">'+esc(row.title)+'</a>';}).join('')+'</nav>'+panels.map(function(row,i){return '<section class="report-analysis" id="pocha-detail-'+i+'"><p class="reader-kicker">'+String(i+1).padStart(2,'0')+'</p><h2>'+esc(row.title)+'</h2>'+reportCaptionParasHtml(fillReportTemplate(row.caption_template,result))+(i===3?'<div class="guide-personal"><b>내 성향에 맞춰</b><p>'+esc(l.watch)+'</p></div>':'')+(i===19?'<div class="guide-personal"><b>이번 주에 해볼 일</b><p>'+esc(l.action)+'</p></div>':'')+'</section>';}).join('');
}
function pochaFlow(concept,data,result){
 var plan=pochaPlan(result),rows=data.rows||[],owned=!!data.access.story;
 if(!owned)return '<div class="pocha-reader">'+readingPreviewHtml(concept,result)+pochaOffer(concept,'story')+'</div>';
 var html='<div class="pocha-reader">'+readingPreviewHtml(concept,result)+plan.slice(0,20).map(function(_,i){return pochaScene(result,plan,i,owned?rows.slice(i,i+1):[]);}).join('');

 html+='<section class="pocha-receipt"><p class="reader-kicker">내 일과 진로의 방향</p><h2>오늘 챙겨갈 것</h2><p>'+esc(POCHA_LENS[storyProfile(result).wx].action)+'</p><span>나에게 맞는 방식인지, 직접 확인해보세요.</span></section>';
 if(data.access.detail)html+='<section id="owned-detail-report">'+pochaDetail(data.detailRows||[],result)+'</section>';
 else html+=pochaSample(result)+pochaOffer(concept,'detail');
 return html+'</div>';
}
