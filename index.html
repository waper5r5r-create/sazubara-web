<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="사주팔자 분석, 오늘의 운세, 궁합보기를 한 곳에서 — SAZUBARA">
<title>SAZUBARA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 고정 헤더 + 스크롤 콘텐츠 + 하단 고정 3탭 바를 가진 모바일 앱 셸.
   라이트=새벽 하늘, 다크=밤하늘을 모티브로 한 남색+금색 아이덴티티. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#e8ecf4; --surface-3:#f6f3ea;
  --fg:#1b2033; --fg-muted:#5c6478; --fg-faint:#8a90a3;
  --accent:#9c6b1f; --accent-ink:#fffaf0; --accent-soft:#f1e3c8;
  --border:rgba(27,32,51,0.12); --border-strong:rgba(27,32,51,0.22);
  --shadow:0 8px 24px rgba(27,32,51,0.08);
  --el-wood:#44a386; --el-fire:#b12c00; --el-earth:#ab7400; --el-metal:#006e9a; --el-water:#7552db;
  --good:#1a7a3c; --bad:#b4262c;
  --font-display:'Noto Serif KR',serif; --font-body:'Noto Sans KR',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1120; --surface:#161b2d; --surface-2:#1e2438; --surface-3:#231d14;
    --fg:#eef0f6; --fg-muted:#a1a8bd; --fg-faint:#767e94;
    --accent:#e0ad55; --accent-ink:#201604; --accent-soft:#3a2d12;
    --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.24);
    --shadow:0 8px 28px rgba(0,0,0,0.45);
    --el-wood:#44a386; --el-fire:#b12c00; --el-earth:#ab7400; --el-metal:#006e9a; --el-water:#7552db;
    --good:#4fcf7c; --bad:#ff6b6b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1120; --surface:#161b2d; --surface-2:#1e2438; --surface-3:#231d14;
  --fg:#eef0f6; --fg-muted:#a1a8bd; --fg-faint:#767e94;
  --accent:#e0ad55; --accent-ink:#201604; --accent-soft:#3a2d12;
  --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.24);
  --shadow:0 8px 28px rgba(0,0,0,0.45);
  --el-wood:#44a386; --el-fire:#b12c00; --el-earth:#ab7400; --el-metal:#006e9a; --el-water:#7552db;
  --good:#4fcf7c; --bad:#ff6b6b;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font-body); line-height:1.55; -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
p{margin:0;}
button{font-family:var(--font-body);}
img{max-width:100%;}
[hidden]{display:none!important;}
.app{
  max-width:480px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column;
}
/* ---------- 헤더 ---------- */
.app-header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding:14px 20px 10px; display:flex; align-items:baseline; gap:8px;
  border-bottom:1px solid var(--border);
}
.app-header .mark{font-family:var(--font-display); font-weight:700; font-size:1.3rem; letter-spacing:.02em; flex:none;}
.brand-mark{display:flex; align-items:center; gap:6px;}
.brand-ic{width:26px; height:26px; flex:none; display:block;}
.brand-ic svg{width:100%; height:100%; display:block;}
.app-header .sub{font-size:.76rem; color:var(--fg-muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
/* ---------- 콘텐츠 ---------- */
.content{flex:1; padding:18px 20px 28px; display:flex; flex-direction:column; gap:16px;}
.view{display:flex; flex-direction:column; gap:16px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; min-width:0;
}
.card.flat{box-shadow:none;}
.section-title{font-family:var(--font-display); font-weight:700; font-size:1.05rem;}
.section-desc{font-size:.82rem; color:var(--fg-muted);}
.eyebrow{
  font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:700;
}
/* ---------- 폼 ---------- */
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:.82rem; font-weight:500; color:var(--fg-muted);}
.field input[type="text"], .field input[type="date"], .field input[type="time"], .field select{
  appearance:none; width:100%; border:1px solid var(--border-strong); border-radius:12px;
  background:var(--surface-2); color:var(--fg); padding:11px 12px; font-size:.95rem; font-family:var(--font-body);
}
.field input:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
.seg{display:flex; border:1px solid var(--border-strong); border-radius:12px; overflow:hidden;}
.seg button{
  flex:1; padding:10px 8px; background:var(--surface-2); color:var(--fg-muted); border:none;
  font-size:.88rem; font-weight:500; cursor:pointer; min-width:0;
}
.seg button.active{background:var(--accent); color:var(--accent-ink); font-weight:700;}
.check-row{display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--fg-muted);}
.check-row input{width:17px; height:17px; accent-color:var(--accent);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.hint{font-size:.74rem; color:var(--fg-faint);}
.btn-primary{
  width:100%; padding:14px; border-radius:14px; border:none; background:var(--accent); color:var(--accent-ink);
  font-size:1rem; font-weight:700; font-family:var(--font-display); cursor:pointer; letter-spacing:.02em;
}
.btn-primary:active{opacity:.85;}
.btn-secondary{
  width:100%; padding:12px; border-radius:14px; border:1px solid var(--border-strong); background:transparent;
  color:var(--fg); font-size:.9rem; font-weight:600; cursor:pointer;
}
.btn-link{background:none; border:none; color:var(--accent); font-weight:700; font-size:.85rem; padding:4px 0; cursor:pointer; text-align:left;}
/* ---------- 탭바 ---------- */
.tabs-bar{
  position:sticky; bottom:0; z-index:20; display:flex;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--surface); border-top:1px solid var(--border);
  max-width:480px; margin:0 auto; width:100%;
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
  background:none; border:none; color:var(--fg-faint); font-size:.72rem; font-weight:600; cursor:pointer;
}
.tab-btn .ico{width:22px; height:22px;}
.tab-btn.active{color:var(--accent);}
.tab-btn.active .ico{filter:none;}
/* ---------- 사주 기둥 ---------- */
.pillars{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.pillars.no-time{grid-template-columns:repeat(3,1fr);}
.pillar{
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px;
  background:var(--surface-2); border-radius:14px; min-width:0;
}
.pillar .label{font-size:.68rem; color:var(--fg-muted); font-weight:600;}
.pillar .hanja{font-family:var(--font-display); font-size:1.5rem; font-weight:700; line-height:1.15;}
.pillar .hangul{font-size:.76rem; color:var(--fg-muted);}
.pillar .wx{display:flex; gap:3px; margin-top:2px;}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none;}
/* ---------- 오행 범례/차트 ---------- */
.wx-chart-row{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.legend{display:flex; flex-direction:column; gap:7px; flex:1; min-width:140px;}
.legend-item{display:flex; align-items:center; gap:8px; font-size:.82rem;}
.legend-item .nm{flex:1; color:var(--fg);}
.legend-item .ct{color:var(--fg-muted); font-variant-numeric:tabular-nums;}
/* ---------- 게이지/진행바 ---------- */
.gauge{position:relative; height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden;}
.gauge > i{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:6px;}
.gauge-labels{display:flex; justify-content:space-between; font-size:.72rem; color:var(--fg-faint);}
/* ---------- 뱃지 ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px;
  background:var(--surface-2); font-size:.78rem; font-weight:600; border:1px solid var(--border);
}
.ss-table{display:flex; flex-direction:column; border-top:1px solid var(--border);}
.ss-row{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border); font-size:.86rem;}
.ss-row .pos{width:38px; flex:none; color:var(--fg-muted); font-size:.74rem; font-weight:600;}
.ss-row .nm{font-weight:700; width:52px; flex:none;}
.ss-row .desc{color:var(--fg-muted); font-size:.80rem; min-width:0;}
.empty-state{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding:40px 12px;}
.empty-state .big-ico{font-size:2.4rem;}
.disclaimer{font-size:.73rem; color:var(--fg-faint); line-height:1.6; padding-top:4px; border-top:1px solid var(--border);}
/* ---------- 오늘의 운세 ---------- */
.today-date{font-size:.84rem; color:var(--fg-muted);}
.today-ganzhi{display:flex; align-items:center; gap:10px;}
.today-ganzhi .hanja{font-family:var(--font-display); font-size:1.8rem; font-weight:700;}
.fortune-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.fortune-tile{background:var(--surface-2); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:5px; min-width:0;}
.fortune-tile .ttl{font-size:.76rem; font-weight:700; color:var(--accent);}
.fortune-tile .body{font-size:.80rem; color:var(--fg); min-width:0;}
.lucky-row{display:flex; gap:10px;}
.lucky-chip{flex:1; background:var(--surface-3); border-radius:12px; padding:10px; text-align:center; min-width:0;}
.lucky-chip .k{font-size:.68rem; color:var(--fg-muted);}
.lucky-chip .v{font-size:.84rem; font-weight:700; margin-top:2px;}
/* ---------- 궁합 ---------- */
.compat-people{display:flex; align-items:center; justify-content:center; gap:14px;}
.person-chip{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.8rem; min-width:0;}
.person-chip .av{
  width:46px; height:46px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center;
  justify-content:center; font-family:var(--font-display); font-weight:700; font-size:1.1rem; border:2px solid var(--border-strong);
}
.compat-plus{color:var(--fg-faint); font-size:1.1rem;}
.score-ring-wrap{display:flex; flex-direction:column; align-items:center; gap:4px;}
.score-ring-wrap .num{font-family:var(--font-display); font-size:1.5rem; font-weight:700;}
.score-ring-wrap .lbl{font-size:.72rem; color:var(--fg-muted);}
.sub-scores{display:flex; flex-direction:column; gap:10px;}
.sub-score-row{display:flex; align-items:center; gap:10px; font-size:.82rem;}
.sub-score-row .nm{width:64px; flex:none; font-weight:600; color:var(--fg-muted);}
.sub-score-row .gauge{flex:1;}
.sub-score-row .pct{width:34px; flex:none; text-align:right; font-variant-numeric:tabular-nums; font-weight:700;}
.rel-line{display:flex; gap:8px; font-size:.84rem; align-items:flex-start;}
.rel-line .tag{flex:none; font-weight:700; color:var(--accent); font-size:.78rem; white-space:nowrap; padding-top:.1em;}
hr.sep{border:none; border-top:1px solid var(--border); margin:0;}
/* ---------- 마이룸 ---------- */
.myroom-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.myroom-count{font-size:.76rem; color:var(--fg-muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
.myroom-head-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.seg-sm{border-radius:9px;}
.seg-sm button{padding:5px 10px; font-size:.74rem;}
.myroom-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.myroom-card{
  position:relative; background:var(--surface-2); border-radius:16px; padding:14px 12px 12px;
  display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; min-width:0;
  border:1px solid var(--border); overflow:hidden; cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
}
.myroom-card:active{transform:scale(.96);}
.myroom-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.myroom-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.myroom-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:5px; background:var(--tier-color,var(--accent));
}
.myroom-card .av{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:1.05rem; color:#fff; background:var(--tier-color,var(--accent));
  margin-top:4px; flex:none;
}
.myroom-card .nm{font-weight:700; font-size:.88rem; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.myroom-card .sc{font-size:.72rem; color:var(--fg-muted); font-variant-numeric:tabular-nums;}
.myroom-badge{
  display:inline-flex; align-items:center; gap:4px; font-size:.7rem; font-weight:700; padding:3px 9px; border-radius:999px;
  background:var(--tier-soft,var(--surface-3)); color:var(--tier-color,var(--accent));
}
.myroom-empty{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; padding:22px 10px; color:var(--fg-muted); font-size:.85rem;}
.myroom-card .owner-tag{
  position:absolute; top:7px; left:8px; font-size:.6rem; font-weight:700; color:var(--fg-faint);
  background:var(--surface); border-radius:999px; padding:2px 7px; max-width:calc(100% - 16px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.myroom-sparkle{position:absolute; top:6px; right:8px; font-size:.95rem; animation:myroomTwinkle 1.6s ease-in-out infinite;}
@keyframes myroomTwinkle{0%,100%{opacity:.4; transform:scale(.9);}50%{opacity:1; transform:scale(1.15);}}
.pairdots{position:relative; display:inline-flex; align-items:center; margin-top:16px; width:48px; height:34px; flex:none;}
.pairdots .pd{position:absolute; top:0; left:2px; width:30px; height:30px; border-radius:50%; box-shadow:0 0 0 2px var(--surface-2); opacity:.92;}
.pairdots .pd2{left:16px; z-index:1;}
.couple-today-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.couple-today-date{font-size:.76rem; color:var(--fg-muted); font-variant-numeric:tabular-nums;}
.couple-today-badge{
  display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:.92rem; padding:7px 14px; border-radius:999px;
  background:var(--tier-soft,var(--surface-3)); color:var(--tier-color,var(--accent)); margin:6px 0 8px;
}
.couple-today-badge .ic{font-size:1.05rem;}
.couple-today-each{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; font-size:.8rem; color:var(--fg-muted);}
.couple-today-each b{color:var(--fg);}
.myroom-chemi{
  display:inline-flex; align-items:center; gap:3px; font-size:.64rem; font-weight:700; padding:2px 7px; border-radius:999px;
  background:var(--surface-3); color:var(--fg-muted); margin-top:2px;
}
.myroom-rank{
  position:absolute; top:7px; right:8px; font-size:.72rem; font-weight:800; color:#fff;
  background:var(--tier-color,var(--accent)); border-radius:999px; min-width:20px; height:20px; padding:0 5px;
  display:flex; align-items:center; justify-content:center;
}
/* ---------- 풀이자(페르소나) ---------- */
.persona-chip{
  margin-left:auto; display:flex; align-items:center; gap:5px; background:var(--surface-2);
  border:1px solid var(--border-strong); border-radius:999px; padding:5px 10px; cursor:pointer;
  font-size:.9rem; flex:none;
}
.persona-grid{display:flex; flex-direction:column; gap:10px;}
.persona-card{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; border:1.5px solid var(--border);
  background:var(--surface-2); cursor:pointer; text-align:left; position:relative;
}
.persona-card.active{border-color:var(--accent); background:var(--accent-soft);}
.persona-card .av2{
  width:48px; height:48px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:1.3rem; flex:none; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
}
.persona-card .av2 svg{width:100%; height:100%; display:block;}
.persona-chip .av-mini{width:22px; height:22px; border-radius:50%; display:block; flex:none; overflow:hidden;}
.persona-chip .av-mini svg{width:100%; height:100%; display:block;}
.persona-voice .av-mini2{width:20px; height:20px; border-radius:50%; display:inline-flex; vertical-align:-4px; margin-right:1px; overflow:hidden; flex:none;}
.persona-voice .av-mini2 svg{width:100%; height:100%; display:block;}
.persona-card .body{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;}
.persona-card .nm2{font-weight:700; font-size:.92rem;}
.persona-card .tag2{font-size:.76rem; color:var(--fg-muted);}
.persona-card .check{flex:none; font-size:1.1rem; color:var(--accent);}
.persona-card .lock2{flex:none; font-size:.72rem; font-weight:700; color:var(--accent); background:var(--surface); border:1px solid var(--border-strong); border-radius:999px; padding:5px 10px; white-space:nowrap;}
.persona-voice{display:flex; align-items:center; gap:7px; margin-bottom:-2px;}
.persona-voice .ic{font-size:1rem;}
.persona-voice .nm{font-size:.76rem; font-weight:700; color:var(--accent);}
.persona-line{font-size:.85rem; color:var(--fg); font-style:italic; padding:9px 12px; background:var(--surface-3); border-radius:12px; border-left:3px solid var(--accent);}
/* ---------- 크레딧 ---------- */
.credit-chip{
  display:flex; align-items:center; gap:5px; background:var(--surface-2);
  border:1px solid var(--border-strong); border-radius:999px; padding:5px 12px 5px 10px; cursor:pointer;
  font-size:.78rem; font-weight:700; color:var(--fg); flex:none;
}
.credit-chip .ic{font-size:.85rem;}
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(10,12,20,.5); z-index:40; display:flex; align-items:flex-end;
  max-width:480px; margin:0 auto;
}
.sheet{
  width:100%; max-height:86vh; overflow-y:auto; background:var(--surface); border-radius:22px 22px 0 0;
  padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:16px;
  box-shadow:0 -12px 32px rgba(0,0,0,.25);
}
.sheet-handle{width:36px; height:4px; border-radius:3px; background:var(--border-strong); margin:0 auto;}
.sheet-head{display:flex; align-items:center; justify-content:space-between;}
.sheet-close{background:none; border:none; font-size:1.1rem; color:var(--fg-muted); cursor:pointer; padding:4px;}
.balance-hero{
  display:flex; flex-direction:column; align-items:center; gap:2px; padding:18px; background:var(--surface-2);
  border-radius:16px;
}
.balance-hero .num{font-family:var(--font-display); font-size:2rem; font-weight:700; color:var(--accent);}
.balance-hero .lbl{font-size:.76rem; color:var(--fg-muted);}
.pack-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.pack-card{
  background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:10px 6px;
  display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; min-width:0;
}
.pack-card.pending{opacity:.55; pointer-events:none;}
.pack-card .amt{font-weight:700; font-size:.9rem;}
.pack-card .price{font-size:.72rem; color:var(--fg-muted);}
.demo-note{font-size:.72rem; color:var(--fg-faint); background:var(--surface-3); border-radius:10px; padding:8px 10px;}
.history-row{display:flex; justify-content:space-between; font-size:.8rem; padding:7px 0; border-bottom:1px solid var(--border); gap:8px;}
.history-row .reason{color:var(--fg-muted); min-width:0;}
.history-row .delta{flex:none; font-weight:700; font-variant-numeric:tabular-nums;}
.history-row .delta.pos{color:var(--good);}
.history-row .delta.neg{color:var(--bad);}
.invite-box{display:flex; flex-direction:column; gap:10px; background:var(--surface-2); border-radius:14px; padding:14px;}
.invite-link-row{display:flex; gap:8px; align-items:center;}
.invite-link-row input{flex:1; min-width:0; border:1px solid var(--border-strong); border-radius:10px; background:var(--surface); color:var(--fg-muted); padding:9px 10px; font-size:.76rem;}
.toast{
  position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--fg); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.82rem; font-weight:600;
  z-index:60; box-shadow:0 8px 20px rgba(0,0,0,.25); max-width:88%; text-align:center;
}
/* ---------- 오늘의 운세 챗봇 ---------- */
.chat-fab{
  display:flex; align-items:center; gap:7px; justify-content:center; width:100%; padding:12px;
  border-radius:14px; border:1px dashed var(--border-strong); background:var(--surface-2);
  color:var(--accent); font-weight:700; font-size:.88rem; cursor:pointer;
}
.chat-log{display:flex; flex-direction:column; gap:10px; max-height:46vh; overflow-y:auto; padding:2px;}
.chat-msg{display:block; max-width:84%; font-size:.86rem; line-height:1.5; padding:9px 13px; border-radius:14px; min-width:0; overflow-wrap:anywhere; word-break:break-word;}
.chat-msg.bot{align-self:flex-start; background:var(--surface-2); color:var(--fg); border-bottom-left-radius:4px;}
.chat-msg.user{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px;}
.chat-msg.pending{color:var(--fg-muted); font-style:italic;}
.chat-dots{display:inline-block; margin-left:2px; animation:chatblink 1.1s infinite;}
@keyframes chatblink{0%,100%{opacity:.3;}50%{opacity:1;}}
.chat-ai-badge{font-size:.62rem; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 7px; vertical-align:2px; letter-spacing:.02em;}
.chat-input-row{display:flex; gap:8px; align-items:center;}
.chat-input-row input{
  flex:1; min-width:0; border:1px solid var(--border-strong); border-radius:999px; background:var(--surface-2);
  color:var(--fg); padding:11px 16px; font-size:.88rem; font-family:var(--font-body);
}
.chat-input-row button{
  flex:none; width:42px; height:42px; border-radius:50%; border:none; background:var(--accent);
  color:var(--accent-ink); font-size:1rem; cursor:pointer;
}
.chat-quick-row{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
.chat-quick-row button{
  flex:none; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--fg);
  border-radius:999px; padding:7px 13px; font-size:.78rem; cursor:pointer; white-space:nowrap;
}
/* ---------- 잠금 콘텐츠 / 기간 탭 ---------- */
.locked-card{
  display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding:26px 16px;
  background:var(--surface-2); border-radius:14px;
}
.locked-card .lock-ic{font-size:1.5rem;}
.unlock-btn{
  padding:10px 18px; border-radius:999px; border:none; background:var(--accent); color:var(--accent-ink);
  font-weight:700; font-size:.84rem; cursor:pointer;
}
.cost-badge{font-size:.68rem; color:var(--fg-faint);}
.period-week-list{display:flex; flex-direction:column; gap:8px;}
.period-week-row{display:flex; align-items:center; gap:10px; font-size:.82rem; padding:8px 10px; background:var(--surface-2); border-radius:12px;}
.period-week-row .dow{width:28px; flex:none; font-weight:700; color:var(--fg-muted);}
.period-week-row .dt{width:46px; flex:none; color:var(--fg-faint); font-size:.72rem;}
.period-week-row .lbl2{flex:1; min-width:0;}
.period-week-row.is-today{outline:2px solid var(--accent); outline-offset:-2px;}
.pw-clickable{cursor:pointer; transition:transform .1s;}
.pw-clickable:active{transform:scale(.97);}
.period-week-row.pw-clickable .pw-chev{flex:none; color:var(--fg-faint); font-size:.9rem;}
.month-timeline{display:flex; gap:3px;}
.month-cell{flex:1; height:34px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:.64rem; font-weight:700; color:var(--accent-ink); min-width:0;}
.month-cell.pw-clickable{cursor:pointer;}
.month-legend{display:flex; gap:12px; flex-wrap:wrap; font-size:.72rem; color:var(--fg-muted);}
.month-legend .sw{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px;}
/* ---------- 고민 상담 / 상세 리포트 ---------- */
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip-btn{
  padding:8px 14px; border-radius:999px; border:1px solid var(--border-strong); background:var(--surface-2);
  color:var(--fg); font-size:.82rem; font-weight:600; cursor:pointer;
}
.chip-btn.unlocked{border-color:var(--accent); color:var(--accent);}
.share-btn{
  width:100%; padding:13px; border-radius:14px; border:none; background:var(--surface-3); color:var(--fg);
  font-size:.9rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
}
.detail-block{display:flex; flex-direction:column; gap:6px;}
.detail-block .ttl{font-weight:700; font-size:.88rem; color:var(--accent);}
.situation-block{background:var(--surface-2); border-radius:14px; padding:12px 14px; margin-top:8px;}
</style>
<style>
/* 독립 웹 배포용 베이스 리셋 (claude.ai Artifact 스켈레톤이 제공하던 부분을 대신함) */
html,body{margin:0; padding:0;}
body{background:var(--bg); -webkit-text-size-adjust:100%;}
img{max-width:100%;}
[hidden]{display:none!important;}
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
</style>
</head>
<body>


<div class="app">
  <header class="app-header">
    <span class="mark brand-mark"><span class="brand-ic" id="brand-mark-ic"></span>사주바라</span>
    <span class="sub">오늘의 운세 · 궁합</span>
    <button type="button" class="persona-chip" id="btn-open-persona" title="풀이자 선택"><span id="persona-chip-ic">🧙</span></button>
    <button type="button" class="credit-chip" id="btn-open-credits"><span class="ic">✨</span><span id="credit-chip-num">0</span></button>
  </header>

  <main class="content">

    <!-- ===================== 탭 1: 사주풀이 ===================== -->
    <section class="view" id="view-saju">

      <form class="card" id="saju-form">
        <div>
          <p class="eyebrow">사주팔자</p>
          <h1 class="section-title">생년월일로 사주를 풀어드려요</h1>
          <p class="section-desc">정확한 만세력 계산으로 연주·월주·일주·시주를 확인하고, 오행과 십신을 함께 살펴보세요.</p>
        </div>

        <div class="field">
          <label for="f-name">이름 <span class="hint">(선택)</span></label>
          <input type="text" id="f-name" placeholder="홍길동" maxlength="12" autocomplete="off">
        </div>

        <div class="two-col">
          <div class="field">
            <label>성별</label>
            <div class="seg" id="f-gender" role="group">
              <button type="button" data-val="f" class="active">여성</button>
              <button type="button" data-val="m">남성</button>
            </div>
          </div>
          <div class="field">
            <label>달력 기준</label>
            <div class="seg" id="f-calendar" role="group">
              <button type="button" data-val="solar" class="active">양력</button>
              <button type="button" data-val="lunar">음력</button>
            </div>
          </div>
        </div>

        <label class="check-row" id="leap-row" hidden>
          <input type="checkbox" id="f-leap">윤달입니다
        </label>

        <div class="field">
          <label for="f-date">생년월일</label>
          <input type="date" id="f-date" required min="1900-01-01" max="2026-10-03" value="1996-05-15">
          <p class="hint" id="date-hint">음력을 선택했다면 음력 연·월·일 숫자를 그대로 입력하세요.</p>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="f-time">출생시간</label>
            <input type="time" id="f-time" value="14:30">
          </div>
          <div class="field" style="justify-content:flex-end;">
            <label class="check-row"><input type="checkbox" id="f-unknown-time">태어난 시간 모름</label>
          </div>
        </div>

        <div class="field">
          <label for="f-city">출생 지역 <span class="hint">(경도 보정용)</span></label>
          <select id="f-city"></select>
          <label class="check-row"><input type="checkbox" id="f-correction" checked>지역 경도 보정 적용 (진태양시 근사)</label>
          <p class="hint">한국 표준시(동경 135도)와 실제 출생지 경도 차이를 보정해 시주를 더 정확히 계산합니다.</p>
        </div>

        <button type="submit" class="btn-primary">내 사주 확인하기</button>
      </form>

      <div id="saju-result" hidden></div>

    </section>

    <!-- ===================== 탭 2: 오늘의 운세 ===================== -->
    <section class="view" id="view-today" hidden></section>

    <!-- ===================== 탭 3: 궁합보기 ===================== -->
    <section class="view" id="view-compat" hidden></section>

  </main>

  <nav class="tabs-bar">
    <button class="tab-btn active" data-tab="saju" type="button">
      <span>🀄</span><span>사주풀이</span>
    </button>
    <button class="tab-btn" data-tab="today" type="button">
      <span>🌙</span><span>오늘의 운세</span>
    </button>
    <button class="tab-btn" data-tab="compat" type="button">
      <span>🤝</span><span>궁합보기</span>
    </button>
  </nav>

  <div id="persona-sheet-root"></div>
  <div id="credit-sheet-root"></div>
  <div id="chat-sheet-root"></div>
  <div id="brief-sheet-root"></div>
  <div id="myroom-sheet-root"></div>
  <div id="toast-root"></div>
</div>

三年之内连遭祸，事事教君没始终。","{xx.tail}":"尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。","{xx.ji}":"箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。","{xx.dou}":"斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。","{xx.niu}":"牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。","{xx.nv}":"女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。","{xx.xu}":"虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。","{xx.wei}":"危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。","{xx.shi}":"室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。","{xx.qiang}":"壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。","{xx.kui}":"奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。","{xx.lou}":"娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。","{xx.vei}":"胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。","{xx.mao}":"昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。","{xx.bi}":"毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。","{xx.zi}":"觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。","{xx.can}":"参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。","{xx.jing}":"井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。","{xx.gui}":"鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。","{xx.liu}":"柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。","{xx.xing}":"星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。","{xx.zhang}":"张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。","{xx.yi}":"翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。","{xx.zhen}":"轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。"},ZHENG:{"{xx.jiao}":"{wx.mu}","{xx.jing}":"{wx.mu}","{xx.kui}":"{wx.mu}","{xx.dou}":"{wx.mu}","{xx.kang}":"{wx.jin}","{xx.gui}":"{wx.jin}","{xx.lou}":"{wx.jin}","{xx.niu}":"{wx.jin}","{x function dominantRelKey(rows){
  var count = { bigyeop:0, siksang:0, jaeseong:0, gwanseong:0, inseong:0 };
  rows.forEach(function(r){ count[r.relKey]++; });
  var best = 'bigyeop', bestN = -1;
  Object.keys(count).forEach(function(k){ if (count[k]>bestN){ bestN=count[k]; best=k; } });
  return { key:best, count:count };
}

function coupleMonthlyData(resA, resB){
  var now = new Date();
  var rows = [];
  for (var m=0;m<12;m++){
    var g = todayGanZhi(new Date(now.getFullYear(), m, 15));
    var scoreA = GOODNESS[dailyFortuneRelation(resA.dayGanWx, g.wxGan)];
    var scoreB = GOODNESS[dailyFortuneRelation(resB.dayGanWx, g.wxGan)];
    rows.push({ month:m+1, score:(scoreA+scoreB)/2 });
  }
  return rows;

/* ============================================================
   계산 엔진 (library 전역: Solar, Lunar, LunarUtil)
   ============================================================ */
function pairKey(a,b){ return a<b? a+b : b+a; }
function buildRelMap(pairs){ var m={}; pairs.forEach(function(p){ m[pairKey(p[0],p[1])]=1; }); return m; }
var LIUHE = buildRelMap([['子','丑'],['寅','亥'],['卯','戌'],['辰','酉'],['巳','申'],['午','未']]);
var SANHE_GROUPS = [['寅','午','戌'],['亥','卯','未'],['申','子','辰'],['巳','酉','丑']];
var CHONG = buildRelMap([['子','午'],['丑','未'],['寅','申'],['卯','酉'],['辰','戌'],['巳','亥']]);
var XING = buildRelMap([['子','卯'],['寅','巳'],['寅','申'],['巳','申'],['丑','戌'],['丑','未'],['戌','未'],
            ['辰','辰'],['午','午'],['酉','酉'],['亥','亥']]);
var HAI  = buildRelMap([['子','未'],['丑','午'],['寅','巳'],['卯','辰'],['申','亥'],['酉','戌']]);
var YUANJIN = buildRelMap([['子','未'],['丑','午'],['寅','酉'],['卯','申'],['辰','亥'],['巳','戌']]);

function zhiRelation(a,b){
  if(a===b) return 'same';
  var k = pairKey(a,b);
  if (LIUHE[k]) return 'liuhe';
  for (var i=0;i<SANHE_GROUPS.length;i++){
    var g = SANHE_GROUPS[i];
    if (g.indexOf(a)>=0 && g.indexOf(b)>=0) return 'sanhe';
  }
  if (CHONG[k]) return 'chong';
  if (XING[k]) return 'xing';
  if (HAI[k]) return 'hai';
  if (YUANJIN[k]) return 'yuanjin';
  return 'none';
}

var SHENG = {'木':'火','火':'土','土':'金','金':'水','水':'木'};
var KE    = {'木':'土','火':'金','土':'水','金':'木','水':'火'};
function wuxingRelation(fromWx,toWx){
  if (fromWx===toWx) return 'same';
  if (SHENG[fromWx]===toWx) return 'sheng';
  if (SHENG[toWx]===fromWx) return 'shengBack';
  if (KE[fromWx]===toWx) return 'ke';
  if (KE[toWx]===fromWx) return 'keBack';
  return 'none';
}
var KR_TO_ZH = {}; for (var _zh in WX_KR) KR_TO_ZH[WX_KR[_zh]] = _zh;

function lonCorrectionMinutes(city){
  var lon = CITY_LON[city]!=null ? CITY_LON[city] : CITY_LON['서울'];
  return (lon-135)*4;
}

function computeSaju(opts){
  var solar;
  if (opts.isLunar){
    var lunar0;
    try{
      lunar0 = Lunar.fromYmd(opts.year, opts.isLeapMonth? -opts.month : opts.month, opts.day);
    }catch(e){
      if (opts.isLeapMonth) throw new Error('해당 연도의 '+opts.month+'월에는 윤달이 없습니다. 윤달 체크를 해제해주세요');
      throw new Error('음력 날짜가 올바르지 않습니다. 날짜를 다시 확인해주세요');
    }
    var s0 = lunar0.getSolar();
    solar = Solar.fromYmdHms(s0.getYear(), s0.getMonth(), s0.getDay(),
                              opts.unknownTime?12:opts.hour, opts.unknownTime?0:opts.minute, 0);
  } else {
    solar = Solar.fromYmdHms(opts.year, opts.month, opts.day,
                              opts.unknownTime?12:opts.hour, opts.unknownTime?0:opts.minute, 0);
  }

  var correctionMin = 0;
  var correctedSolar = solar;
  if (opts.useCorrection && !opts.unknownTime){
    correctionMin = Math.round(lonCorrectionMinutes(opts.city));
    var jd = solar.getJulianDay() + correctionMin/1440;
    correctedSolar = Solar.fromJulianDay(jd);
  }

  var lunar = correctedSolar.getLunar();
  var ec = lunar.getEightChar();

  function pillar(ganZh, zhiZh){
    return {
      gan:ganZh, zhi:zhiZh, ganKr:GAN_KR[ganZh], zhiKr:ZHI_KR[zhiZh],
      wxGan:WX_KR[LunarUtil.WU_XING_GAN[ganZh]], wxZhi:WX_KR[LunarUtil.WU_XING_ZHI[zhiZh]]
    };
  }
  var yearP = pillar(ec.getYearGan(), ec.getYearZhi());
  var monthP = pillar(ec.getMonthGan(), ec.getMonthZhi());
  var dayP = pillar(ec.getDayGan(), ec.getDayZhi());
  var timeP = opts.unknownTime ? null : pillar(ec.getTimeGan(), ec.getTimeZhi());

  var dayGanWxZh = LunarUtil.WU_XING_GAN[ec.getDayGan()];
  var yearSS = SS_KR[ec.getYearShiShenGan()] || '일주';
  var monthSS = SS_KR[ec.getMonthShiShenGan()] || '일주';
  var timeSS = opts.unknownTime ? null : (SS_KR[ec.getTimeShiShenGan()] || '일주');

  var wxCount = {'목':0,'화':0,'토':0,'금':0,'수':0};
  var pillars = [yearP, monthP, dayP];
  if (timeP) pillars.push(timeP);
  pillars.forEach(function(p){ wxCount[p.wxGan]++; wxCount[p.wxZhi]++; });
  var totalCount = pillars.length*2;

  var dayWxKr = WX_KR[dayGanWxZh];
  var supportWx = [dayWxKr];
  for (var k in SHENG){ if (WX_KR[SHENG[k]]===dayWxKr) supportWx.push(WX_KR[k]); }
  var supportCount = 0;
  supportWx.forEach(function(w){ supportCount += wxCount[w]||0; });
  var strengthRatio = supportCount/totalCount;
  var strength = strengthRatio>=0.5 ? 'strong' : 'weak';

  return {
    solar:correctedSolar, originalSolar:solar, correctionMin:correctionMin,
    year:yearP, month:monthP, day:dayP, time:timeP,
    yearSS:yearSS, monthSS:monthSS, timeSS:timeSS,
    dayGanWx:dayWxKr, wxCount:wxCount, totalCount:totalCount,
    strength:strength, strengthRatio:strengthRatio,
    unknownTime: !!opts.unknownTime, gender:opts.gender, name:opts.name||''
  };
}

function todayGanZhi(dateObj){
  var s = Solar.fromDate(dateObj || new Date());
  var l = s.getLunar();
  var ganZh = l.getDayGan(), zhiZh = l.getDayZhi();
  return { gan:ganZh, zhi:zhiZh, ganKr:GAN_KR[ganZh], zhiKr:ZHI_KR[zhiZh],
           wxGan:WX_KR[LunarUtil.WU_XING_GAN[ganZh]], solar:s };
}

function dailyFortuneRelation(myWxKr, todayWxKr){
  if (myWxKr===todayWxKr) return 'bigyeop';
  var rel = wuxingRelation(KR_TO_ZH[myWxKr], KR_TO_ZH[todayWxKr]);
  if (rel==='sheng') return 'siksang';
  if (rel==='shengBack') return 'inseong';
  if (rel==='ke') return 'jaeseong';
  if (rel==='keBack') return 'gwanseong';
  return 'bigyeop';
}

function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }

/* 특정 날짜의 나-대비 오늘운세 관계 데이터를 반환 */
var GOODNESS = { inseong:2, siksang:2, jaeseong:1, bigyeop:0, gwanseong:-1 };
function dayRelationData(my, dateObj){
  var g = todayGanZhi(dateObj);
  var relKey = dailyFortuneRelation(my.dayGanWx, g.wxGan);
  return { date:dateObj, gan:g.gan, zhi:g.zhi, ganKr:g.ganKr, zhiKr:g.zhiKr, wxGan:g.wxGan, relKey:relKey, score:GOODNESS[relKey] };
}

function coupleTodayInfo(dayGanWxA, dayGanWxB){
  var today = todayGanZhi();
  var relA = dailyFortuneRelation(dayGanWxA, today.wxGan);
  var relB = dailyFortuneRelation(dayGanWxB, today.wxGan);
  var avg = (GOODNESS[relA] + GOODNESS[relB]) / 2;
  var tier = COUPLE_TODAY_TIER[COUPLE_TODAY_TIER.length-1];
  for (var i=0;i<COUPLE_TODAY_TIER.length;i++){ if (avg >= COUPLE_TODAY_TIER[i].min){ tier = COUPLE_TODAY_TIER[i]; break; } }
  return { relA:relA, relB:relB, avg:avg, tier:tier, today:today };
}

function weekRangeDates(base){
  var d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  var dow = d.getDay(); // 0=일 ... 6=토
  var mondayOffset = (dow===0) ? -6 : (1-dow);
  var monday = new Date(d); monday.setDate(d.getDate()+mondayOffset);
  var days = [];
  for (var i=0;i<7;i++){ var x=new Date(monday); x.setDate(monday.getDate()+i); days.push(x); }
  return days;
}
function weeklyFortuneData(my){
  var days = weekRangeDates(new Date());
  return days.map(function(d){ return dayRelationData(my, d); });
}
function monthlyFortuneData(my){
  var now = new Date();
  var lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  var rows = [];
  for (var i=1;i<=lastDay;i++){
    rows.push(dayRelationData(my, new Date(now.getFullYear(), now.getMonth(), i)));
  }
  return rows;
}
function yearlyFortuneData(my){
  var now = new Date();
  var rows = [];
  for (var m=0;m<12;m++){
    rows.push(dayRelationData(my, new Date(now.getFullYear(), m, 15)));
  }
  return rows;
}

function computeCompat(resA, resB){
  var zhiRel = zhiRelation(resA.day.zhi, resB.day.zhi);
  var ganRel = wuxingRelation(KR_TO_ZH[resA.dayGanWx], KR_TO_ZH[resB.dayGanWx]);
  var scores = {};
  Object.keys(SUB_WEIGHTS).forEach(function(key){
    var w = SUB_WEIGHTS[key];
    var s = w.base + w.zhi*ZHI_SCORE[zhiRel] + w.gan*GAN_SCORE[ganRel];
    scores[key] = Math.round(clamp(s,5,97));
  });
  return { zhiRel:zhiRel, ganRel:ganRel, scores:scores };
}

function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }
/* db 문서 경로 세그먼트는 영문·숫자·_-.~:@+ 만 허용되므로, 한글/한자가 섞인 식별자를
   안전하게 변환한다(각 글자를 코드포인트 기반으로 치환 — 결정적이며 충돌 없음). */
function dbSafeId(str){
  return String(str).split('').map(function(ch){
    var code = ch.codePointAt(0);
    return (code < 128 && /[A-Za-z0-9_\-.~:@+]/.test(ch)) ? ch : ('u'+code.toString(16));
  }).join('');
}
/* 긴 설명 텍스트를 문장 2개 단위로 끊어 여러 <p>로 렌더링해 가독성을 높인다. */
function autoParas(text, cls){
  if (!text) return '';
  cls = cls || 'section-desc';
  var sentences = text.split(/(?<=[.!?])\s+(?=\S)/);
  var paras = [];
  for (var i=0;i<sentences.length;i+=2){
    paras.push(sentences.slice(i, i+2).join(' '));
  }
  return paras.map(function(p){ return '<p class="'+cls+'">'+p+'</p>'; }).join('');
}

var CREDIT_KEY = 'mysaju_credits_v1';
var CREDITS = { balance:0, history:[], unlocked:{}, shareCode:null, shareBonusDate:null, shareBonusCount:0, pendingInviteCode:null, lastLedgerId:0 };

function genShareCode(){
  return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3);
}
function todayDateStr(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function parseInviteHash(){
  var m = (location.hash||'').match(/^#invite-([A-Za-z0-9_.~-]+)$/);
  return m ? m[1] : null;
}
function saveCredits(){
  try{
    localStorage.setItem(CREDIT_KEY, JSON.stringify({
      balance:CREDITS.balance, history:CREDITS.history.slice(0,30), unlocked:CREDITS.unlocked,
      shareCode:CREDITS.shareCode, shareBonusDate:CREDITS.shareBonusDate, shareBonusCount:CREDITS.shareBonusCount,
      pendingInviteCode:CREDITS.pendingInviteCode, lastLedgerId:CREDITS.lastLedgerId
    }));
  }catch(e){}
}
function initCredits(){
  var raw = null;
  try{ raw = localStorage.getItem(CREDIT_KEY); }catch(e){}
  var isNew = !raw;
  if (raw){
    try{ var d = JSON.parse(raw); for (var k in d) CREDITS[k]=d[k]; }catch(e){}
  }
  if (!CREDITS.shareCode) CREDITS.shareCode = genShareCode();
  var invited = false;
  var inviteNow = parseInviteHash();
  if (inviteNow && inviteNow !== CREDITS.shareCode){
    /* 나중에(사주 입력을 실제로 마칠 때) 서버에 등록을 보고하기 위해 기억해둔다 */
    CREDITS.pendingInviteCode = inviteNow;
  }
  if (isNew){
    addCredits(5, '가입 축하 크레딧', true);
    if (inviteNow && inviteNow !== CREDITS.shareCode){
      addCredits(10, '친구 초대로 시작한 보너스', true);
      invited = true;
    }
  }
  saveCredits();
  return invited;
}
function addCredits(amount, reason, silent){
  CREDITS.balance += amount;
  CREDITS.history.unshift({ amount:amount, reason:reason, at:Date.now() });
  saveCredits();
  renderCreditChip();
  if (!silent) showToast(reason+' +'+amount+' 크레딧');
}
function spendCredits(amount, reason){
  if (CREDITS.balance < amount) return false;
  CREDITS.balance -= amount;
  CREDITS.history.unshift({ amount:-amount, reason:reason, at:Date.now() });
  saveCredits();
  renderCreditChip();
  return true;
}
function isUnlocked(key){ return !!CREDITS.unlocked[key]; }
function setUnlocked(key){ CREDITS.unlocked[key] = true; saveCredits(); }

function tryUnlock(unlockKey, cost, label, onSuccess){
  if (isUnlocked(unlockKey)){ onSuccess(); return; }
  if (CREDITS.balance < cost){
    showToast('크레딧이 부족해요. 충전하거나 친구를 초대해보세요.');
    openCreditSheet();
    return;
  }
  if (spendCredits(cost, label)){
    setUnlocked(unlockKey);
    onSuccess();
  }
}

function copyToClipboard(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){}
}

function tossOrderId(){ return 'sazubara_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
var _tossSdkPromise = null;
function loadTossSdk(){
  if (_tossSdkPromise) return _tossSdkPromise;
  _tossSdkPromise = fetch('/api/config').then(function(r){ return r.json(); }).then(function(cfg){
    return new Promise(function(resolve, reject){
      if (!cfg || !cfg.clientKey){ reject(new Error('NO_CLIENT_KEY')); return; }
      if (window.TossPayments){ resolve({ clientKey: cfg.clientKey, TossPayments: window.TossPayments }); return; }
      var s = document.createElement('script');
      s.src = 'https://js.tosspayments.com/v1/payment';
      s.onload = function(){ resolve({ clientKey: cfg.clientKey, TossPayments: window.TossPayments }); };
      s.onerror = function(){ reject(new Error('SDK_LOAD_FAIL')); };
      document.head.appendChild(s);
    });
  });
  return _tossSdkPromise;
}
function startTossPayment(pack){
  loadTossSdk().then(function(ctx){
    var tp = ctx.TossPayments(ctx.clientKey);
    var orderId = tossOrderId();
    tp.requestPayment('카드', {
      amount: pack.krw,
      orderId: orderId,
      orderName: '사주바라 크레딧 ' + pack.amt + '개',
      successUrl: location.origin + '/success.html',
      failUrl: location.origin + '/fail.html'
    });
  }).catch(function(){
    showToast('결제 연동이 아직 준비되지 않았어요. (관리자: TOSS_CLIENT_KEY 환경변수를 확인해주세요)');
    var pending = $('.pack-card.pending');
    if (pending) pending.classList.remove('pending');
  });
}
/* 결제 성공 후 success.html -> /?paid=1 로 돌아왔을 때, 실제 적립액은 서버에서 pull로 받아온다 */
function handleTossPaymentCallback(){
  var params;
  try{ params = new URLSearchParams(location.search); }catch(e){ return; }
  if (!params.get('paid')) return;
  pullCreditLedger();
  try{
    var url = new URL(location.href);
    url.searchParams.delete('paid'); url.searchParams.delete('order');
    history.replaceState({}, '', url.pathname + (url.search||'') + url.hash);
  }catch(e){}
}
/* 서버 장부(credit_ledger)에서 아직 반영 안 한 줄만 당겨와서 로컬 잔액에 반영.
   결제 충전 + 초대 등록 보너스가 모두 이 한 경로로 들어온다. */
function pullCreditLedger(){
  if (!CREDITS.shareCode) return;
  fetch('/api/credits/pull?device_id='+encodeURIComponent(CREDITS.shareCode)+'&after_id='+(CREDITS.lastLedgerId||0))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data || !data.ok || !data.rows || !data.rows.length) return;
      var gotInvite = false;
      data.rows.forEach(function(row){
        addCredits(row.amount, row.reason);
        if (row.id > (CREDITS.lastLedgerId||0)) CREDITS.lastLedgerId = row.id;
        if (row.reason === '친구 초대 등록 보너스'){ gotInvite = true; CREDITS.shareBonusCount = (CREDITS.shareBonusCount||0)+1; }
      });
      saveCredits();
      if (gotInvite){ INVITE_MYROOM_CACHE = null; renderMyRoom(); }
    })
    .catch(function(){});
}
/* 초대 링크로 들어온 사람이 "자기 사주"를 직접 입력해서 제출했을 때 1회 호출.
   서버가 (a) 자기 자신 초대 (b) 이 기기의 중복 적립을 모두 막아주므로, 여러 번 호출돼도 안전하다. */
function attemptInviteRedeem(opts){
  if (!CREDITS.pendingInviteCode) return;
  if (CREDITS.pendingInviteCode === CREDITS.shareCode){ CREDITS.pendingInviteCode = null; saveCredits(); return; }
  fetch('/api/invite/redeem', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      code: CREDITS.pendingInviteCode,
      inviteeDeviceId: CREDITS.shareCode,
      inviteeName: opts.name || '',
      sajuOpts: opts
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    if (data && data.ok){
      CREDITS.pendingInviteCode = null;
      saveCredits();
    }
  }).catch(function(){ /* 다음 사주 입력/제출 때 다시 시도됨 */ });
}

function donutGradient(wxCount, total){
  var stops = []; var acc = 0;
  WX_ORDER.forEach(function(wx){
    var cnt = wxCount[wx]||0;
    if (!cnt) return;
    var start = acc/total*100; acc += cnt; var end = acc/total*100;
    stops.push('var('+WUXING_INFO[wx].var+') '+start.toFixed(2)+'% '+end.toFixed(2)+'%');
  });
  return stops.join(', ');
}

var CHAT_LOG = [];
var CHAT_QUICK = ['오늘 운세','재물운','연애운','건강운','이번 주는 어때?'];
var CHAT_BUSY = false;
var CHAT_AI_DISABLED = false; /* not_granted 등으로 한번 거절되면 이 화면 동안은 키워드 모드로 고정 */
function chatGreeting(){

  if (!CHAT_LOG.length) CHAT_LOG.push({ role:'bot', text:chatGreeting() });

function closeChatSheet(){ $('#chat-sheet-root').innerHTML = ''; }
function chatMsgHtml(m){

  return '<div class="'+cls+'">'+esc(m.text)+(m.pending?'<span class="chat-dots">·&nbsp;·&nbsp;·</span>':'')+'</div>';

function renderChatSheet(){
  var root = $('#chat-sheet-root');
  var p = currentPersona();
  root.innerHTML =
    '<div class="sheet-backdrop" id="chat-backdrop">'+
      '<div class="sheet" onclick="event.stopPropagation()">'+

          (SAMPLE_NS && !CHAT_AI_DISABLED ? ' <span class="chat-ai-badge">AI</span>' : '')+
        '</p>'+
          '<button type="button" class="sheet-close" id="chat-close">✕</button></div>'+
        '<div class="chat-log" id="chat-log">'+CHAT_LOG.map(chatMsgHtml).join('')+'</div>'+
        '<div class="chat-quick-row">'+CHAT_QUICK.map(function(q){ return '<button type="button" data-q="'+esc(q)+'">'+esc(q)+'</button>'; }).join('')+'</div>'+
        '<form class="chat-input-row" id="chat-form">'+
          '<input type="text" id="chat-input" placeholder="무엇이 궁금하세요?" autocomplete="off" maxlength="200" '+(CHAT_BUSY?'disabled':'')+'>'+
          '<button type="submit" '+(CHAT_BUSY?'disabled':'')+'>↑</button>'+
        '</form>'+
      '</div>'+
    '</div>';

  });
  $('#chat-form').addEventListener('submit', function(e){
    e.preventDefault();
    if (CHAT_BUSY) return;
    var input = $('#chat-input');
    var text = input.value.trim();

    input.value = '';
    sendChatMessage(text);

function sendChatMessage(text){
  CHAT_LOG.push({ role:'user', text:text });
  CHAT_BUSY = true;
  CHAT_LOG.push({ role:'bot', text:'생각 중이에요', pending:true });
  renderChatSheet();
  chatGetReply(text).then(function(replyText){
    CHAT_LOG.pop(); /* pending 말풍선 제거 */
    CHAT_LOG.push({ role:'bot', text:replyText });
    CHAT_BUSY = false;
    renderChatSheet();
  });
}
/* AI(sample) 사용 가능하면 실제 Claude에게 질문하고, 불가/실패/거절 시 기존 키워드 매칭으로 자동 대체 */
function chatGetReply(text){
  if (!SAMPLE_NS || CHAT_AI_DISABLED){
    return new Promise(function(resolve){ setTimeout(function(){ resolve(chatBotReply(text)); }, 300); });
  }
  var p = currentPersona();
  var ctx = chatContextSummary();
  var sys = '너는 한국 사주(명리학) 운세 앱 "사주바라"의 풀이자 캐릭터 "'+p.name+'"야. '+p.tagline+'. '+
    '아래 사용자의 사주/오늘운세 요약 정보를 참고해서, 사용자의 질문에 '+p.name+'의 말투로 3~5문장 정도로 답해줘. '+
    '과도하게 길게 쓰지 말고, 사주·운세 용어는 쉬운 말로 풀어서 설명해. 의학적·법적 조언처럼 들릴 수 있는 확정적 단언은 피하고, '+
    '참고용 콘텐츠라는 점을 말투에 자연스럽게 녹여줘(명시적 disclaimer 문장은 넣지 마).\n\n[사용자 사주 요약]\n'+ctx+'\n\n[사용자 질문]\n'+text;
  return sample(sys, { modelTier:'quick', cache:false }).then(function(res){
    return res.text;
  }).catch(function(err){
    if (err && (err.code==='not_granted' || err.code==='sampling_disabled' || err.code==='not_declared' || err.code==='capability_disabled' || err.code==='capability_removed')){
      CHAT_AI_DISABLED = true;
    }
    /* rate_limited, upstream_error 등 그 외 실패도 이번 답변만 키워드 모드로 대체 */
    return chatBotReply(text);
  });
}
function chatContextSummary(){
  var my = STATE.mySaju;
  if (!my) return '(사주 정보 없음)';
  var today = todayGanZhi();
  var relKey = dailyFortuneRelation(my.dayGanWx, today.wxGan);
  var ft = FORTUNE_TEXT[relKey];
  var wk = dominantRelKey(weeklyFortuneData(my));
  return '이름: '+(my.name||'익명')+' / 일간 오행: '+my.dayGanWx+' / 신강신약: '+(my.strength||'-')+
    ' / 오늘 총운 요약: '+ft.label+' / 이번주 전반 분위기: '+PERIOD_TEXT[wk.key].week;
}
function chatBotReply(text){
  var my = STATE.mySaju;
  var today = todayGanZhi();
  var relKey = dailyFortuneRelation(my.dayGanWx, today.wxGan);
  var ft = FORTUNE_TEXT[relKey];
  if (/재물|돈|투자|지출/.test(text)) return '💰 '+ft.money;
  if (/연애|애정|사랑|썸|이성/.test(text)) return '💕 '+ft.love;
  if (/건강|몸|컨디션|피곤/.test(text)) return '🩺 '+ft.health;
  if (/직장|일|업무|커리어/.test(text)) return (WUXING_WORRY_TIP[my.dayGanWx] && WUXING_WORRY_TIP[my.dayGanWx]['직장']) || ft.total;
  if (/인간관계|친구|사람/.test(text)) return (WUXING_WORRY_TIP[my.dayGanWx] && WUXING_WORRY_TIP[my.dayGanWx]['인간관계']) || ft.total;
  if (/이번\s*주|주간|weekly/i.test(text)){
    var wk = dominantRelKey(weeklyFortuneData(my));
    return '📅 '+PERIOD_TEXT[wk.key].week;
  }
  if (/이번\s*달|월간|monthly/i.test(text)){
    var mo = dominantRelKey(monthlyFortuneData(my));
    return '📅 '+PERIOD_TEXT[mo.key].month;
  }
  if (/올해|연간|yearly/i.test(text)){
    var yr = dominantRelKey(yearlyFortuneData(my));
    return '📅 '+PERIOD_TEXT[yr.key].year;
  }
  if (/오늘|지금|today/i.test(text)) return '🌙 '+ft.total;
  return '🌙 '+ft.total+' 조금 더 구체적으로 "재물운", "연애운", "건강운", "이번 주는 어때?" 처럼 물어봐 주시면 더 자세히 답해드릴게요.';
}

function dayFortuneHtml(my){
  var today = todayGanZhi();
  var relKey = dailyFortuneRelation(my.dayGanWx, today.wxGan);
  var ft = FORTUNE_TEXT[relKey];

var MYROOM_CLOUD_DOCS = null; /* db 연동 시 구독된 공개 갤러리 전체 문서 */
var MYROOM_UNSUB = null;
function subscribeMyRoomCloud(){
  if (!DB_NS || MYROOM_UNSUB) return;
  try{
    var q = DB_NS.collection('myroom_entries').orderBy('at','desc').limit(60);
    MYROOM_UNSUB = q.onSnapshot(function(snap){
      MYROOM_CLOUD_DOCS = snap.docs.map(function(d){ return d.data(); }).filter(Boolean);
      renderMyRoom();
    }, function(){ MYROOM_CLOUD_DOCS = null; renderMyRoom(); });
  }catch(e){ MYROOM_CLOUD_DOCS = null; }
}
function renderMyRoom(){
  var root = $('#myroom-card-wrap');
  if (!root) return;
  if (DB_NS && MYROOM_CLOUD_DOCS !== null){
    renderMyRoomCloud(root);
  } else {
    renderMyRoomLocal(root);
  }
}
var INVITE_MYROOM_CACHE = null; /* 초대해서 실제 등록한 친구 목록(서버 응답) 캐시. null=아직 안 불러옴 */

    return;
  }
  if (INVITE_MYROOM_CACHE === null){
    root.innerHTML = '<p class="eyebrow">마이룸</p><div class="myroom-empty"><span style="font-size:1.8rem;">⏳</span><span>불러오는 중...</span></div>';
    fetchInviteMyRoom();
    return;
  }
  var list = INVITE_MYROOM_CACHE;
  if (!list.length){

/* ---- 마이룸: 내가 확인한 궁합 상대 로컬 저장(추후 마이룸 화면에서 사용) ---- */
var MYROOM_KEY = 'mysaju_myroom_v1';
function saveMyRoomEntry(resA, resB, compat, total){
  var id = 'compat-'+resA.day.gan+resA.day.zhi+'-'+resB.day.gan+resB.day.zhi;
  var entry = {
    id:id, nameB:resB.name||'상대방', dayGanWxA:resA.dayGanWx, dayGanWxB:resB.dayGanWx,
    zhiRel:compat.zhiRel, ganRel:compat.ganRel, score:total, at:Date.now()
  };
  try{
    var raw = localStorage.getItem(MYROOM_KEY);
    var list = raw ? JSON.parse(raw) : [];
    var idx = list.findIndex(function(e){ return e.id===id; });
    if (idx>=0) list[idx]=entry; else list.unshift(entry);
    localStorage.setItem(MYROOM_KEY, JSON.stringify(list.slice(0,30)));
  }catch(e){}
  /* 가능하면 공개 갤러리(db)에도 반영 — 쓰기 권한이 없는 뷰어(View-only)는 조용히 로컬에만 남음 */
  if (DB_NS && MY_UID){
    try{
      var cloudEntry = Object.assign({ ownerId:MY_UID }, entry);
      var safeDocId = dbSafeId(MY_UID) + '_' + dbSafeId(id);
      DB_NS.collection('myroom_entries').doc(safeDocId).set(cloudEntry).catch(function(){ /* 쓰기 불가 뷰어 - 무시 */ });
    }catch(e){ /* 경로 생성 자체가 실패해도(doc()는 동기적으로 throw할 수 있음) 로컬 저장은 이미 끝났으므로 조용히 무시 */ }
  }
}

var DB_NS = null, USER_NS = null, SAMPLE_NS = null, MY_UID = null;

function initCapabilities(){
  if (!window.claude || !window.claude.use) return Promise.resolve();
  return Promise.all([

    window.claude.use('user').catch(function(){ return null; }),
    window.claude.use('sample').catch(function(){ return null; })

    renderSajuResult(STATE.mySaju);
    if (STATE.lastForm){
      try{
        var o = STATE.lastForm;
        $('#f-name').value = o.name||'';
        var y=o.year, m=String(o.month).padStart(2,'0'), d=String(o.day).padStart(2,'0');
        $('#f-date').value = y+'-'+m+'-'+d;
        if (!o.unknownTime){
          var hh=String(o.hour).padStart(2,'0'), mi=String(o.minute).padStart(2,'0');
          $('#f-time').value = hh+':'+mi;
        }
        $('#f-unknown-time').checked = !!o.unknownTime;
        $('#f-time').disabled = !!o.unknownTime;
        $('#f-city').value = o.city||'서울';
        $('#f-correction').checked = !!o.useCorrection;
      }catch(e){}
    }
  }

  var startTab = (location.hash||'').replace('#','');
  if (['saju','today','compat'].indexOf(startTab)===-1) startTab='saju';
  switchTab(startTab);

  $all('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.dataset.tab); });
  });

  if (invited) showToast('친구 초대로 시작하셨네요! 웰컴 크레딧 +10이 적립됐어요 🎁');

  initCapabilities().then(function(){
    renderPersonaChip();
    subscribeMyRoomCloud();
    renderMyRoom();
  });
}

if (document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>


</body>
</html>
