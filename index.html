function storyProfile(result){
 var v=reportVariables(result),wx=result.dayGanWx||v.domWx;
 var groups=[['표현과 실행',['식신','상관']],['자원과 선택',['정재','편재']],['기준과 책임',['정관','편관']],['배움과 이해',['정인','편인']],['자율성과 협력',['비견','겁재']]];
 var ss=[result.yearSS,result.monthSS,result.timeSS].filter(Boolean),found=groups.filter(function(g){return ss.some(function(x){return g[1].indexOf(x)>=0;});});
 return {wx:wx,dom:v.domWx,weak:v.weakWx,strong:result.strength==='strong',roles:found.map(function(g){return g[0];}),ss:ss};
}
function storyNarrativePlan(concept,result){
 var money=storyCategory(concept)==='wealth',p=storyProfile(result),r=STORY_RESPONSE[money?'wealth':'love'][p.wx];
 var natural=EVERYDAY_TRAITS[p.dom],balance=EVERYDAY_TRAITS[p.weak];
 var first=money?['살 때는 좋았는데, 왜 또 후회하지?','필요해서 산 것도 있고, 그 순간 좋아 보여서 고른 것도 있다. 돈을 쓸 때 나는 무엇을 먼저 생각했을까.']:['나는 왜 비슷한 사람에게 마음이 갈까?','좋아하는 마음은 매번 새로운데, 고민하는 순간은 어딘가 비슷하다. 나는 어떤 사람에게 끌리고, 어떤 관계에서 편안할까.'];
 return [first,
 [r.voice,r.reaction],
 [money?'내가 돈을 쓰는 데에도 성향이 있을까?':'좋아하는 마음을 표현하는 데에도 내 방식이 있겠지.','내 사주의 일간은 '+result.day.ganKr+'('+p.wx+'). '+EVERYDAY_TRAITS[p.wx][0]+'으로 해석한다고 한다. '+(money?'최근 돈을 쓰거나 새로운 제안을 받았을 때, 나는 무엇부터 확인했는지 떠올려봤다.':'내 마음을 전할 때, 나는 무엇을 기대하고 무엇을 걱정했는지 떠올려봤다.')],
 [r.question,money?'좋았던 선택과 아쉬웠던 선택을 하나씩 생각해봤다. 금액만 비교하기보다 그때 왜 그렇게 골랐는지부터 알고 싶었다.':'내가 편안한 속도와 상대가 편안한 속도가 같지는 않을 수 있다. 마음을 숨기기만 하거나, 내 방식대로 반응해주길 바라지는 않았는지 생각해봤다.'],
 [money?'그때 나는 무엇을 기대했던 걸까?':'그때 나는 어떤 마음이었을까?',money?'최근 고민했던 지출이나 제안을 떠올렸다. 정말 필요했던 것인지, 기회를 놓치고 싶지 않았던 것인지 이유를 나눠봤다.':'함께 보낸 시간 중 유난히 기억에 남는 순간을 떠올렸다. 상대의 말과 행동에서 나는 무엇을 좋게 느꼈는지 적어봤다.'],
 [money?'내가 먼저 보는 조건이 있었네.':'나에게 편한 관계의 모습도 있구나.','내 사주에는 '+p.dom+' 기운이 상대적으로 두드러진다. '+natural[1]+'과 연결해 보는 해석이다. '+(money?'내 선택에 이런 모습이 나타났는지, 실제 경험과 비교해봤다.':'내가 사람을 알아가고 마음을 표현할 때도 이런 모습이 있었는지 돌아봤다.')],
 [money?'확신이 들 때도 한 번은 확인하자.':'내 마음과 상대의 마음을 같이 봐야겠어.',p.strong?(money?'간이 신강·신약 분류에서는 스스로 정한 방향을 유지하는 쪽에 무게가 실린다. 내 판단을 믿는 힘이 도움이 됐던 때와, 다른 의견도 들었으면 좋았을 때를 나눠봤다.':'간이 신강·신약 분류에서는 자기 방향과 표현을 유지하는 쪽에 무게가 실린다. 내 마음을 전하는 것과 상대에게 같은 반응을 기대하는 것은 다를 수 있겠다고 생각했다.'):(money?'간이 신강·신약 분류에서는 주변 조건을 살피며 조정하는 쪽에 무게가 실린다. 다른 사람의 의견을 듣더라도, 내가 감당할 금액과 선택 이유는 따로 적어두기로 했다.':'간이 신강·신약 분류에서는 주변 조건에 맞춰 조정하는 쪽에 무게가 실린다. 상대를 배려하는 동안 내가 원하는 것은 말하지 못한 적이 없었는지 돌아봤다.')],
 [money?'다른 사람의 추천보다 내 기준이 먼저겠지.':'나는 이 관계에서 무엇을 기대하고 있을까?',p.roles.length?'사주에 드러난 십신에서는 '+p.roles.join(' · ')+'을 함께 살펴본다. '+(money?'이런 성향이 돈이나 기회를 다룰 때 어떻게 나타나는지, 내 선택과 비교해봤다.':'상대에게 바라는 모습과 내가 자주 맡는 역할을 실제 관계에 비춰봤다.'):'십신이 말하는 내 반응 패턴을 편안했던 경험, 부담스러웠던 경험에 하나씩 비춰봤다.'],
 [r.line,r.action],
 [money?'익숙하지 않은 방식도 한번 해보자.':'늘 하던 방식에서 조금 바꿔볼까.','내 사주에서 상대적으로 적은 '+p.weak+' 기운도 함께 봤다. '+balance[2]+' 적게 나타난다는 이유로 내 능력이나 가능성이 부족하다는 뜻은 아니다.'],
 [money?'다음 선택에는 내 기준을 써먹어보자.':'이번에는 내가 원하는 것도 말해보자.',money?'다음에 비슷한 제안을 받거나 큰돈을 쓰게 되면, 내가 왜 원하는지와 어디까지 감당할 수 있는지 먼저 확인하기로 했다.':'상대의 반응을 혼자 추측하기보다 내 마음을 짧게 전해보기로 했다. 내가 편한 방식도 이야기하고, 상대의 생각도 들어보고 싶다.'],
 [money?'돈을 대하는 내 습관부터 알아가볼래.':'좋아하는 마음도, 나답게 표현해볼래.',money?'앞으로 얼마를 벌게 될지는 알 수 없다. 다만 내가 어떤 선택을 반복하는지 알면, 다음에는 조금 더 내 기준에 맞게 고를 수 있을 것 같다.':'누구와 언제 만나게 될지 답을 정한 건 아니다. 그래도 내 마음을 이해하고 상대와 대화할 때 무엇부터 해볼지는 조금 알 것 같다.']];
}

function storyOpeningV2(concept,result){
 var money=storyCategory(concept)==='wealth',plan=storyNarrativePlan(concept,result);
 return '<section class="story-opening-v2"><p class="reader-kicker">'+(money?'돈이 머무는 마음':'인연이 시작되는 마음')+'</p><h2>'+(money?'돈을 대하는 내 방식,<br>어떤 선택으로 이어질까요?':'마음이 움직이는 내 방식,<br>어떤 관계로 이어질까요?')+'</h2></section>'+plan.slice(0,4).map(function(scene,i){return storySceneHtml(concept,result,i,scene[0],'<p>'+reportEmphasis(esc(scene[1]))+'</p>');}).join('')+'<p class="story-cliffhanger">'+(money?'내 사주에는 어떤 소비·선택 성향이 담겨 있을까요?':'내 사주로 보면, 나는 어떤 관계에서 편안할까요?')+'</p>';
}
function storyPaidScenes(concept,data,result){
 var rows=data.rows||[],count=8,html='',plan=storyNarrativePlan(concept,result);
 for(var i=0;i<count;i++){
  var group=rows.slice(Math.floor(i*rows.length/count),Math.floor((i+1)*rows.length/count));
  var narration=group.map(function(row){return fillReportTemplate(row.caption_template,result);}).filter(Boolean);
  var body='<p>'+reportEmphasis(esc(plan[i+4][1]))+'</p>'+(narration.length?'<div class="scene-insight"><span class="insight-label">나의 사주로 보면</span>'+narration.map(function(text){return reportCaptionParasHtml(text);}).join('')+'</div>':'');
  html+=storySceneHtml(concept,result,i+4,plan[i+4][0],body);
 }
 return '<div class="story-sequence">'+html+'</div>';
}

function reportSampleHtml(concept,result){

 return '<section class="report-real-sample"><p class="reader-kicker">심층 리포트 · 내 해석 미리 읽기</p><h2>'+(money?'나의 선택을 읽는 기준':'나의 관계를 읽는 기준')+'</h2><p>일간 <strong>'+esc(result.day.ganKr)+'('+esc(p.wx)+')</strong>은 '+esc(EVERYDAY_TRAITS[p.wx][0])+'으로 읽습니다. '+esc(money?'새로운 기회와 지출을 마주할 때 무엇을 먼저 살피는지':'마음을 표현하고 상대를 알아가는 과정에서 무엇을 중요하게 느끼는지')+' 돌아보는 기준이에요.</p><p>분포에서 <strong>'+esc(p.dom)+' '+(Number(result.wxCount[p.dom])||0)+'개</strong>가 나타나요. '+esc(EVERYDAY_TRAITS[p.dom][1])+'을 살펴볼 수 있습니다. 일간과 분포는 서로 다른 기준이라, 두 설명을 함께 읽을 때 내 모습이 더 입체적으로 보여요.</p><div class="sample-question"><b>내 경험에 비춰볼 질문</b><p>'+esc(r.question)+'</p></div><div class="sample-action"><b>먼저 해볼 한 가지</b><p>'+esc(r.action)+'</p></div><p class="sample-method">입력한 일간과 표면 오행 분포를 참고한 해석입니다. 출생시간을 모르는 경우 시주는 제외해요.</p></section>';
}
function storyFlowHtml(concept,data,result){
 if(isPocha(concept))return pochaFlow(concept,data,result);
 if(!data.access.story)return readingPreviewHtml(concept,result)+stageOfferHtml(concept,'story');
 var html=readingPreviewHtml(concept,result)+(data.access.story?'<div class="reader-owned-badge">'+uiIcon('check')+' 콘텐츠 보유'+(data.access.detail?' · 심층 리포트 보유':'')+'</div>':'')+storyOpeningV2(concept,result);

 html+=storyPaidScenes(concept,data,result)+'<section class="story-epilogue"><p class="reader-kicker">콘텐츠를 마치며</p><h2>내게 맞는 해석은,<br>경험과 함께 선명해집니다.</h2><p>마음에 남은 선택이 있었나요?<br>그 이유와 일상에서 해볼 방법을 더 살펴볼 수 있어요.</p></section>';
 if(data.access.detail)return html+'<section class="owned-report-heading"><p class="reader-kicker">보유한 심층 리포트</p><h2>이제, 나를 더 깊이 읽어볼까요?</h2></section><section id="owned-detail-report">'+detailReportHtml(concept,data.detailRows||[],result)+'</section>'+reportShareBtnHtml();
 html+='<section class="detail-bridge"><p class="reader-kicker">선택한 이유에서, 다음 행동까지</p><h2>더 깊은 풀이가 궁금하다면</h2></section>'+reportSampleHtml(concept,result)+'<section class="report-sample-toc"><h3>이어서 살펴볼 내용</h3><ul><li>내 일간·오행·십신으로 보는 해석의 근거</li><li>강점과 선택 방식, 보완할 습관</li><li>8가지 상황별 행동 지침과 주의할 점</li><li>점검 질문과 일주일 실천 계획</li></ul></section>'+stageOfferHtml(concept,'detail');
 return html;
}

function renderReportPanels(concept,data,stage){

function wireReportAdminRowBtns(list){

      if (c) openReportPanelAdmin(c);
    });
  });
  $all('.report-admin-edit-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var c = list.filter(function(x){ return x.id===btn.dataset.id; })[0];
      if (c) openReportConceptForm(c);
    });
  });
  $all('.report-admin-del-btn').forEach(function(btn){
    btn.addEventListener('click', function(){

/* 마이룸은 두 방향을 모두 모아서 보여준다:
   1) 내가 초대해서 실제로 등록한 사람 (/api/invite?action=list) — row.invitee_saju를 그대로 받아온다.
   2) 나를 초대해준 친구 (/api/invite?action=received) — 그 친구가 /api/device/save-saju 로 올려둔
      자기 사주(row.inviter_saju)를 받아온다. 아직 한 번도 올리지 않은 초대자는 서버가 알아서 걸러서 내려준다.
   두 목록을 합쳐 최신순으로 섞어 보여주고, fromInviter 플래그로 카드에 "나를 초대함" 표시만 다르게 단다.
   서로 초대를 주고받은 경우(상대 기기가 sentList·receivedList 양쪽에 다 걸리는 경우) 같은 사람이
   카드 두 장으로 중복돼 보일 수 있어서, 상대방 device_id(_otherId) 기준으로 한 장만 남기고 합친다 —
   둘 중 더 먼저 생긴(원래) 관계 쪽을 대표 카드로 쓴다. */
function fetchInviteMyRoom(){
  var sentP = fetch('/api/invite?action=list&device_id='+encodeURIComponent(DEVICE.shareCode))
    .then(function(r){ return r.json(); }).catch(function(){ return null; });
  var receivedP = fetch('/api/invite?action=received&device_id='+encodeURIComponent(DEVICE.shareCode))
    .then(function(r){ return r.json(); }).catch(function(){ return null; });
  Promise.all([sentP, receivedP]).then(function(results){
    var sentData = results[0], receivedData = results[1];
    var sentRows = (sentData && sentData.ok && sentData.rows) ? sentData.rows : [];
    var receivedRows = (receivedData && receivedData.ok && receivedData.rows) ? receivedData.rows : [];
    var sentList = sentRows.map(function(row){
      var resB;
      try{ resB = computeSaju(row.invitee_saju); }catch(e){ return null; }
      var compat = computeCompat(STATE.mySaju, resB);
      return {
        id:'invite-'+row.invitee_device_id, _otherId:row.invitee_device_id, nameB:row.invitee_name||resB.name||'상대방',
        dayGanWxA:STATE.mySaju.dayGanWx, dayGanWxB:resB.dayGanWx, dayGanB:resB.day.ganKr, cardPolarity:['甲','丙','戊','庚','壬'].indexOf(resB.day.gan)>=0?'yang':'yin',
        shinsalA:STATE.mySaju.shinsal||[], shinsalB:resB.shinsal||[],
        zhiRel:compat.zhiRel, ganRel:compat.ganRel, score:compat.scores.total,
        at:row.created_at ? new Date(row.created_at).getTime() : Date.now()
      };
    }).filter(Boolean);
    var receivedList = receivedRows.map(function(row){
      var resB;
      try{ resB = computeSaju(row.inviter_saju); }catch(e){ return null; }
      var compat = computeCompat(STATE.mySaju, resB);
      return {
        id:'invited-by-'+row.inviter_device_id, _otherId:row.inviter_device_id, nameB:resB.name||'초대한 상대', fromInviter:true,
        dayGanWxA:STATE.mySaju.dayGanWx, dayGanWxB:resB.dayGanWx, dayGanB:resB.day.ganKr, cardPolarity:['甲','丙','戊','庚','壬'].indexOf(resB.day.gan)>=0?'yang':'yin',
        shinsalA:STATE.mySaju.shinsal||[], shinsalB:resB.shinsal||[],
        zhiRel:compat.zhiRel, ganRel:compat.ganRel, score:compat.scores.total,
        at:row.created_at ? new Date(row.created_at).getTime() : Date.now()
      };
    }).filter(Boolean);
    var byOther = {};
    sentList.concat(receivedList).forEach(function(e){
      var cur = byOther[e._otherId];
      if (!cur || (e.at||0) < (cur.at||0)) byOther[e._otherId] = e;
    });
    INVITE_MYROOM_CACHE = Object.keys(byOther).map(function(k){ return byOther[k]; })
      .sort(function(a,b){ return (b.at||0)-(a.at||0); });
  }).catch(function(){ INVITE_MYROOM_CACHE = []; })
  .then(function(){ renderMyRoom(); });
}
function renderMyRoomCloud(root){
  var docs = MYROOM_CLOUD_DOCS || [];
  if (!docs.length){
    root.innerHTML =
      '<p class="eyebrow">모두의 카드첩 <span class="chat-ai-badge">LIVE</span></p>'+
      '<div class="myroom-empty"><img class="myroom-empty-ill" src="'+MASCOT_EMPTY_IMG+'" alt="" width="84" height="84">'+

function wrapCanvasText(ctx, text, maxWidth, maxLines){
  var tokens = text.split(' ');
  var lines = [];
  var current = '';
  function pushChar(tok){
    var buf='';
    for (var i=0;i<tok.length;i++){
      var t2 = buf+tok[i];
      if (ctx.measureText(t2).width > maxWidth && buf){ lines.push(buf); buf=tok[i]; }
      else buf=t2;
    }
    return buf;
  }
  tokens.forEach(function(tok){
    var test = current ? current+' '+tok : tok;
    if (ctx.measureText(test).width <= maxWidth){
      current = test;
    } else {
      if (current) lines.push(current);
      current = (ctx.measureText(tok).width > maxWidth) ? pushChar(tok) : tok;
    }
  });
  if (current) lines.push(current);
  if (maxLines && lines.length > maxLines){
    lines = lines.slice(0, maxLines);
    var last = lines[maxLines-1];
    while (ctx.measureText(last+'…').width > maxWidth && last.length>1){ last = last.slice(0,-1); }
    lines[maxLines-1] = last+'…';
  }
  return lines;
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function drawShareOrnament(ctx, cx, cy){
  ctx.save();
  ctx.fillStyle = '#e0ad55';
  ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI*2); ctx.fill();
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(cx+7, cy-4, 13, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = .8;
  ctx.beginPath(); ctx.arc(cx+34, cy+6, 3, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = .5;
  ctx.beginPath(); ctx.arc(cx-30, cy+10, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function loadImageAsync(src){
  return new Promise(function(resolve){
    if (!src){ resolve(null); return; }
    var img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ resolve(null); };
    img.src = src;
  });
}
function drawShareAvatar(ctx, img, cx, cy, r, letter){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.closePath();
  ctx.fillStyle = '#1e2438'; ctx.fill();
  ctx.clip();
  if (img) ctx.drawImage(img, cx-r, cy-r, r*2, r*2);
  else {
    ctx.fillStyle = '#e0ad55';
    ctx.font = '700 '+Math.round(r*0.7)+'px "Noto Serif KR", serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(letter, cx, cy+Math.round(r*0.04));
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.lineWidth=4; ctx.strokeStyle='#e0ad55'; ctx.stroke();
}
/* 오행 색 점 + "목 일간"/"목 일진" 같은 라벨이 든 알약(pill) 칩 — 궁합/오늘운세/사주요약 카드 공용 */
function drawElementChip(ctx, cx, cy, wx, suffix){
  var hex = SHARE_ELEMENT_HEX[wx] || '#e0ad55';
  ctx.font='700 21px "Noto Sans KR", sans-serif';
  var label = wx ? (wx+' '+(suffix||'일간')) : '';
  var tw = ctx.measureText(label).width;
  var padX=14, dotR=5, h=34;
  var totalW = padX*2 + dotR*2 + 7 + tw;
  var x0 = cx - totalW/2;
  roundRectPath(ctx, x0, cy-h/2, totalW, h, h/2);
  ctx.fillStyle = hexToRgba(hex, .16);
  ctx.fill();
  ctx.beginPath(); ctx.arc(x0+padX+dotR, cy, dotR, 0, Math.PI*2); ctx.fillStyle=hex; ctx.fill();
  ctx.fillStyle = hex; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(label, x0+padX+dotR*2+7, cy+1);
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
}
/* 라벨(위, 회색) + 값(아래, 금색 굵게) 2줄짜리 칩을 가로로 n개 균등 배치 — 오늘의 행운/사주요약 보조정보용 */
function drawInfoChipsRow(ctx, cy, items, totalW){
  totalW = totalW || 940;
  var n = items.length, gap = 18;
  var chipW = (totalW - gap*(n-1))/n, chipH = 118;
  var x0 = (1080-totalW)/2;
  items.forEach(function(it, i){
    var cx = x0 + i*(chipW+gap);
    roundRectPath(ctx, cx, cy-chipH/2, chipW, chipH, 20);
    ctx.fillStyle = 'rgba(224,173,85,.08)'; ctx.fill();
    ctx.strokeStyle = 'rgba(224,173,85,.28)'; ctx.lineWidth=1; ctx.stroke();
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillStyle='#a1a8bd'; ctx.font='400 20px "Noto Sans KR", sans-serif';

function shareCardFrame(ctx, W, H, seed){
  roundRectPath(ctx, 0, 0, W, H, 56);
  ctx.clip();
  var bgGrad = ctx.createRadialGradient(W/2, H*0.26, 40, W/2, H*0.5, H*0.85);
  bgGrad.addColorStop(0,'#1c2340'); bgGrad.addColorStop(.55,'#121735'); bgGrad.addColorStop(1,'#080b18');
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,W,H);
  function rnd(i){ var x=Math.sin(seed+i*12.9898)*43758.5453; return x-Math.floor(x); }
  for (var i=0;i<56;i++){
    var sx=rnd(i)*W, sy=rnd(i+500)*H, sr=.8+rnd(i+900)*1.5;
    ctx.globalAlpha = .25+rnd(i+200)*.4;
    ctx.fillStyle = '#e0ad55';
    ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  roundRectPath(ctx, 24, 24, W-48, H-48, 40);
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(224,173,85,.3)'; ctx.stroke();
  drawShareOrnament(ctx, W/2, 78);
}

  ctx.fillStyle='#f3e6c8'; ctx.font='700 32px "Noto Serif KR", serif';

function drawPillarBox(ctx, cx, cy, w, h, label, p){
  roundRectPath(ctx, cx-w/2, cy-h/2, w, h, 18);
  ctx.fillStyle = 'rgba(224,173,85,.07)'; ctx.fill();
  ctx.strokeStyle = 'rgba(224,173,85,.26)'; ctx.lineWidth=1; ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#a1a8bd'; ctx.font='400 20px "Noto Sans KR", sans-serif';
  ctx.fillText(label, cx, cy-h/2+34);
  if (!p){
    ctx.fillStyle='#767e94'; ctx.font='700 40px "Noto Serif KR", serif';
    ctx.fillText('—', cx, cy+16);
    return;
  }
  ctx.fillStyle='#f3e6c8'; ctx.font='700 46px "Noto Serif KR", serif';
  ctx.fillText(p.gan+p.zhi, cx, cy+18);
  ctx.fillStyle='#8f97ae'; ctx.font='400 19px "Noto Sans KR", sans-serif';
  ctx.fillText(p.ganKr+p.zhiKr, cx, cy+46);
  var d1 = SHARE_ELEMENT_HEX[p.wxGan]||'#e0ad55', d2 = SHARE_ELEMENT_HEX[p.wxZhi]||'#e0ad55';
  ctx.beginPath(); ctx.arc(cx-8, cy-h/2+66, 4, 0, Math.PI*2); ctx.fillStyle=d1; ctx.fill();
  ctx.beginPath(); ctx.arc(cx+8, cy-h/2+66, 4, 0, Math.PI*2); ctx.fillStyle=d2; ctx.fill();
}

function hexToRgba(hex, a){
  var h = hex.replace('#','');
  var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

   실제로는 파일을 못 넘기고 자체 공유 UI(텍스트/링크 스타일)만 띄우는 경우가 흔해서,

/* 공유 카드(canvas) 공유 — 우선순위:
   1) kakaoShareImage: 카드 이미지를 카카오에 업로드해서 그 이미지가 꽂힌 피드 카드로 공유.
         가장 예쁘지만 Kakao.Share.uploadImage 한 단계가 더 있어서 간혹 실패한다.
            2) kakaoShare(plain): 업로드 없이 고정 브랜드 이미지로 카카오 피드 카드를 보낸다 — 초대
                  공유(doShare)에서 이미 안정적으로 동작 확인된 경로라, "카카오로 직접 공유"를 보장하는
                        진짜 핵심 폴백이다. 카카오톡 인앱 브라우저 안에서도 이 경로(SDK의 sendDefault)는 문제
                              없이 동작하므로 isKakaoInApp() 여부와 무관하게 먼저 시도한다.
                                 3) navigator.share(files): OS 공유시트를 띄워 그 안에서 카카오톡을 직접 고르게 한다. 다만
                                       카카오톡 인앱 브라우저는 canShare({files})가 true를 반환해도 실제로는 파일을 못 넘기는
                                             경우가 흔해서(파일 공유가 깨지고 텍스트/링크 공유처럼 뜸), 거기서는 이 단계를 건너뛴다.
                                                4) downloadCanvasImage: 위 세 가지가 전부 실패했을 때만 쓰는 최후의 수단(이미지 저장). */
   function shareImageBlob(canvas, blob, text, url, filename, kakaoTitle, buttonTitle){
        var downloadFallback = function(){
               downloadCanvasImage(canvas, filename, '카드 이미지가 저장됐어요! 카카오톡 채팅방에 직접 올려보세요 💕');
               maybeAwardShareBonus();
        };
        var fileShareFallback = function(){
               if (isKakaoInApp()){ downloadFallback(); return; }
       var file;
       try { file = new File([blob], filename, {type:'image/png'}); } catch(e){ file = null; }
       if (file && navigator.canShare && navigator.canShare({files:[file]})){
         navigator.share({ files:[file], title:kakaoTitle, text:text }).then(maybeAwardShareBonus).catch(function(err){
           if (err && err.name==='AbortError') return;
           downloadFallback();
         });
       } else {
         downloadFallback();
       }
     };
     var kakaoPlainFallback = function(){
       kakaoShare(text, url, buttonTitle).then(maybeAwardShareBonus).catch(fileShareFallback);
     };
     kakaoShareImage(kakaoTitle, text, blob, url, buttonTitle).then(maybeAwardShareBonus).catch(kakaoPlainFallback);
   }

/* ---- 마이룸: 내가 확인한 궁합 상대 로컬 저장(추후 마이룸 화면에서 사용) ---- */
var MYROOM_KEY = 'mysaju_myroom_v1';
function saveMyRoomEntry(resA, resB, compat, total, extra){
  var id = (extra && extra.id) ? extra.id : ('compat-'+resA.day.gan+resA.day.zhi+'-'+resB.day.gan+resB.day.zhi);
  var entry = Object.assign({
    id:id, nameB:resB.name||'상대방', dayGanWxA:resA.dayGanWx, dayGanWxB:resB.dayGanWx,
    genderA:resA.gender, genderB:resB.gender, dayGanB:resB.day.ganKr, cardPolarity:['甲','丙','戊','庚','壬'].indexOf(resB.day.gan)>=0?'yang':'yin',
    shinsalA:resA.shinsal||[], shinsalB:resB.shinsal||[],
    zhiRel:compat.zhiRel, ganRel:compat.ganRel, score:total, at:Date.now()
  }, extra||{});
  try{
    var raw = localStorage.getItem(MYROOM_KEY);
    var list = raw ? JSON.parse(raw) : [];
    var idx = list.findIndex(function(e){ return e.id===id; });
    if (idx>=0) list[idx]=entry; else list.unshift(entry);
    localStorage.setItem(MYROOM_KEY, JSON.stringify(list.slice(0,30)));
  }catch(e){}
  /* 가능하면 공개 갤러리(db)에도 반영 — 쓰기 권한이 없는 뷰어(View-only)는 조용히 로컬에만 남음 */
  if (DB_NS && MY_UID){
    try{
      var cloudEntry = Object.assign({ ownerId:MY_UID }, entry);
      var safeDocId = dbSafeId(MY_UID) + '_' + dbSafeId(id);
      DB_NS.collection('myroom_entries').doc(safeDocId).set(cloudEntry).catch(function(){ /* 쓰기 불가 뷰어 - 무시 */ });
    }catch(e){ /* 경로 생성 자체가 실패해도(doc()는 동기적으로 throw할 수 있음) 로컬 저장은 이미 끝났으므로 조용히 무시 */ }
  }
}

/* ---- 런타임 capability 초기화 (db/user/sample) : 미지원/미승인 시 모두 null로 남고 기존 로컬 기능으로 자연 대체 ---- */
var DB_NS = null, USER_NS = null, SAMPLE_NS = null, MY_UID = null;
function sample(input, opts){ return SAMPLE_NS ? SAMPLE_NS(input, opts) : Promise.reject({code:'not_granted', message:'sample unavailable'}); }
function initCapabilities(){
  if (!window.claude || !window.claude.use) return Promise.resolve();
  return Promise.all([
    window.claude.use('db').catch(function(){ return null; }),
    window.claude.use('user').catch(function(){ return null; }),
    window.claude.use('sample').catch(function(){ return null; })
  ]).then(function(res){
    DB_NS = res[0]; USER_NS = res[1]; SAMPLE_NS = res[2];
    if (USER_NS){
      return USER_NS.id().then(function(id){ MY_UID = id; }).catch(function(){});
    }
  }).catch(function(){});
}

var MENU_ICONS = {

};
var menuPreviousOverflow = '';
function closeSiteMenu(){
  if (!$('#site-menu-root').firstChild) return;
  $('#site-menu-root').innerHTML='';
  document.body.style.overflow=menuPreviousOverflow;
  $('#btn-open-menu').setAttribute('aria-expanded','false');
  document.removeEventListener('keydown', siteMenuKeydown);
  $('#btn-open-menu').focus();
}
function siteMenuKeydown(e){
  if(e.key==='Escape'){e.preventDefault();closeSiteMenu();return;}
  if(e.key!=='Tab')return;
  var buttons=$all('button:not([disabled])', $('#site-menu-root'));
  if(!buttons.length)return;
  var first=buttons[0],last=buttons[buttons.length-1];
  if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
}
function openSiteMenu(){
  var root=$('#site-menu-root');
  if(root.firstChild)return;
  menuPreviousOverflow=document.body.style.overflow;
  document.body.style.overflow='hidden';
  $('#btn-open-menu').setAttribute('aria-expanded','true');
  var rows=[['archive','보유 콘텐츠','구매한 콘텐츠와 리포트 다시 보기'],['saju','사주풀이','타고난 성향과 나의 강점'],['today','오늘의 운세','오늘부터 올해까지의 흐름'],['compat','궁합보기','두 사람의 기운과 관계'],['reports','콘텐츠','관심 있는 주제 둘러보기']];
  root.innerHTML='<div class="menu-backdrop" id="menu-backdrop"><aside class="site-menu" role="dialog" aria-modal="true" aria-labelledby="menu-title">'+
    '<div class="menu-top"><h2 id="menu-title">사주바라</h2><button type="button" class="header-icon-btn" id="menu-close" aria-label="전체 메뉴 닫기"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div>'+
    '<button type="button" class="menu-profile" id="menu-account" aria-expanded="false" aria-controls="menu-auth"><span class="menu-profile-mark">'+BRAND_MARK_SVG+'</span><span><strong id="menu-account-name">로그인하고 함께하기</strong><small id="menu-account-desc">카카오로 간편하게 시작해보세요</small></span></button>'+
    '<div class="menu-auth" id="menu-auth" hidden></div>'+
    '<div class="menu-nav">'+rows.map(function(row){return '<button type="button" class="menu-row" data-menu-tab="'+row[0]+'"><span class="menu-row-icon">'+MENU_ICONS[row[0]]+'</span><span><strong>'+row[1]+'</strong><small>'+row[2]+'</small></span><span class="menu-chevron" aria-hidden="true">›</span></button>';}).join('')+'</div>'+
    '<div id="menu-archive" hidden></div><p class="menu-footnote">나의 사주와 열어본 이야기는 현재 브라우저 기준으로 표시됩니다.</p></aside></div>';
  $('#menu-close').addEventListener('click',closeSiteMenu);
  $('#menu-account').addEventListener('click',function(){var panel=$('#menu-auth');panel.hidden=!panel.hidden;this.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)renderAuthPanel();});
  updateAccountMenu();
  $('#menu-backdrop').addEventListener('click',function(e){if(e.target.id==='menu-backdrop')closeSiteMenu();});
  $all('[data-menu-tab]',root).forEach(function(btn){btn.addEventListener('click',function(){var tab=btn.dataset.menuTab;if(tab==='archive'){renderMenuArchive();return;}closeSiteMenu();switchTab(tab);window.scrollTo({top:0,behavior:'instant'});});});
  document.addEventListener('keydown',siteMenuKeydown);
  $('#menu-close').focus();
}
function renderMenuArchive(){
  var target=$('#menu-archive');target.hidden=false;
  target.innerHTML='<h3>나의 이야기 보관함</h3><p class="section-desc">불러오는 중...</p>';
  Promise.all([pullReportUnlocks(),loadReportList()]).then(function(values){
    if(!target.isConnected)return;
    var list=values[1].filter(function(c){return reportStageOwned(c,'story');});
    target.innerHTML='<h3>나의 이야기 보관함</h3>'+(list.length ? '<div class="report-grid">'+list.map(reportCardHtml).join('')+'</div>' : '<p class="section-desc">아직 열어본 이야기가 없어요. 이야기 탭에서 이야기를 둘러보세요.</p>');
    if(list.length)$all('.report-card',target).forEach(function(el){el.addEventListener('click',function(){var c=list.filter(function(x){return String(x.id)===el.dataset.reportId;})[0];closeSiteMenu();if(c)openReportViewer(c);});});

}

var AUTH_URL='https://mmahxsblqlidphavqheu.supabase.co';
var AUTH_PUBLIC_KEY='sb_publishable_7XKAiWzXkHE8cS0gri228A_Y_Yu-Yq6';
var AUTH={client:null,loading:null,user:null,providers:{},settingsLoaded:false};
function authName(){var u=AUTH.user,m=u&&u.user_metadata||{};return u ? (m.name||m.full_name||m.preferred_username||'회원') : '';}
function updateAccountMenu(){
  var name=$('#menu-account-name');if(!name)return;
  name.textContent=AUTH.user ? authName()+'님, 반가워요' : '로그인하고 함께하기';
  $('#menu-account-desc').textContent=AUTH.user ? '로그인 계정 확인 · 로그아웃' : '카카오로 간편하게 시작해보세요';
  var panel=$('#menu-auth');if(panel&&!panel.hidden)renderAuthPanel();
}
function initAuth(){
  if(AUTH.loading)return AUTH.loading;
  AUTH.loading=new Promise(function(resolve,reject){
    if(window.supabase){resolve();return;}
    var script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.74.0/dist/umd/supabase.js';
    script.onload=resolve;script.onerror=function(){script.remove();reject(new Error('SDK_LOAD_FAILED'));};
    document.head.appendChild(script);
  }).then(async function(){
    AUTH.client=window.supabase.createClient(AUTH_URL,AUTH_PUBLIC_KEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    var result=await AUTH.client.auth.getSession();
    AUTH.user=result.data.session ? result.data.session.user : null;
    if(result.error){showToast('로그인을 완료하지 못했어요. 메뉴에서 다시 시도해주세요.');}
    else if(AUTH.user && new URLSearchParams(location.search).has('code')){var cleanUrl=new URL(location.href);cleanUrl.searchParams.delete('code');history.replaceState(null,'',cleanUrl.pathname+cleanUrl.search+cleanUrl.hash);}
    AUTH.client.auth.onAuthStateChange(function(event,session){AUTH.user=session ? session.user : null;updateAccountMenu();});
    updateAccountMenu();return AUTH.client;
  }).catch(function(error){AUTH.loading=null;throw error;});
  return AUTH.loading;
}
async function loadAuthProviders(){
  var response=await fetch(AUTH_URL+'/auth/v1/settings',{headers:{apikey:AUTH_PUBLIC_KEY}});
  if(!response.ok)throw new Error('AUTH_SETTINGS_FAILED');
  AUTH.providers=(await response.json()).external||{};AUTH.settingsLoaded=true;
}
function renderAuthPanel(){
  var panel=$('#menu-auth');if(!panel)return;
  if(AUTH.user){
    panel.innerHTML='<h3>나의 계정</h3><p>'+esc(authName())+'님으로 로그인되어 있어요. 사주와 구매 내역은 현재 브라우저에 보관됩니다.</p><button type="button" class="menu-logout" id="menu-logout">로그아웃</button><p id="menu-auth-message" role="status"></p>';
    $('#menu-logout').addEventListener('click',async function(){this.disabled=true;try{var result=await AUTH.client.auth.signOut({scope:'local'});if(result.error)throw result.error;AUTH.user=null;updateAccountMenu();}catch(e){this.disabled=false;var message=$('#menu-auth-message');if(message)message.textContent='로그아웃하지 못했어요. 다시 시도해주세요.';}});return;
  }
  var kakao='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.5 3 2 6.5 2 10.8c0 2.8 1.9 5.2 4.8 6.6l-1 3.5c-.1.4.2.6.5.4l4.2-2.7H12c5.5 0 10-3.5 10-7.8S17.5 3 12 3Z"/></svg>';
  function provider(id,label,icon){var available=AUTH.settingsLoaded&&AUTH.providers[id]===true;return '<button type="button" class="login-provider login-'+id+'" data-login-provider="'+id+'"'+(available?'':' disabled')+'>'+icon+'<span>'+label+'</span>'+(!available?'<span class="login-status">'+(AUTH.settingsLoaded?'준비 중':'확인 중')+'</span>':'')+'</button>';}
  panel.innerHTML='<h3>사주바라에 오신 걸 환영해요</h3><p>카카오 계정으로 간편하게 시작하세요.</p>'+provider('kakao','카카오로 시작하기',kakao)+'<p id="menu-auth-message" role="status">'+(AUTH.settingsLoaded&&!AUTH.providers.kakao?'카카오 로그인은 연결을 준비하고 있어요. 사주풀이는 로그인 없이 이용할 수 있어요.':'')+'</p>';
  $all('[data-login-provider]',panel).forEach(function(button){button.addEventListener('click',async function(){button.disabled=true;var message=$('#menu-auth-message');message.textContent='로그인 페이지로 이동 중...';try{var client=await initAuth();var result=await client.auth.signInWithOAuth({provider:button.dataset.loginProvider,options:{redirectTo:window.location.origin+window.location.pathname}});if(result.error)throw result.error;}catch(e){button.disabled=false;message.textContent='로그인을 시작하지 못했어요. 잠시 후 다시 시도해주세요.';}});});
  if(!AUTH.settingsLoaded)loadAuthProviders().then(function(){if(panel.isConnected&&!panel.hidden)renderAuthPanel();}).catch(function(){var message=$('#menu-auth-message');if(message)message.textContent='로그인 연결을 확인하지 못했어요. 메뉴를 닫고 다시 열어주세요.';});
}

function init(){
  var wantsReportAdmin = isReportAdminHash();
  if (wantsReportAdmin){
    history.replaceState(null, '', location.pathname + location.search);
  }
  var brandIc = $('#brand-mark-ic');
  if (brandIc) brandIc.innerHTML = BRAND_MARK_SVG;
  var ti1=$('#tab-ico-saju'), ti2=$('#tab-ico-today'), ti3=$('#tab-ico-compat'), ti4=$('#tab-ico-reports');
  if (ti1) ti1.innerHTML = TAB_ICON_SAJU;
  if (ti2) ti2.innerHTML = TAB_ICON_TODAY;
  if (ti3) ti3.innerHTML = TAB_ICON_COMPAT;
  if (ti4) ti4.innerHTML = TAB_ICON_REPORTS;
  $('#btn-open-menu').addEventListener('click',openSiteMenu);
  initAuth().catch(function(){/* Other features remain available if the auth SDK cannot load. */});
  var invited = initDevice();
  handleTossPaymentCallback();
  pullPaidUnlocks();
  pullReportUnlocks();
  var btnOpenInvite = $('#btn-open-invite'); if (btnOpenInvite) btnOpenInvite.addEventListener('click', openInviteSheet);
  (function(){
    var btn = $('#btn-sound-toggle'), ic = $('#sound-toggle-ic');
    function render(){
      var on = isSoundOn();
      btn.classList.toggle('is-on', on);
      ic.innerHTML = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>'+(on ? '<path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>' : '<path d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>')+'</svg>';
      btn.setAttribute('aria-label', on ? '효과음 끄기' : '효과음 켜기');
      btn.setAttribute('aria-pressed', String(on));
    }
    render();
    btn.addEventListener('click', function(){
      setSoundOn(!isSoundOn());
      render();
      if (isSoundOn()) soundTap();
    });
  })();

  loadState();
  initSajuForm();
  initSajuStoryForm();
  initVisualFeedback();
  initCompatView();
  var dateNow=new Date(),maxBirthday=dateNow.getFullYear()+'-'+String(dateNow.getMonth()+1).padStart(2,'0')+'-'+String(dateNow.getDate()).padStart(2,'0');
  $all('input[type="date"]').forEach(function(input){input.max=maxBirthday;});
  if (STATE.mySaju){
    renderSajuResult(STATE.mySaju);
    if (STATE.lastForm){
      try{
        var o = STATE.lastForm;
        $('#f-name').value = o.name||'';
        setSegSelection($('#f-gender'),o.gender==='m'||o.gender==='male'?'m':'f');
        setSegSelection($('#f-calendar'),o.isLunar?'lunar':'solar');
        $('#leap-row').hidden=!o.isLunar;$('#date-hint').hidden=!o.isLunar;$('#f-leap').checked=!!o.isLeapMonth;
        var y=o.year, m=String(o.month).padStart(2,'0'), d=String(o.day).padStart(2,'0');
        $('#f-date').value = y+'-'+m+'-'+d;
        if (!o.unknownTime){
          var hh=String(o.hour).padStart(2,'0'), mi=String(o.minute).padStart(2,'0');
          $('#f-time').value = hh+':'+mi;
        }
        $('#f-unknown-time').checked = !!o.unknownTime;
        $('#f-time').disabled = !!o.unknownTime;
        $('#f-city').value = o.city||'서울';
        $('#f-correction').checked = !!o.useCorrection;
      }catch(e){}
    }
    /* 이 기능이 생기기 전부터 쓰던 사람도, 다시 방문하면 한 번은 서버에 자기 사주를 올려서
       나를 초대한 사람 쪽 마이룸에도 카드가 뜰 수 있게 한다(그 전까진 사주를 다시 제출해야만 반영됨). */
    if (STATE.lastForm) saveMySajuToServer(STATE.lastForm);
  }

  var startTab = (location.hash||'').replace('#','');
  if (['saju','today','compat','reports'].indexOf(startTab)===-1) startTab='saju';
  switchTab(startTab);

  $all('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.dataset.tab);window.scrollTo({top:0,behavior:'instant'}); });
  });

  if (invited) showToast('친구 초대로 시작하셨네요! 사주를 등록하면 서로의 카드첩에 카드가 생겨요.');

  initCapabilities().then(function(){
    subscribeMyRoomCloud();
    renderMyRoom();
  });

  if (wantsReportAdmin) openReportAdminList();
}

if (document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
