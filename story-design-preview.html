<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사주바라 이야기 디자인 미리보기</title><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet"><style>
/* 레이아웃: 상단 고정 헤더 + 스크롤 콘텐츠 + 하단 고정 3탭 바를 가진 모바일 앱 셸.
   웹툰 포스터풍 다크 테마 — 짙은 자정 보라 배경 + 비비드 마젠타 액센트. */
:root{
  --bg:#070b1c; --surface:#0f1630; --surface-2:#16204a; --surface-3:#1c2b5e;
  --fg:#eef1fb; --fg-muted:#a7afc9; --fg-faint:#7a84a3;
  --accent:#ffd43b; --accent-ink:#000000; --accent-soft:rgba(255,212,59,0.18);
  --gold:#e0ad55; --gold-ink:#201604; --gold-soft:#3a2d12;
  --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.24);
  --shadow:0 8px 28px rgba(0,0,0,0.5);
  --el-wood:#44a386; --el-fire:#b12c00; --el-earth:#ab7400; --el-metal:#006e9a; --el-water:#7552db;
  --good:#4fcf7c; --bad:#ff6b6b;
  --font-display:'Black Han Sans',serif; --font-body:'Noto Sans KR',sans-serif; --font-heading:'Noto Sans KR',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font-body); line-height:1.62; -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:var(--font-heading); font-weight:700; text-wrap:balance; margin:0;}
p{margin:0;}
button{font-family:var(--font-body);}
img{max-width:100%;}
[hidden]{display:none!important;}
.app{
  max-width:480px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column;
}
/* ---------- 헤더 ---------- */
.app-header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding:12px 20px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--border);
}
.app-header .title-col{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1;}
.app-header .mark{font-family:var(--font-heading); font-weight:700; font-size:1.32rem; letter-spacing:0; flex:none; line-height:1.2; background:linear-gradient(135deg,#ffe066,#ffaa00); -webkit-background-clip:text; background-clip:text; color:transparent;}
.brand-mark{display:flex; align-items:center; gap:6px;}
.brand-ic{width:24px; height:24px; flex:none; display:block; position:relative;}
.brand-ic::before{
  content:''; position:absolute; inset:-7px; border-radius:50%; z-index:-1;
  background:radial-gradient(circle, rgba(255,212,59,.4), transparent 72%);
}
.brand-ic svg{width:100%; height:100%; display:block; position:relative;}
.app-header .sub{font-size:.74rem; color:var(--fg-muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left:30px;}
.header-actions{display:flex; align-items:center; gap:8px; flex:none;}
/* ---------- 콘텐츠 ---------- */
.content{flex:1; padding:18px 20px 28px; display:flex; flex-direction:column; gap:16px;}
.view{display:flex; flex-direction:column; gap:16px;}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 42%), var(--surface);
  border:1px solid var(--border); border-radius:18px;
  padding:20px 18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px; min-width:0;
}
.card.flat{box-shadow:none;}
   #c-b-kakao-pane{display:flex; flex-direction:column; gap:10px;}
.section-title{font-family:var(--font-heading); font-weight:700; font-size:1.06rem;}
.section-desc{font-size:.82rem; color:var(--fg-muted); line-height:1.65;}
.wx-badge{width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 0 3px rgba(255,255,255,0.06);}
.eyebrow{
  font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:700;
}
/* ---------- 폼 ---------- */
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:.82rem; font-weight:500; color:var(--fg-muted);}
.field input[type="text"], .field input[type="date"], .field input[type="time"], .field select{
  appearance:none; width:100%; border:1px solid var(--border-strong); border-radius:12px;
  background:var(--surface-2); color:var(--fg); padding:11px 12px; font-size:.95rem; font-family:var(--font-body);
}
.field input:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
.seg{display:flex; border:1px solid var(--border-strong); border-radius:12px; overflow:hidden;}
.seg button{
  flex:1; padding:10px 8px; background:var(--surface-2); color:var(--fg-muted); border:none;
  font-size:.88rem; font-weight:500; cursor:pointer; min-width:0;
}
.seg button.active{background:var(--accent); color:var(--accent-ink); font-weight:700;}
.check-row{display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--fg-muted);}
.check-row input{width:17px; height:17px; accent-color:var(--accent);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.hint{font-size:.74rem; color:var(--fg-faint);}
.btn-primary{
  width:100%; padding:14px; border-radius:14px; border:none; background:var(--accent); color:var(--accent-ink);
  font-size:1rem; font-weight:700; font-family:var(--font-body); cursor:pointer; letter-spacing:0;
  box-shadow:0 6px 20px rgba(224,173,85,.28); transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.btn-primary:active{opacity:.85; transform:scale(.98); box-shadow:0 2px 8px rgba(224,173,85,.22);}
.btn-primary:disabled{background:var(--surface-3); color:var(--fg-faint); box-shadow:none; cursor:not-allowed;}
.btn-secondary{
  width:100%; padding:12px; border-radius:14px; border:1px solid var(--border-strong); background:transparent;
  color:var(--fg); font-size:.9rem; font-weight:600; cursor:pointer;
}
.btn-link{background:none; border:none; color:var(--accent); font-weight:700; font-size:.85rem; padding:4px 0; cursor:pointer; text-align:left;}
/* ---------- 탭바 ---------- */
.tabs-bar{
  position:sticky; bottom:0; z-index:20; display:flex;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--surface); border-top:1px solid var(--border);
  max-width:480px; margin:0 auto; width:100%;
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
  background:none; border:none; color:var(--fg-faint); font-size:.72rem; font-weight:600; cursor:pointer;
}
.tab-btn .ico{width:22px; height:22px;}
.tab-btn.active{color:var(--accent);}
.tab-btn.active .ico{filter:none;}
/* ---------- 사주 기둥 ---------- */
.pillars{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.pillars.no-time{grid-template-columns:repeat(3,1fr);}
.pillar{
  display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 5px;
  background:var(--surface-2); border-radius:14px; min-width:0;
  border-top:3px solid var(--pillar-color,transparent);
}
.pillar-day{
  background:linear-gradient(165deg,var(--surface-3),var(--surface-2));
  box-shadow:0 0 0 1.5px var(--accent) inset;
}
.pillar-day .label{color:var(--accent);}
.pillar .label{font-size:.68rem; color:var(--fg-muted); font-weight:600;}
.pillar .hanja{font-family:var(--font-display); font-size:1.5rem; font-weight:700; line-height:1.15;}
.pillar .hangul{font-size:.76rem; color:var(--fg-muted);}
.pillar .wx{display:flex; gap:3px; margin-top:2px;}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none;}
/* ---------- 오행 범례/차트 ---------- */
.wx-chart-row{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.wx-donut-wrap{position:relative; width:92px; height:92px; flex:none;}
.wx-donut-wrap svg{position:absolute; inset:0;}
.wx-donut-center{
  position:absolute; inset:14px; border-radius:50%; background:var(--surface);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px;
}
.wx-donut-center .gan{font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--fg);}
.wx-donut-center .lb{display:inline-flex; align-items:center; gap:4px; font-size:.62rem; color:var(--fg-muted);}
.legend{display:flex; flex-direction:column; gap:11px; flex:1; min-width:140px;}
.legend-item{display:flex; align-items:center; gap:8px; font-size:.82rem;}
.legend-item .nm{flex:1; color:var(--fg);}
.legend-item .ct{color:var(--fg-muted); font-variant-numeric:tabular-nums;}
.wx-balance-row{display:flex; gap:9px; flex-wrap:wrap; margin-top:12px;}
.wx-balance-chip{
  display:inline-flex; align-items:center; gap:6px; font-size:.76rem; font-weight:700; padding:6px 12px; border-radius:999px;
  background:var(--chip-soft,var(--surface-2)); color:var(--fg);
}
.wx-balance-chip.muted{background:var(--surface-2); color:var(--fg-muted); font-weight:600;}
/* ---------- 게이지/진행바 ---------- */
.gauge{position:relative; height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden;}
.gauge > i{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:6px;}
.gauge-labels{display:flex; justify-content:space-between; font-size:.72rem; color:var(--fg-faint);}
/* ---------- 뱃지 ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px;
  background:var(--surface-2); font-size:.78rem; font-weight:600; border:1px solid var(--border);
}
.ss-table{display:flex; flex-direction:column; gap:10px;}
.ss-row{display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border-radius:12px; background:var(--surface-2); font-size:.86rem;}
.ss-row .pos{flex:none; color:var(--accent-ink); background:var(--accent); font-size:.68rem; font-weight:700; border-radius:999px; padding:3px 9px; margin-top:1px;}
.ss-row .nm{font-weight:700; width:48px; flex:none; padding-top:1px;}
.ss-row .desc{color:var(--fg-muted); font-size:.80rem; min-width:0; line-height:1.5;}
.empty-state{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding:40px 12px;}
.empty-state .big-ico{font-size:2.4rem;}
.disclaimer{font-size:.73rem; color:var(--fg-faint); line-height:1.6; padding-top:4px; border-top:1px solid var(--border);}
/* ---------- 오늘의 운세 ---------- */
.today-date{font-size:.84rem; color:var(--fg-muted);}
.today-ganzhi-panel{
  display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px; margin-top:4px;
  background:linear-gradient(135deg,var(--surface-3),var(--surface-2));
}
.today-ganzhi{display:flex; align-items:center; gap:10px;}
.today-ganzhi .hanja{font-family:var(--font-display); font-size:2.3rem; font-weight:700; line-height:1;}
.fortune-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.fortune-tile{
  background:var(--surface-2); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:6px; min-width:0;
  border-top:2.5px solid var(--tile-color,var(--accent));
}
.fortune-tile .ttl{font-size:.76rem; font-weight:700; color:var(--tile-color,var(--accent));}
.fortune-tile .body{font-size:.80rem; color:var(--fg); min-width:0;}
.lucky-row{display:flex; gap:10px;}
.lucky-chip{flex:1; background:var(--surface-3); border-radius:12px; padding:12px 10px; text-align:center; min-width:0; display:flex; flex-direction:column; gap:4px; align-items:center;}
.lucky-chip .ic{font-size:1.2rem;}
.lucky-chip .k{font-size:.68rem; color:var(--fg-muted);}
.lucky-chip .v{font-size:.84rem; font-weight:700; margin-top:1px;}
/* ---------- 궁합 ---------- */
.compat-people{display:flex; align-items:center; justify-content:center; gap:14px;}
.person-chip{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.8rem; min-width:0;}
.person-chip .av{
  width:46px; height:46px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center;
  justify-content:center; font-family:var(--font-body); font-weight:700; font-size:1.1rem; border:2px solid var(--border-strong);
  overflow:hidden;
}
.person-chip .av img{width:100%; height:100%; object-fit:cover; display:block;}
.compat-plus{color:var(--fg-faint); font-size:1.1rem;}
.score-ring-wrap{display:flex; flex-direction:column; align-items:center; gap:8px;}
.score-ring-outer{position:relative; width:128px; height:128px; display:flex; align-items:center; justify-content:center;}
.score-ring-outer::before{
  content:''; position:absolute; inset:-16px; border-radius:50%; opacity:.38; filter:blur(3px);
  background:radial-gradient(circle, var(--tier-color,var(--accent)) 0%, transparent 72%);
}
.score-ring-wrap .num{font-family:var(--font-body); font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums;}
.score-ring-wrap .lbl{font-size:.72rem; color:var(--fg-muted);}
.tier-chip{font-size:.76rem; font-weight:700; padding:4px 14px; border-radius:999px; display:inline-flex; align-items:center; gap:4px;}
.sub-scores{display:flex; flex-direction:column; gap:10px;}
.sub-score-row{display:flex; align-items:center; gap:10px; font-size:.82rem;}
.sub-score-row .nm{width:64px; flex:none; font-weight:600; color:var(--fg-muted);}
.sub-score-row .gauge{flex:1;}
.sub-score-row .pct{width:34px; flex:none; text-align:right; font-variant-numeric:tabular-nums; font-weight:700;}
.rel-line{display:flex; gap:8px; font-size:.84rem; align-items:flex-start;}
.rel-line .tag{flex:none; font-weight:700; color:var(--accent); font-size:.78rem; white-space:nowrap; padding-top:.1em;}
hr.sep{border:none; border-top:1px solid var(--border); margin:0;}
/* ---------- 마이룸 ---------- */
.myroom-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.myroom-count{font-size:.76rem; color:var(--fg-muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
.myroom-head-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.seg-sm{border-radius:9px;}
.seg-sm button{padding:5px 10px; font-size:.74rem;}
.myroom-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.myroom-card{
  position:relative; background:linear-gradient(165deg,var(--surface-2),var(--surface-3)); border-radius:16px; padding:14px 12px 12px;
  display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; min-width:0;
  border:1px solid var(--border); overflow:hidden; cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
}
.myroom-card:active{transform:scale(.96);}
.myroom-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.myroom-card:hover{box-shadow:0 5px 18px -6px var(--tier-color,var(--accent)), 0 2px 10px rgba(0,0,0,.08);}
.myroom-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:5px; background:var(--tier-color,var(--accent));
  box-shadow:0 2px 10px -1px var(--tier-color,var(--accent));
}
.myroom-card .av{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-body); font-weight:700; font-size:1.05rem; color:#fff; background:var(--tier-color,var(--accent));
  margin-top:4px; flex:none; box-shadow:0 0 0 4px var(--tier-soft,var(--surface-3)), 0 4px 12px -4px var(--tier-color,var(--accent));
}
.myroom-card .nm{font-weight:700; font-size:.88rem; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.myroom-card .sc{font-size:.72rem; color:var(--fg-muted); font-variant-numeric:tabular-nums;}
.myroom-score-bar{width:100%; height:5px; border-radius:999px; background:var(--surface-3); overflow:hidden; box-shadow:inset 0 0 0 1px var(--border);}
.myroom-score-fill{height:100%; border-radius:999px; background:var(--tier-color,var(--accent)); transition:width .3s ease;}
.myroom-badge{
  display:inline-flex; align-items:center; gap:4px; font-size:.7rem; font-weight:700; padding:3px 9px; border-radius:999px;
  background:var(--tier-soft,var(--surface-3)); color:var(--tier-color,var(--accent)); border:1px solid var(--tier-color,var(--accent));
}
.myroom-empty{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; padding:22px 10px; color:var(--fg-muted); font-size:.85rem;}
.myroom-empty-ill{width:84px; height:84px; border-radius:20px; display:block;}
.myroom-card .owner-tag{
  position:absolute; top:7px; left:8px; font-size:.6rem; font-weight:700; color:var(--fg-faint);
  background:var(--surface); border-radius:999px; padding:2px 7px; max-width:calc(100% - 16px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.myroom-sparkle{position:absolute; top:6px; right:8px; font-size:.95rem; animation:myroomTwinkle 1.6s ease-in-out infinite;}
.myroom-new{
  position:absolute; top:7px; left:8px; font-size:.6rem; font-weight:800; letter-spacing:.3px; color:#1c1406;
  background:var(--accent); border-radius:999px; padding:2px 7px;
}
@keyframes myroomTwinkle{0%,100%{opacity:.4; transform:scale(.9);}50%{opacity:1; transform:scale(1.15);}}
.myroom-card.is-legend{border-color:var(--tier-color,var(--accent)); box-shadow:0 0 0 1px var(--tier-color,var(--accent)), 0 4px 16px -4px var(--tier-color,var(--accent));}
.myroom-card.is-preview{width:100%; max-width:220px; margin:0 auto; padding:18px 16px 16px; gap:8px; cursor:default; flex-shrink:0;}
.myroom-card.is-preview:hover, .myroom-card.is-preview:active{box-shadow:0 0 0 1px var(--tier-color,var(--accent)), 0 4px 16px -4px var(--tier-color,var(--accent)); transform:none;}
.myroom-card.is-preview .nm{font-size:.92rem;}
.myroom-delete-btn{
  width:100%; padding:11px; border-radius:12px; border:1px solid rgba(224,90,90,.35); background:rgba(224,90,90,.08);
  color:var(--bad); font-size:.85rem; font-weight:700; cursor:pointer;
}
/* ---- 마이룸 카드 프레임(꾸미기, 크레딧 소비) ---- */
.myroom-card[data-frame]::after{
  content:''; position:absolute; inset:0; border-radius:16px; pointer-events:none;
  border:2px solid var(--frame-color,transparent); box-shadow:0 0 0 3px var(--frame-soft,transparent), 0 0 16px var(--frame-soft,transparent);
}
.myroom-card[data-frame="holo"]::after{
  border-color:rgba(255,255,255,.55);
  background:linear-gradient(115deg, rgba(255,120,180,0) 0%, rgba(255,210,120,.35) 18%, rgba(140,220,255,.35) 36%, rgba(190,140,255,.35) 54%, rgba(255,120,180,0) 72%);
  background-size:220% 220%;
  animation:myroomHolo 3.2s linear infinite;
  box-shadow:0 0 0 2px rgba(255,255,255,.4), 0 0 18px rgba(200,180,255,.35);
}
@keyframes myroomHolo{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
@media (prefers-reduced-motion: reduce){ .myroom-card[data-frame="holo"]::after{ animation:none; } }
.frame-picker{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.frame-swatch{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px 8px;
  border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; min-width:0;
}
.frame-swatch.active{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 2px 10px -3px var(--sw-color,var(--accent));}
.frame-swatch .ring{width:26px; height:26px; border-radius:50%; flex:none; border:2.5px solid var(--sw-color,var(--accent)); box-shadow:0 0 0 3px color-mix(in srgb, var(--sw-color,var(--accent)) 20%, transparent);}
.frame-swatch .ring.holo{border-color:rgba(255,255,255,.7); background:linear-gradient(115deg,#ff9ed6,#ffd27a,#8cdcff,#be8cff);}
.frame-swatch .lbl{font-size:.66rem; font-weight:700; color:var(--fg-muted); text-align:center;}
.frame-swatch .pr{font-size:.62rem; color:var(--fg-faint);}
.frame-swatch .pr.owned{color:var(--good);}
.frame-swatch.none-swatch .ring{border-style:dashed; border-color:var(--border-strong);}
/* ---- 마이룸 도감(수집 앨범) ---- */
.myroom-dex-btn{
  display:inline-flex; align-items:center; gap:4px; border:1px solid var(--border-strong); background:var(--surface-2);
  color:var(--fg); border-radius:999px; padding:5px 11px; font-size:.72rem; font-weight:700; cursor:pointer; flex:none;
}
.dex-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.dex-cell{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
  padding:16px 10px; border-radius:14px; background:var(--surface-2); border:1.5px solid var(--border);
}

.report-card{

.report-card::after{

}

.report-cost-badge.unlocked{color:#fff; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.32);}
/* 이야기 리포트 — 팝업(바텀시트)이 아니라 전체 화면 전용 페이지(.report-page)로 열리고,
   본문도 "글이 메인, 이미지는 부속"이 아니라 이미지가 화면을 꽉 채우며 쭉 이어지는 웹툰형
   스크롤로 구성한다. 이미지가 있는 섹션은 풀블리드 패널로, 이미지가 없는(아직 준비 안 된)
   섹션은 나레이션 박스처럼 작게 묶어서 "이미지 빠진 느낌"이 아니라 의도된 캡션처럼 보이게 한다. */
.report-page{
  overscroll-behavior-y:contain; touch-action:pan-y;
  position:fixed; inset:0; z-index:45; max-width:480px; margin:0 auto;
  background:var(--surface); overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column;
}
.report-page-topbar{
  position:sticky; top:0; z-index:3; flex:none; display:flex; align-items:center; gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:linear-gradient(to bottom, rgba(7,11,28,.88), rgba(7,11,28,.88) 65%, transparent);
}
.report-page-back{
  width:32px; height:32px; border-radius:50%; border:none; flex:none; padding:0;
  display:flex; align-items:center; justify-content:center; font-size:1.25rem; line-height:1;
  background:rgba(255,255,255,.16); color:#fff; cursor:pointer;
}
.report-page-topbar-title{
  font-size:.86rem; font-weight:700; color:#fff; opacity:.92;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.report-page-hero{position:relative; width:100%; aspect-ratio:4/5; overflow:hidden; flex:none; background:var(--surface-2); margin-top:-48px;}
.report-page-hero.no-img{background:linear-gradient(145deg, var(--surface-2), var(--surface-3));}
.report-page-hero img{width:100%; height:100%; object-fit:cover; display:block;}
.report-page-hero-grad{position:absolute; left:0; right:0; bottom:0; height:60%; background:linear-gradient(to bottom, transparent, rgba(7,11,28,.94));}
.report-page-hero-text{position:absolute; left:20px; right:20px; bottom:18px;}
.report-page-eyebrow{font-size:.72rem; font-weight:700; color:var(--accent); letter-spacing:.04em; margin:0 0 5px;}
.report-page-title{font-size:1.3rem; font-weight:800; color:#fff; margin:0; line-height:1.32; text-wrap:balance;}
.report-page-body{padding:24px 20px calc(30px + env(safe-area-inset-bottom,0px));}
.report-article{display:flex; flex-direction:column; gap:26px;}
.report-section{position:relative;}
.report-section-img{
  display:block; width:calc(100% + 40px); margin:0 -20px 12px; aspect-ratio:4/3; overflow:hidden; background:var(--surface-2);
}
.report-section-img img{width:100%; height:100%; object-fit:cover; display:block;}
.report-caption{font-size:.92rem; line-height:1.85; color:var(--fg); margin:0;}
/* 아직 이미지가 없는 섹션은 작은 나레이션 박스로 묶어서, 글도 짧게 끊어 보이고 "컷 사이 설명"
   처럼 읽히게 한다 — 화면 전체를 글로 채우지 않는다. */
.report-section:not(.has-img){background:var(--surface-2); border-radius:14px; padding:16px 18px;}
.report-section:not(.has-img) .report-caption{font-size:.88rem; line-height:1.78; color:var(--fg-muted);}
/* 잠긴 뒷부분은 통째로 숨기지 않고 실제 글/이미지를 보여주다가 아래로 갈수록 배경색으로 서서히
   흐려지게(gradient fade) 해서, "이 아래로도 진짜 이야기가 더 있다"는 느낌을 준다. */
.report-article-fade-wrap{position:relative; max-height:420px; overflow:hidden; margin-top:-4px;}
.report-article-fade-wrap::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:200px;
  background:linear-gradient(to bottom, transparent, var(--surface) 92%); pointer-events:none;
}
.report-callout{border-radius:14px; padding:18px 20px; text-align:center;}
   .report-callout .report-caption{font-size:.9rem; line-height:1.8; margin:0;}
   .report-callout.formal{
        background:linear-gradient(160deg, rgba(255,212,59,.14), rgba(255,212,59,.04));
        border:1px solid rgba(255,212,59,.38);
   }
   .report-callout.formal .report-caption{color:var(--fg); letter-spacing:.01em;}
   .report-callout.warning{
        background:rgba(255,93,93,.09);
        border:1px solid rgba(255,93,93,.4);
   }
   .report-callout.warning .report-caption{color:#ffd0d0;}.report-caption + .report-caption{margin-top:12px;}.report-section.has-img .report-caption:not(:first-child){margin-top:12px;}
   .mini-teaser-card{
        display:flex; gap:12px; align-items:flex-start; padding:14px 16px;
        background:var(--surface-2); border-radius:14px; border:1px dashed var(--border-strong);
   }
   .mini-teaser-card .mini-teaser-lock{font-size:1.1rem; flex:none; line-height:1.4;}
   .mini-teaser-title{font-size:.84rem; font-weight:700; color:var(--fg); margin:0 0 6px;}
   .mini-teaser-list{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px;}
   .mini-teaser-list li{font-size:.78rem; color:var(--fg-muted); padding-left:16px; position:relative;}
   .mini-teaser-list li::before{content:'✓'; position:absolute; left:0; color:var(--accent); font-weight:700;}
   .review-strip{display:flex; flex-direction:column; gap:12px;}
      #report-panel-list .mini-teaser-card, #report-panel-list .review-strip, #report-panel-list .locked-card, #report-panel-list .share-btn{margin-top:22px;}

/* ---- 결과 공개(reveal) 연출 ---- */
.reveal-overlay{
  position:fixed; inset:0; z-index:500;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 42%, rgba(35,29,20,.97) 0%, rgba(13,17,32,.99) 72%);
  opacity:0; transition:opacity .4s ease;
}
.reveal-overlay.show{opacity:1;}
.reveal-overlay.hide{opacity:0; pointer-events:none;}
.reveal-inner{display:flex; flex-direction:column; align-items:center; gap:16px; padding:0 30px; text-align:center;}
.reveal-mark{width:54px; height:54px; position:relative;}
.reveal-mark svg{width:100%; height:100%; animation:revealSpin 2.4s linear infinite; display:block;}
.reveal-mark::after{content:''; position:absolute; inset:-16px; border-radius:50%; background:radial-gradient(circle, rgba(224,173,85,.38), transparent 70%); animation:revealPulse 1.7s ease-in-out infinite;}
.reveal-txt{font-family:var(--font-body); font-weight:700; font-size:1.02rem; line-height:1.6; color:#f3e6c8; letter-spacing:0;}
.reveal-sub{font-size:.8rem; color:rgba(255,255,255,.52);}
.reveal-dots span{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--accent); margin:0 3px; opacity:.35; animation:revealDot 1.2s ease-in-out infinite;}
.reveal-dots span:nth-child(2){animation-delay:.15s;}
.reveal-dots span:nth-child(3){animation-delay:.3s;}
@keyframes revealSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@keyframes revealPulse{0%,100%{opacity:.45; transform:scale(.88);}50%{opacity:1; transform:scale(1.18);}}
@keyframes revealDot{0%,80%,100%{opacity:.3; transform:translateY(0);}40%{opacity:1; transform:translateY(-3px);}}
.reveal-fadeup{animation:revealFadeUp .6s cubic-bezier(.22,.9,.32,1) both;}
@keyframes revealFadeUp{0%{opacity:0; transform:translateY(16px);}100%{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){
  .reveal-mark svg, .reveal-mark::after, .reveal-dots span, .reveal-fadeup{animation:none;}
}

-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-1.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"eager\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>잠깐. 왜 나는 늘 같은 순간에 망설이지?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>휴대폰을 보다가 문득 생각했어요. 만나고 싶다는 \u003cstrong>내 마음\u003c/strong>보다, 상대가 어떻게 받아들일지를 더 걱정하고 있더라고요.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-2\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-2.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>답장 한 줄인데, 왜 이렇게 생각이 많아질까?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>당신의 \u003cstrong>일간\u003c/strong> 임(수)을 기준으로 보면, \u003cstrong>상대의 반응\u003c/strong>을 여러 번 예상하다가 정작 하고 싶은 말을 늦게 꺼낼 수 있어요. 우연히 다시 만난 그 사람 앞에서도 망설이게 될까요?\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-3\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-3.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>다음 주에도… 시간 괜찮아요?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>한참 웃으며 이야기하다 그 사람이 먼저 다음 약속을 물었어요. 정말 반가웠는데, 막상 대답하려니 또 망설여졌어요. 왜 설레는 순간마다 걱정부터 하게 될까요?\u003c/p>\u003c/div>\u003c/section>\u003cp class=\"story-cliffhanger\">당신의 사주에는, 이 망설임을 설명할 어떤 이유가 있을까요?\u003c/p>\u003cdiv class=\"story-locked-preview\" aria-hidden=\"true\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-4.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cspan>아직 꺼내지 않은, 나의 이야기\u003c/span>\u003c/div>\u003csection class=\"story-gate reader-offer\" data-gate=\"story\">\u003cspan class=\"story-lock\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5ZM12 14v3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/span>\u003cp class=\"reader-kicker\">이야기를 끝까지 읽으면\u003c/p>\u003ch2>나는 왜 관계에서\u003cbr>늘 비슷하게 망설일까요?\u003c/h2>\u003cp>내 사주에 맞춘 주인공의 이야기를 따라가며\u003cbr>\u003cstrong>끌림·표현·관계의 속도\u003c/strong>를 살펴보세요.\u003c/p>\u003cul class=\"offer-benefits\">\u003cli>내가 끌리는 사람과 마음을 표현하는 방식\u003c/li>\u003cli>가까워질 때 망설이는 이유와 반복되는 관계 패턴\u003c/li>\u003cli>12개 장면의 웹툰과 장면별 사주 해석\u003c/li>\u003c/ul>\u003cp class=\"offer-outcome\">읽고 나면: 내가 편안한 관계와 힘들어지는 순간을 구분하는 데 참고할 수 있어요.\u003c/p>\u003cbutton type=\"button\" class=\"btn-primary report-stage-buy\" data-stage=\"story\">이야기 열기 · 4,900원\u003c/button>\u003cp class=\"reader-price-note\">1회 결제 · 이 이야기 소장\u003cbr>세부 리포트는 선택 시 별도 12,900원 · 모두 구매 시 총 17,800원\u003c/p>\u003c/section>\u003csection class=\"detail-bridge\">\u003cp class=\"reader-kicker\">이야기에서 발견한 나, 그 다음\u003c/p>\u003ch2>내 성향을 알았다면,\u003cbr>이제 구체적인 방법을 찾아보세요.\u003c/h2>\u003cp>왜 그런 선택을 하는지 사주의 근거를 살펴보고,\u003cbr>실제 상황에서 해볼 행동과 주의할 점을 정리해드려요.\u003c/p>\u003cdiv class=\"detail-sample\">\u003cspan>나의 세부 리포트\u003c/span>\u003ch3>타고난 성향과 반복되는 선택\u003c/h3>\u003cdiv class=\"report-sample-lines\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cspan class=\"sample-lock\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5ZM12 14v3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"story-gate reader-offer\" data-gate=\"detail\">\u003cspan class=\"story-lock\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5ZM12 14v3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/span>\u003cp class=\"reader-kicker\">이유를 알고, 다음 행동까지\u003c/p>\u003ch2>내 상황에 맞춰,\u003cbr>어떻게 행동하면 좋을까요?\u003c/h2>\u003cp>사주의 해석 근거부터 상황별 행동 지침까지.\u003cbr>\u003cstrong>20개 주제\u003c/strong>로 읽고 필요한 내용을 다시 찾아볼 수 있어요.\u003c/p>\u003cul class=\"offer-benefits\">\u003cli>일간·오행·십신으로 살펴보는 연애와 관계의 패턴\u003c/li>\u003cli>연락·고백·갈등·거리 두기 등 8가지 상황별 대응\u003c/li>\u003cli>바로 써볼 대화 예시, 주의할 점, 일주일 실천 계획\u003c/li>\u003c/ul>\u003cp class=\"offer-outcome\">활용하기: 혼자 추측하기 쉬운 상황에서 내 마음을 정리하고, 상대에게 어떤 말로 요청할지 준비해보세요.\u003c/p>\u003cbutton type=\"button\" class=\"btn-primary report-stage-buy\" data-stage=\"detail\">세부 리포트 열기 · 12,900원\u003c/button>\u003cp class=\"reader-price-note\">선택 구매 · 이야기와 별도 결제 · 1회 결제\u003c/p>\u003c/section>\u003cp class=\"detail-prerequisite\">세부 리포트는 이야기를 연 뒤 선택할 수 있어요.\u003c/p>\u003c/div>","0-f-1":"\u003cdiv class=\"reader-cover\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-0.webp?v=reader-2.1\" alt=\"\">\u003cdiv>\u003cp class=\"reader-kicker\">디자인 확인용 · 예시\u003c/p>\u003ch1>운명의 사람은 언제 올까\u003c/h1>\u003cp>내 선택을 돌아보는 나의 사주 이야기\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"report-page-body\">\u003cdiv class=\"reader-owned-badge\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4 10-10\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg> 이야기 보유\u003c/div>\u003csection class=\"story-opening-v2\">\u003cp class=\"reader-kicker\">인연이 시작되는 마음\u003c/p>\u003ch2>좋아하는 마음 앞에서,\u003cbr>나는 왜 늘 망설일까.\u003c/h2>\u003c/section>\u003csection class=\"story-frame scene-0\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-0.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"eager\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>먼저 연락해볼까? 너무 갑작스러우려나?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>밤 열한 시. 잘 들어갔냐는 짧은 인사도 선뜻 보내지 못하고 몇 번이나 고쳤어요.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-1\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-1.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"eager\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>잠깐. 왜 나는 늘 같은 순간에 망설이지?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>휴대폰을 보다가 문득 생각했어요. 만나고 싶다는 \u003cstrong>내 마음\u003c/strong>보다, 상대가 어떻게 받아들일지를 더 걱정하고 있더라고요.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-2\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-2.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>답장 한 줄인데, 왜 이렇게 생각이 많아질까?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>당신의 \u003cstrong>일간\u003c/strong> 임(수)을 기준으로 보면, \u003cstrong>상대의 반응\u003c/strong>을 여러 번 예상하다가 정작 하고 싶은 말을 늦게 꺼낼 수 있어요. 우연히 다시 만난 그 사람 앞에서도 망설이게 될까요?\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-3\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-3.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>다음 주에도… 시간 괜찮아요?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>한참 웃으며 이야기하다 그 사람이 먼저 다음 약속을 물었어요. 정말 반가웠는데, 막상 대답하려니 또 망설여졌어요. 왜 설레는 순간마다 걱정부터 하게 될까요?\u003c/p>\u003c/div>\u003c/section>\u003cp class=\"story-cliffhanger\">당신의 사주에는, 이 망설임을 설명할 어떤 이유가 있을까요?\u003c/p>\u003cdiv class=\"story-sequence\">\u003csection class=\"story-frame scene-4\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-4.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>괜히 기대했다가, 나만 진지한 거면 어떡하지?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>돌아오는 길. 잘됐던 대화보다 말하지 못한 한마디가 오래 남았습니다.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-5\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-5.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>만나고 싶다고 말하는 게 그렇게 부담스러운 일일까?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>손이 닿을 만큼 가까이 앉아 있었는데도, 솔직한 한마디는 쉽게 나오지 않았어요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 reader-kicker\">디자인 확인용 · 예시\u003c/p>\u003ch1>운명의 사람은 언제 올까\u003c/h1>\u003cp>내 선택을 돌아보는 나의 사주 이야기\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"report-page-body\">\u003cdiv class=\"reader-owned-badge\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4 10-10\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg> 이야기 보유 · 세부 리포트 보유\u003c/div>\u003csection class=\"story-opening-v2\">\u003cp class=\"reader-kicker\">인연이 시작되는 마음\u003c/p>\u003ch2>좋아하는 마음 앞에서,\u003cbr>나는 왜 늘 망설일까.\u003c/h2>\u003c/section>\u003csection class=\"story-frame scene-0\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-0.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"eager\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>먼저 연락해볼까? 너무 갑작스러우려나?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>밤 열한 시. 잘 들어갔냐는 짧은 인사도 선뜻 보내지 못하고 몇 번이나 고쳤어요.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-1\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-1.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"eager\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>잠깐. 왜 나는 늘 같은 순간에 망설이지?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>휴대폰을 보다가 문득 생각했어요. 만나고 싶다는 \u003cstrong>내 마음\u003c/strong>보다, 상대가 어떻게 받아들일지를 더 걱정하고 있더라고요.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-2\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-2.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>답장 한 줄인데, 왜 이렇게 생각이 많아질까?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>당신의 \u003cstrong>일간\u003c/strong> 임(수)을 기준으로 보면, \u003cstrong>상대의 반응\u003c/strong>을 여러 번 예상하다가 정작 하고 싶은 말을 늦게 꺼낼 수 있어요. 우연히 다시 만난 그 사람 앞에서도 망설이게 될까요?\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-3\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-3.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>다음 주에도… 시간 괜찮아요?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>한참 웃으며 이야기하다 그 사람이 먼저 다음 약속을 물었어요. 정말 반가웠는데, 막상 대답하려니 또 망설여졌어요. 왜 설레는 순간마다 걱정부터 하게 될까요?\u003c/p>\u003c/div>\u003c/section>\u003cp class=\"story-cliffhanger\">당신의 사주에는, 이 망설임을 설명할 어떤 이유가 있을까요?\u003c/p>\u003cdiv class=\"story-sequence\">\u003csection class=\"story-frame scene-4\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-4.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>괜히 기대했다가, 나만 진지한 거면 어떡하지?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>돌아오는 길. 잘됐던 대화보다 말하지 못한 한마디가 오래 남았습니다.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-5\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-5.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>만나고 싶다고 말하는 게 그렇게 부담스러운 일일까?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>손이 닿을 만큼 가까이 앉아 있었는데도, 솔직한 한마디는 쉽게 나오지 않았어요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-6\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-6.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>만나고 싶은 건 맞아. 그런데 나는 뭘 기다리고 있을까?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>상대가 먼저 확신을 주길 기다리다 보니, 정작 내가 원하는 건 말하지 못하고 있었어요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-7\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-7.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>같은 사람을 좋아해도, 같은 속도일 필요는 없잖아.\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>나는 자주 보고 싶고, 상대는 천천히 알아가고 싶을 수도 있어요. 그 차이를 마음의 크기로 단정하지 않기로 했어요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-8\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-8.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>이번엔 잘 보이려는 말 대신, 내 마음을 한 줄 써보자.\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>메시지를 다시 써봤어요. 이번에는 상대가 듣고 싶어 할 말보다, 내가 정말 하고 싶은 말을 적었어요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-9\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-f-9.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>왜 자꾸 끌렸는지, 이제 조금 알 것 같아.\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>나에게 부족한 기운을 관계에 비유하면, 함께 새로운 일을 해보고 싶게 만드는 사람에게 눈길이 갈 수 있어요. 실제로 내가 편안했던 관계와도 비교해보세요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/s u003cdiv class=\"report-analysis-text\">\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003cdiv class=\"report-analysis-text\">\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"report-analysis\" id=\"premium-01\">\u003cspan class=\"reader-kicker\">나를 이해하는 해석 · 01\u003c/span>\u003ch2>해석을 읽는 순서와 나의 기준\u003c/h2>\u003cp class=\"report-caption\">이 리포트는 입력한 사주의 \u003cstrong>일간\u003c/strong> 임(수), \u003cstrong>오행\u003c/strong> 분포, \u003cstrong>신강·신약\u003c/strong>과 표면에 드러난 십신을 함께 살펴봅니다. \u003cstrong>일간\u003c/strong>은 기본 성향을 설명하는 기준이고, \u003cstrong>오행\u003c/strong> 분포는 어떤 방식의 반응이 상대적으로 두드러지는지 보는 보조 기준입니다. 같은 \u003cstrong>오행\u003c/strong>이라도 삶의 경험과 환경에 따라 표현은 달라집니다.\u003c/p>\u003cp class=\"report-caption\">현재 분포는 목 0개, 화 1개, 토 1개, 금 0개, 수 6개입니다. 수의 관찰과 이해 성향이 상대적으로 두드러지고, 목의 성장과 확장 성향은 의식적으로 연습할 부분으로 읽습니다. 동률일 때는 화면의 대표 기운이 하나만 표시되므로 숫자도 함께 확인해주세요.\u003c/p>\u003cp class=\"report-caption\">기운의 개수만으로 좋고 나쁜 사주를 판단할 수는 없습니다. 강한 기운은 익숙한 방식이고 약한 기운은 아직 덜 쓰는 방식에 가깝습니다. 아래 설명 중 실제 경험과 맞는 부분을 표시하고, 맞지 않는 부분은 억지로 자신에게 적용하지 마세요.\u003c/p>\u003c/section>\u003csection class=\"report-analysis\" id=\"premium-02\">\u003cspan class=\"reader-kicker\">나를 이해하는 해석 · 02\u003c/span>\u003ch2>가까워질 때 드러나는 나의 성향\u003c/h2>\u003cp class=\"report-caption\">바로 결론을 내기보다 상황을 관찰하고 여러 가능성을 생각하는 흐름입니다.\u003c/p>\u003cp class=\"report-caption\">이 성향은 특정 상대와의 인연을 보장하는 지표가 아니라 가까워지는 과정에서 무엇을 중요하게 느끼는지 점검하는 실마리입니다. 처음 편안함을 느낀 순간, 서운함이 생긴 순간, 대화를 피한 순간 하나씩을 떠올리며 내가 원했던 반응을 적어보세요.\u003c/p>\u003cp class=\"report-caption\">충분히 이해하고 싶은 마음 때문에 표현이나 실행이 뒤로 밀릴 수 있어요. 정보를 더 모을 시간과 실제로 선택할 시간을 따로 정해보세요.\u003c/p>\u003cp class=\"report-caption\">상대의 말보다 내가 붙인 의미가 감정을 키웠는지도 살펴보세요. 실제로 들은 말, 내가 해석한 뜻, 느낀 감정을 세 줄로 분리하면 대화에서 확인할 질문이 더 명확해집니다.\u003c/p>\u003c/section>\u003csection class=\"report-analysis\" id=\"premium-03\">\u003cspan class=\"reader-kicker\">나를 이해하는 해석 · 03\u003c/span>\u003ch2>잘하는 표현과 놓치기 쉬운 표현\u003c/h2>\u003cp class=\"report-caption\">대표 기운 수는 이미 자주 사용하는 방식이고, 보완 기운 목는 반대 성격의 사람을 반드시 찾아야 한다는 뜻이 아닙니다. 스스로 덜 사용하던 행동을 조금씩 늘리는 접근이 현실적입니다.\u003c/p>\u003cp class=\"report-caption\">새로운 가능성이 보이면 경험을 넓히려는 쪽으로 마음이 움직입니다. 이 반응을 일주일에 한 번 작은 상황에서 시도해보세요. 선택을 늘리기 전에 이미 시작한 일 하나를 끝내는 기준을 정해보세요.\u003c/p>\u003cp class=\"report-caption\">예를 들어 속마음을 잘 정리하지만 말하지 못한다면 긴 설명 대신 한 문장으로 요청해보세요. 표현은 빠르지만 \u003cstrong>상대의 반응\u003c/strong>을 기다리기 어렵다면 질문 뒤에 바로 해결책을 덧붙이지 않는 연습부터 시작할 수 있습니다.\u003c/p>\u003cp class=\"report-caption\">보완의 목표는 성격을 뒤집는 것이 아니라 사용할 수 있는 선택지를 늘리는 것입니다. 실천 후에는 잘했는지 못했는지보다 이전과 어떤 차이가 있었는지, 다음에는 무엇을 줄이거나 늘릴지 기록해주세요.\u003c/p>\u003c/section>\u003csection class=\"report-analysis\" id=\"premium-04\">\u003cspan class=\"reader-kicker\">나를 이해하는 해석 · 04\u003c/span>\u003ch2>내 판단을 믿을 때와 주변에 맞출 때\u003c/h2>\u003cp class=\"report-caption\">신강으로 계산됐어요. 스스로 결정하고 자기 기준을 지키는 성향을 중심으로 살펴볼게요. 주도성이 도움이 되는 상황과, 자신의 속도가 주변의 속도를 앞지르는 상황을 구분하는 것이 핵심입니다.\u003c/p>\u003cp class=\"report-caption\">관계의 방향을 내가 먼저 정하고 싶을 때, 상대가 원하는 속도도 구체적으로 물어보세요. 동의 없이 대신 결정하는 행동은 배려로 시작해도 부담으로 전해질 수 있습니다.\u003c/p>\u003cp class=\"report-caption\">신강은 우수하고 신약은 부족하다는 순위가 아닙니다. 본 서비스의 계산은 \u003cstrong>오행\u003c/strong>과 지지의 간단한 지지 구조를 기반으로 한 성향 참고치입니다. 전문 명리 상담에서 사용하는 용신·격국 판단 전체를 대신하지 않습니다.\u003c/p>\u003c/section>\u003csection class=\"report-analysis\" id=\"premium-05\">\u003cspan class=\"reader-kicker\">나를 이해하는 해석 · 05\u003c/span>\u003ch2>십신으로 살펴보는 관계의 역할\u003c/h2>\u003cp class=\"report-caption\">표면에 표시된 십신은 연주 \u003cstrong>편재\u003c/strong>, 월주 \u003cstrong>정재\u003c/strong>, 시주 식신입니다. 각 기둥을 특정 사건이 반드시 일어나는 시기로 단정하지 않고, 사주에 나타난 반응의 성격을 이해하는 보조 정보로 사용합니다.\u003c/p>\u003cp class=\"report-caption\">관계에서 재성·관성 같은 십신은 책임, 표현, 기준을 설명하는 전통적인 해석 도구입니다. 상대의 성별이나 연애 형태를 제한하는 근거로 사용하지 않습니다. 누가 이끌어야 하는지보다 두 사람이 역할을 어떻게 합의하는지가 실제 관계에 더 직접적인 영향을 줍니다.\u003c/p>\u003cp class=\"report-caption\">연락, 약속, 비용, 감정 표현 중 내가 자연스럽게 맡는 역할과 부담스럽게 맡는 역할을 구분해보세요. 상대가 알아주길 기다리는 대신 역할을 조정할 수 있는 구체적인 부탁 한 가지를 정해보면 해석을 대화로 연결할 수 있습니다.\u003c/p>\u003c/section>\u003csection class=\"report-analysis\" id=\"premium-06\">\u003cspan class=\"reader-kicker\">나를 이해하는 해석 · 06\u003c/span>\u003ch2>자주 겪는 상황에서 먼저 확인할 것\u003c/h2>\u003cp class=\"report-caption\">답장이 늦어 불안할 때: 확인된 사실과 예상한 이유를 구분해보세요. 상대의 마음을 단정하기 전에 평소 연락 기준을 이야기할 수 있는 시간을 잡아보세요. 나의 수 성향에서는 충분히 이해하고 싶은 마음 때문에 표현이나 실행이 뒤로 밀릴 수 있어요. 이 점을 참고하되 실제 상황의 정보와 상대의 의사를 우선해주세요.\u003c/p>\u003cp class=\"report-caption\">서운함을 말하기 어려울 때: 상대를 평가하는 문장보다 상황, 내 감정, 원하는 행동을 순서대로 말해보세요. 예를 들면 약속이 바뀔 때 미리 알려주면 마음이 편하다는 식입니다. 나의 수 성향에서는 충분히 이해하고 싶은 마음 때문에 표현이나 실행이 뒤로 밀릴 수 있어요. 이 점을 참고하되 실제 상황의 정보와 상대의 의사를 우선해주세요.\u003c/p>\u003cp class=\"report-caption\">갈등에서 결론을 서두를 때: 해결해야 할 문제와 지금 진정해야 할 감정을 구분해보세요. 대화를 멈춘다면 다시 이야기할 시간을 함께 정해두는 편이 좋습니다. 나의 수 성향에서는 충분히 이해하고 싶은 마음 때문에 표현이나 실행이 뒤로 밀릴 수 있어요. 이 점을 참고하되 실제 상황의 정보와 상대의 의사를 우선해주세요.\u003c/p>\u003cp class=\"report-caption\">좋아하는데 확신이 없을 때: 설렘, 편안함, 존중받는 느낌을 따로 적어보세요. 한 가지 감정만으로 모든 판단을 대신하지 말고, 실제 행동에서 반복적으로 확인되는 부분을 살펴보세요. 나의 수 성향에서는 충분히 이해하고 싶은 마음 때문에 표현이나 실행이 뒤로 밀릴 수 있어요. 이 점을 참고하되 실제 상황의 정보와 상대의 의사를 우선해주세요.\u003c/p>\u003c/section>\u003csection class=\"report-analysis\" id=\"premium-07\">\u003cspan class=\"reader-kicker\">나를 이해하는 해석 · 07\u003c/span>\u003ch2>일주일 실천 계획과 다시 읽는 방법\u003c/h2>\u003cp class=\"report-caption\">1일차에는 위 설명에서 경험과 맞는 문장 세 가지를 표시하고 구체적인 사례를 한 개씩 적어보세요. 2일차에는 맞지 않는 설명도 적어두세요. 리포트와 현실을 비교하는 과정이 자신의 패턴을 정확히 이해하는 데 도움이 됩니다.\u003c/p>\u003cp class=\"report-caption\">3~4일차에는 표현하지 못했던 마음을 안전한 상황에서 한 문장으로 전해보세요. 5일차에는 \u003cstrong>상대의 반응\u003c/strong>과 내가 예상했던 반응의 차이를 기록하세요. 6일차에는 다음 대화에서 유지할 행동 하나를 선택해보세요.\u003c/p>\u003cp class=\"report-caption\">7일차에는 변화가 있었던 행동, 부담스러웠던 행동, 다음 주에 줄일 행동을 한 가지씩 정리하세요. 효과가 없었던 연습을 의무처럼 유지할 필요는 없습니다. 실천의 크기를 줄이거나 다른 상황에서 다시 시도해볼 수 있습니다.\u003c/p>\u003cp class=\"report-caption\">한 달 뒤에는 같은 리포트를 다시 읽으며 달라진 사례를 메모해보세요. 본문은 구매 당시에도 이후에도 동일한 사주 입력에 대한 해석입니다. 매번 새로운 사건을 예언하는 방식이 아니라 경험을 비교하고 선택을 정리하는 자료로 활용해주세요.\u003c/p>\u003c/section>\u003csection class=\"report-analysis situation-guide\" id=\"premium-08\">\u003cp class=\"reader-kicker\">상황별 가이드 · 01\u003c/p>\u003ch2>답장이 늦어 불안할 때\u003c/h2>\u003cp class=\"report-caption\">평소보다 연락이 늦어 혼자 여러 이유를 예상하는 상황이에요.\u003c/p>\u003cdiv class=\"guide-personal\">\u003cstrong>내 성향에 맞춰\u003c/strong>\u003cp>수 기운의 관찰 성향이 두드러져요. 더 생각할 시간뿐 아니라 직접 물어보거나 결정할 시한도 정해보세요.\u003c/p>\u003c/div>\u003cdl class=\"guide-actions\">\u003cdiv>\u003cdt>이렇게 해보세요\u003c/dt>\u003cdd>마지막 연락 시간과 평소 연락 습관처럼 확인된 사실을 먼저 보세요. 급한 용건이 아니라면 메시지를 연달아 보내기보다 다음 대화에서 연락 기준을 물어보세요.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>말해볼 문장\u003c/dt>\u003cdd>말해볼 문장: 바쁠 때는 답장이 늦어도 괜찮아. 우리 둘 다 편한 연락 방식이 어떤 건지 이야기해볼까?\u003c/dd>\u003c/div>\u003cdiv class=\"guide-caution\">\u003cdt>주의할 점\u003c/dt>\u003cdd>답장 한 번으로 마음을 단정하지 마세요. 다만 약속한 연락을 반복해서 무시한다면 그 행동 자체는 따로 이야기할 필요가 있어요.\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"report-analysis situation-guide\" id=\"premium-09\">\u003cp class=\"reader-kicker\">상황별 가이드 · 02\u003c/p>\u003ch2>마음을 고백하거나 다음 약속을 잡을 때\u003c/h2>\u003cp class=\"report-caption\">좋아하는 마음은 있지만 부담을 줄까 봐 말을 못 꺼내는 상황이에요.\u003c/p>\u003cdiv class=\"guide-personal\">\u003cstrong>내 성향에 맞춰\u003c/strong>\u003cp>수 기운의 관찰 성향이 두드러져요. 더 생각할 시간뿐 아니라 직접 물어보거나 결정할 시한도 정해보세요.\u003c/p>\u003c/div>\u003cdl class=\"guide-actions\">\u003cdiv>\u003cdt>이렇게 해보세요\u003c/dt>\u003cdd>상대의 마음을 미리 판단하기보다 내 바람을 짧게 전하고 선택할 여지를 주세요. 구체적인 제안 한 번이면 충분해요.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>말해볼 문장\u003c/dt>\u003cdd>말해볼 문장: 너랑 이야기하는 시간이 좋았어. 괜찮으면 다음 주에 둘이 밥 먹을래?\u003c/dd>\u003c/div>\u003cdiv class=\"guide-caution\">\u003cdt>주의할 점\u003c/dt>\u003cdd>답을 재촉하거나 거절 이유를 캐묻지 마세요. 망설임이나 거절도 상대의 선택으로 존중해야 해요.\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"report-analysis situation-guide\" id=\"premium-10\">\u003cp class=\"reader-kicker\">상황별 가이드 · 03\u003c/p>\u003ch2>만나는 속도가 다를 때\u003c/h2>\u003cp class=\"report-caption\">나는 자주 만나고 싶은데 상대는 혼자 보내는 시간이 더 필요한 상황이에요.\u003c/p>\u003cdiv class=\"guide-personal\">\u003cstrong>내 성향에 맞춰\u003c/strong>\u003cp>수 기운의 관찰 성향이 두드러져요. 더 생각할 시간뿐 아니라 직접 물어보거나 결정할 시한도 정해보세요.\u003c/p>\u003c/div>\u003cdl class=\"guide-actions\">\u003cdiv>\u003cdt>이렇게 해보세요\u003c/dt>\u003cdd>원하는 만남 횟수와 혼자 쉬는 시간을 각각 말해보세요. 당장 가능한 일정으로 한 번 맞춰보고 편했는지 다시 확인하세요.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>말해볼 문장\u003c/dt>\u003cdd>말해볼 문장: 나는 일주일에 한 번쯤 만나면 좋겠어. 너에게 편한 횟수는 어느 정도야?\u003c/dd>\u003c/div>\u003cdiv class=\"guide-caution\">\u003cdt>주의할 점\u003c/dt>\u003cdd>희생한 횟수를 계산하며 상대를 압박하지 마세요. 차이가 계속 크다면 억지로 맞추기보다 서로 감당할 수 있는지 살펴보세요.\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"report-analysis situation-guide\" id=\"premium-11\">\u003cp class=\"reader-kicker\">상황별 가이드 · 04\u003c/p>\u003ch2>서운한 마음을 꺼내야 할 때\u003c/h2>\u003cp class=\"report-caption\">참고 넘긴 일이 반복돼 작은 일에도 예민해지는 상황이에요.\u003c/p>\u003cdiv class=\"guide-personal\">\u003cstrong>내 성향에 맞춰\u003c/strong>\u003cp>수 기운의 관찰 성향이 두드러져요. 더 생각할 시간뿐 아니라 직접 물어보거나 결정할 시한도 정해보세요.\u003c/p>\u003c/div>\u003cdl class=\"guide-actions\">\u003cdiv>\u003cdt>이렇게 해보세요\u003c/dt>\u003cdd>최근 사건 하나만 골라 상황, 감정, 바라는 행동을 순서대로 말하세요. 상대가 알고 있었는지도 먼저 확인해보세요.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>말해볼 문장\u003c/dt>\u003cdd>말해볼 문장: 약속이 당일에 바뀌어서 당황했어. 다음에는 알게 되는 대로 먼저 말해주면 좋겠어.\u003c/dd>\u003c/div>\u003cdiv class=\"guide-caution\">\u003cdt>주의할 점\u003c/dt>\u003cdd>항상 그렇다거나 원래 그런 사람이라는 평가를 피하세요. 여러 문제를 한 번에 꺼내면 무엇을 바꿀지 합의하기 어려워져요.\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"report-analysis situation-guide\" id=\"premium-12\">\u003cp class=\"reader-kicker\">상황별 가이드 · 05\u003c/p>\u003ch2>다툼이 커질 것 같을 때\u003c/h2>\u003cp class=\"report-caption\">목소리가 커지고 같은 말을 반복해 대화가 풀리지 않는 상황이에요.\u003c/p>\u003cdiv class=\"guide-personal\">\u003cstrong>내 성향에 맞춰\u003c/strong>\u003cp>수 기운의 관찰 성향이 두드러져요. 더 생각할 시간뿐 아니라 직접 물어보거나 결정할 시한도 정해보세요.\u003c/p>\u003c/div>\u003cdl class=\"guide-actions\">\u003cdiv>\u003cdt>이렇게 해보세요\u003c/dt>\u003cdd>진정할 시간을 갖자고 말하고 다시 대화할 시간을 정하세요. 돌아온 뒤에는 해결할 문제 하나와 서로 원하는 행동부터 확인하세요.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>말해볼 문장\u003c/dt>\u003cdd>말해볼 문장: 지금은 감정이 격해져서 잘 듣기 어려워. 잠깐 쉬고 오늘 저녁에 다시 이야기하자.\u003c/dd>\u003c/div>\u003cdiv class=\"guide-caution\">\u003cdt>주의할 점\u003c/dt>\u003cdd>말없이 사라지거나 침묵으로 벌주지 마세요. 모욕·위협·강압이 있다면 대화 기술보다 내 안전과 도움을 받을 방법이 우선이에요.\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"report-analysis situation-guide\" id=\"premium-13\">\u003cp class=\"reader-kicker\">상황별 가이드 · 06\u003c/p>\u003ch2>내 시간과 기준을 지키고 싶을 때\u003c/h2>\u003cp class=\"report-caption\">상대에게 맞추다 내가 쉬거나 해야 할 일을 계속 미루는 상황이에요.\u003c/p>\u003cdiv class=\"guide-personal\">\u003cstrong>내 성향에 맞춰\u003c/strong>\u003cp>수 기운의 관찰 성향이 두드러져요. 더 생각할 시간뿐 아니라 직접 물어보거나 결정할 시한도 정해보세요.\u003c/p>\u003c/div>\u003cdl class=\"guide-actions\">\u003cdiv>\u003cdt>이렇게 해보세요\u003c/dt>\u003cdd>가능한 것과 어려운 것을 함께 말하세요. 거절 뒤에 지킬 수 있는 대안이 있다면 제안하되, 무리한 보상 약속은 하지 마세요.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>말해볼 문장\u003c/dt>\u003cdd>말해볼 문장: 오늘은 쉬어야 해서 만나기 어려워. 대신 토요일 오후는 괜찮아.\u003c/dd>\u003c/div>\u003cdiv class=\"guide-caution\">\u003cdt>주의할 점\u003c/dt>\u003cdd>비밀번호·위치 공유나 인간관계 제한을 사랑의 증명으로 요구하는 상황은 조심하세요. 친밀함이 내 선택권을 없애지는 않아요.\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"report-analysis situation-guide\" id=\"premium-14\">\u003cp class=\"reader-kicker\">상황별 가이드 · 07\u003c/p>\u003ch2>이 관계가 나에게 맞는지 고민될 때\u003c/h2>\u003cp class=\"report-caption\">설렘은 있지만 존중받는 느낌이 부족하거나 자주 지치는 상황이에요.\u003c/p>\u003cdiv class=\"guide-personal\">\u003cstrong>내 성향에 맞춰\u003c/strong>\u003cp>수 기운의 관찰 성향이 두드러져요. 더 생각할 시간뿐 아니라 직접 물어보거나 결정할 시한도 정해보세요.\u003c/p>\u003c/div>\u003cdl class=\"guide-actions\">\u003cdiv>\u003cdt>이렇게 해보세요\u003c/dt>\u003cdd>좋았던 말보다 반복되는 행동을 적어보세요. 약속, 거절 존중, 갈등 뒤 책임지는 태도를 각각 확인하고 불편한 부분을 대화로 물어보세요.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>말해볼 문장\u003c/dt>\u003cdd>점검 질문: 싫다고 말해도 존중받나요? 문제가 생기면 함께 해결하나요? 나는 내 모습으로 편하게 있을 수 있나요?\u003c/dd>\u003c/div>\u003cdiv class=\"guide-caution\">\u003cdt>주의할 점\u003c/dt>\u003cdd>궁합 점수나 사주만으로 계속 만날지 결정하지 마세요. 반복되는 무시와 통제는 실제 행동을 기준으로 판단해야 해요.\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"report-analysis situation-guide\" id=\"premium-15\">\u003cp class=\"reader-kicker\">상황별 가이드 · 08\u003c/p>\u003ch2>관계가 끝난 뒤 다시 시작하고 싶을 때\u003c/h2>\u003cp class=\"report-caption\">외로움 때문에 연락하고 싶지만 같은 문제가 반복될까 걱정되는 상황이에요.\u003c/p>\u003cdiv class=\"guide-personal\">\u003cstrong>내 성향에 맞춰\u003c/strong>\u003cp>수 기운의 관찰 성향이 두드러져요. 더 생각할 시간뿐 아니라 직접 물어보거나 결정할 시한도 정해보세요.\u003c/p>\u003c/div>\u003cdl class=\"guide-actions\">\u003cdiv>\u003cdt>이렇게 해보세요\u003c/dt>\u003cdd>그리운 감정과 끝났던 이유를 따로 적으세요. 다시 만난다면 실제로 달라져야 할 행동이 무엇인지 구체적으로 확인하세요.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>말해볼 문장\u003c/dt>\u003cdd>스스로 묻기: 외로움을 줄이고 싶은 건가요, 이 사람과 다시 만나고 싶은 건가요? 이전 문제를 함께 해결할 변화가 있나요?\u003c/dd>\u003c/div>\u003cdiv class=\"guide-caution\">\u003cdt>주의할 점\u003c/dt>\u003cdd>상대가 연락을 원하지 않는다고 밝혔다면 반복해서 연락하지 마세요. 재회를 확답하는 문구보다 현재 의사와 행동을 우선하세요.\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"report-action\">\u003cp class=\"reader-kicker\">읽고 난 뒤, 한 가지\u003c/p>\u003ch2>마음의 흐름을 기록해보세요.\u003c/h2>\u003cp>편안했던 관계와 지쳤던 관계를 하나씩 떠올려보세요. 그때 내가 표현한 마음과 참았던 마음을 나눠 적어보면 반복되는 패턴을 살펴볼 수 있어요.\u003c/p>\u003c/section>\u003cp class=\"disclaimer\">명리학의 오행·신강·신약을 바탕으로 한 참고용 콘텐츠입니다. 특정 사건이나 수익, 만남의 시기를 보장하지 않습니다.\u003c/p>\u003c/section>\u003cbutton type=\"button\" class=\"share-btn\" id=\"btn-share-report\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M12 16V3m-5 5 5-5 5 5M5 13v7h14v-7\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg> 이 이야기 공유하기\u003c/button>\u003c/div>","0-m-0":"\u003cdiv class=\"reader-cover\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-0.webp?v=reader-2.1\" alt=\"\">\u003cdiv>\u003cp class=\"reader-kicker\">디자인 확인용 · 예시\u003c/p>\u003ch1>운명의 사람은 언제 올까\u003c/h1>\u003cp>내 선택을 돌아보는 나의 사주 이야기\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"report-page-body\">\u003csection class=\"story-opening-v2\">\u003cp class=\"reader-kicker\">인연이 시작되는 마음\u003c/p>\u003ch2>좋아하는 마음 앞에서,\u003cbr>나는 왜 늘 망설일까.\u003c/h2>\u003c/section>\u003csection class=\"story-frame scene-0\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-0.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"eager\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>먼저 연락해볼까? 너무 갑작스러우려나?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>밤 열한 시. 잘 들어갔냐는 짧은 인사도 선뜻 보내지 못하고 몇 번이나 고쳤어요.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-1\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-1.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"eager\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>잠깐. 왜 나는 늘 같은 순간에 망설이지?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>휴대폰을 보다가 문득 생각했어요. 만나고 싶다는 \u003cstrong>내 마음\u003c/strong>보다, 상대가 어떻게 받아들일지를 더 걱정하고 있더라고요.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-2\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-2.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>답장 한 줄인데, 왜 이렇게 생각이 많아질까?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>당신의 \u003cstrong>일간\u003c/strong> 임(수)을 기준으로 보면, \u003cstrong>상대의 반응\u003c/strong>을 여러 번 예상하다가 정작 하고 싶은 말을 늦게 꺼낼 수 있어요. 우연히 다시 만난 그 사람 앞에서도 망설이게 될까요?\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-3\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-3.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>다음 주에도… 시간 괜찮아요?\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>한참 웃으며 이야기하다 그 사람이 먼저 다음 약속을 물었어요. 정말 반가웠는데, 막상 대답하려니 또 망설여졌어요. 왜 설레는 순간마다 걱정부터 하게 될까요?\u003c/p>\u003c/div>\u003c/section>\u003cp class=\"story-cliffhanger\">당신의 사주에는, 이 망설임을 설명할 어떤 이유가 있을까요?\u003c/p>\u003cdiv class=\"story-locked-preview\" aria-hidden=\"true\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-4.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cspan>아직 꺼내지 않은, 나의 이야기\u003c/span>\u003c/div>\u003csection class=\"story-gate reader-offer\" data-gate=\"story\">\u003cspan class=\"story-lock\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5ZM12 14v3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/span>\u003cp class=\"reader-kicker\">이야기를 끝까지 읽으면\u003c/p>\u003ch2>나는 왜 관계에서\u003cbr>늘 비슷하게 망설일까요?\u003c/h2>\u003cp>내 사주에 맞춘 주인공의 이야기를 따라가며\u003cbr>\u003cstrong>끌림·표현·관계의 속도\u003c/strong>를 살펴보세요.\u003c/p>\u003cul class=\"offer-benefits\">\u003cli>내가 끌리는 사람과 마음을 표현하는 방식\u003c/li>\u003cli>가까워질 때 망설이는 이유와 반복되는 관계 패턴\u003c/li>\u003cli>12개 장면의 웹툰과 장면별 사주 해석\u003c/li>\u003c/ul>\u003cp class=\"offer-outcome\">읽고 나면: 내가 편안한 관계와 힘들어지는 순간을 구분하는 데 참고할 수 있어요.\u003c/p>\u003cbutton type=\"button\" class=\"btn-primary report-stage-buy\" data-stage=\"story\">이야기 열기 · 4,900원\u003c/button>\u003cp class=\"reader-price-note\">1회 결제 · 이 이야기 소장\u003cbr>세부 리포트는 선택 시 별도 12,900원 · 모두 구매 시 총 17,800원\u003c/p>\u003c/section>\u003csection class=\"detail-bridge\">\u003cp class ass=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-7\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-7.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>같은 사람을 좋아해도, 같은 속도일 필요는 없잖아.\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>나는 자주 보고 싶고, 상대는 천천히 알아가고 싶을 수도 있어요. 그 차이를 마음의 크기로 단정하지 않기로 했어요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-8\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-8.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>이번엔 잘 보이려는 말 대신, 내 마음을 한 줄 써보자.\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>메시지를 다시 써봤어요. 이번에는 상대가 듣고 싶어 할 말보다, 내가 정말 하고 싶은 말을 적었어요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-9\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-9.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>왜 자꾸 끌렸는지, 이제 조금 알 것 같아.\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>나에게 부족한 기운을 관계에 비유하면, 함께 새로운 일을 해보고 싶게 만드는 사람에게 눈길이 갈 수 있어요. 실제로 내가 편안했던 관계와도 비교해보세요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-10\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-10.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>좋아하는 마음을 말했으니, 이제 상대의 속도도 기다려볼래.\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>\u003cstrong>내 마음\u003c/strong>을 말하고 상대의 생각도 물어보면, 혼자 추측할 때보다 서로를 이해하기 쉬워져요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\u003cstrong>내 마음\u003c/strong>을 말하기 전에 \u003cstrong>상대의 반응\u003c/strong>을 너무 오래 예상하고 있지는 않은지 살펴보세요.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"story-frame scene-11\">\u003cdiv class=\"story-illustration\">\u003cimg src=\"/assets/webtoon/reader-v2/love-m-11.webp?v=reader-2.1\" alt=\"마음과 관계를 돌아보는 이야기 장면\" loading=\"lazy\" decoding=\"async\">\u003c/div>\u003cdiv class=\"story-dialogue\">\u003cspan class=\"dialogue-mark\" aria-hidden=\"true\">“\u003c/span>\u003cp>저도 좋아요. 다음 주에 만나요.\u003c/p>\u003c/div>\u003cdiv class=\"story-voice\">\u003cp>답을 보내고 나니 마음이 조금 편해졌어요. 결과를 미리 알 수는 없지만, 적어도 \u003cstrong>내 마음\u003c/strong>은 제대로 전했으니까요.\u003c/p>\u003cdiv class=\"scene-insight\">\u003cspan class=\"insight-label\">나의 사주로 보면\u003c/span>\u003cp class=\"report-caption\">수 기운을 관계에 비유하면 상대의 마음을 이해하려고 여러 가능성을 생각하는 모습이에요.\u003c/p>\u003cp class=\"report-caption\">\
