<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<title>별첩 입력 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1026;--ink-2:#141c3b;--gold:#e9c27a;--gold-2:#f6dca0;--cream:#f6eedf;--muted:#a3aac4;--line:#e9c27a55;
  --serif:'Noto Serif KR',serif;--sans:'Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font-family:var(--sans);letter-spacing:-.02em;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}

/* ---------- 하늘: 시간대마다 다른 색을 겹쳐 두고 바꿔요 ---------- */
.sky{position:fixed;inset:0;z-index:0}
.sky i{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.sky i.on{opacity:1}
.sky .t-base{opacity:1;background:radial-gradient(120% 70% at 50% 100%,#1d2752 0,#0f1633 45%,#0b1026 100%)}
.sky .t-night{background:linear-gradient(180deg,#060a1c 0,#121a42 55%,#27306a 100%)}
.sky .t-dawn{background:linear-gradient(180deg,#1b1a46 0,#4d3f7e 45%,#a7739a 75%,#e3a99a 100%)}
.sky .t-morning{background:linear-gradient(180deg,#2a4377 0,#5f7fb3 45%,#c9b3c2 75%,#f4cf9c 100%)}
.sky .t-day{background:linear-gradient(180deg,#2f5e9e 0,#5f93cf 45%,#a9cbe6 75%,#f5e2b0 100%)}
.sky .t-evening{background:linear-gradient(180deg,#221b47 0,#5b3567 45%,#b45f6f 75%,#f0a26c 100%)}
.dust{position:fixed;inset:0;z-index:1;pointer-events:none}
.dust b{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw var(--t) var(--d) ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}

/* ---------- 펼친 책: 아래에 깔리는 무대 ---------- */
.book{position:fixed;left:0;right:0;bottom:0;height:min(25vh,210px);z-index:2;pointer-events:none;transition:opacity .4s,transform .6s}
.book img{width:100%;height:100%;object-fit:cover;object-position:center 100%;-webkit-mask-image:linear-gradient(to top,#000 60%,transparent);mask-image:linear-gradient(to top,#000 60%,transparent)}
.book::after{content:'';position:absolute;inset:30% 0 10%;background:linear-gradient(100deg,transparent 30%,#fff3d455 48%,transparent 62%);transform:translateX(-120%);opacity:0}
.book.turn::after{animation:sheen 1s ease-out}
.book.turn{animation:lift 1s ease-out}
@keyframes sheen{0%{opacity:1;transform:translateX(-120%)}100%{opacity:0;transform:translateX(120%)}}
@keyframes lift{40%{transform:translateY(-6px)}}
body.kb .book,body.p3 .book{opacity:0;transform:translateY(30px)}
body.p4 .book{opacity:.9}

/* ---------- 화면 틀 ---------- */
.app{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 0 0}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:40px}
.top .brand{font-family:var(--serif);font-size:1rem;color:var(--gold-2);letter-spacing:-.04em}
.top button{border:0;background:none;color:var(--muted);font-size:.8125rem;padding:8px 0}

/* 별자리: 여덟 글자 = 여덟 별 */
.cons{position:relative;margin:6px 18px 0;height:96px}
.cons svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cons line{stroke:var(--gold);stroke-width:1;opacity:0;transition:opacity .9s ease .2s}
.cons line.on{opacity:.75}
.cons .st{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;display:grid;place-items:center}
.cons .st::before{content:'';width:6px;height:6px;border-radius:50%;background:#ffffff40;transition:all .5s}
.cons .st::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff6d8 0,#f3c46b 22%,#f3c46b00 66%);opacity:0;transform:scale(.3);transition:opacity .5s,transform .6s cubic-bezier(.3,1.6,.5,1)}
.cons .st.on::before{background:#fff8e6;width:7px;height:7px}
.cons .st.on::after{opacity:1;transform:scale(1);animation:pulse 3s 1s ease-in-out infinite}
.cons .st.q::before{background:none;border:1px dashed #ffffff55;width:8px;height:8px}
@keyframes pulse{50%{transform:scale(.8);opacity:.7}}
.cons .ring{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:1px solid var(--gold-2);pointer-events:none;animation:ring .8s ease-out forwards}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.cons .lb{position:absolute;bottom:-4px;font-size:.6875rem;color:#ffffff40;transform:translateX(-50%);transition:color .5s;letter-spacing:.1em}
.cons .lb.on{color:var(--gold)}

/* ---------- 책장(한 질문씩) ---------- */
.pages{position:relative;flex:1;perspective:1200px;overflow:hidden}
.page{position:absolute;inset:0;padding:30px 26px 0;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;pointer-events:none;transform:translateX(46px) rotateY(-10deg);transform-origin:left center;transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.page.on{opacity:1;pointer-events:auto;transform:none}
.page.out{opacity:0;transform:translateX(-46px) rotateY(10deg);transform-origin:right center}
.page>*{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .6s}
.page.on>*{opacity:1;transform:none}
.page.on>*:nth-child(2){transition-delay:.08s}.page.on>*:nth-child(3){transition-delay:.16s}.page.on>*:nth-child(4){transition-delay:.24s}.page.on>*:nth-child(5){transition-delay:.32s}
.kicker{margin:0 0 10px;font-size:.75rem;letter-spacing:.24em;color:var(--gold)}
.q{margin:0;font-family:var(--serif);font-weight:600;font-size:1.625rem;line-height:1.45;letter-spacing:-.04em;color:var(--cream);word-break:keep-all}
.sub{margin:10px 0 0;font-size:.875rem;line-height:1.6;color:var(--muted);word-break:keep-all}

/* 이름 */
.line-input{margin-top:34px;width:min(300px,100%);border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--cream);font-family:var(--serif);font-size:1.75rem;text-align:center;padding:6px 0 10px;outline:0;transition:border-color .3s}
.line-input::placeholder{color:#ffffff38;font-size:1.25rem}
.line-input:focus{border-color:var(--gold)}
.actions{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.btn{min-width:200px;height:52px;padding:0 28px;border:0;border-radius:26px;background:linear-gradient(135deg,#f6dca0,#d9a95a);color:#2a1f0c;font-weight:700;font-size:1rem;box-shadow:0 8px 30px #e9c27a40;transition:transform .15s,opacity .3s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;box-shadow:none}
.ghost{border:0;background:none;color:var(--muted);font-size:.875rem;padding:6px 10px}

/* 성별 */
.pick{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(320px,100%)}
.pick button{height:120px;border-radius:20px;border:1px solid #ffffff22;background:#ffffff08;backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--serif);font-size:1.25rem;transition:border-color .3s,background .3s,transform .2s}
.pick button small{font-family:var(--sans);font-size:.75rem;color:var(--muted)}
.pick button .glyph{font-size:1.5rem;color:var(--gold-2);opacity:.8}
.pick button.on{border-color:var(--gold);background:#e9c27a1f;transform:translateY(-3px)}

/* 생년월일: 세 칸 */
.cal{margin-top:24px;display:inline-flex;padding:3px;border-radius:20px;background:#ffffff12}
.cal button{border:0;background:none;padding:6px 16px;border-radius:17px;font-size:.8125rem;color:var(--muted);transition:background .3s,color .3s}
.cal button.on{background:var(--cream);color:var(--ink);font-weight:700}
.ymd{margin-top:22px;display:flex;align-items:flex-end;justify-content:center;gap:6px}
.ymd label{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.ymd input{height:66px;border:1px solid #ffffff2a;border-radius:16px;background:#ffffff0d;color:var(--cream);font-family:var(--serif);font-size:1.75rem;font-weight:600;text-align:center;outline:0;font-variant-numeric:tabular-nums;transition:border-color .3s,background .3s,box-shadow .3s}
.ymd input:focus{border-color:var(--gold);background:#e9c27a14;box-shadow:0 0 0 4px #e9c27a1f}
.ymd input.ok{border-color:#e9c27a99}
.ymd .y{width:104px}.ymd .m,.ymd .d{width:66px}
.ymd .dot{padding-bottom:30px;color:#ffffff40;font-size:1.25rem}
.echo{min-height:1.5em;margin:20px 0 0;font-family:var(--serif);font-size:1rem;color:var(--gold-2);opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.echo.on{opacity:1;transform:none}
.echo.bad{color:#f0a08a}

/* 시간: 12지 시계 */
.dial-wrap{position:relative;margin-top:18px;width:min(270px,72vw);aspect-ratio:1}
.dial{width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.dial .rim{fill:none;stroke:#ffffff26;stroke-width:1}
.dial .sec{fill:transparent;stroke:#ffffff14;stroke-width:1;transition:fill .3s}
.dial .sec.on{fill:#e9c27a2e}
.dial .zh{fill:#ffffffb3;font-family:var(--serif);font-size:15px;text-anchor:middle;dominant-baseline:central;transition:fill .3s}
.dial .zh.on{fill:var(--gold-2)}
.dial .mark{fill:#ffffff59;font-size:9px;text-anchor:middle;dominant-baseline:central;letter-spacing:.05em}
.dial .orb{transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.dial .orb circle.halo{fill:url(#orbGlow)}
.dial .orb text{font-size:18px;text-anchor:middle;dominant-baseline:central}
.dial-center{position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle,#0b1026b3 0,#0b102680 60%,#0b102600 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dial-center b{font-family:var(--serif);font-size:1.0625rem;font-weight:600;line-height:1.4;color:var(--cream);word-break:keep-all}
.dial-center small{margin-top:4px;font-size:.75rem;color:var(--gold)}
.dial-hint{margin:8px 0 0;font-size:.75rem;color:var(--muted)}
.row-links{display:flex;align-items:center;gap:8px;color:transparent}
.row-links .ghost,.p3 .ghost{padding:7px 14px;border-radius:16px;background:#0b10265c;color:var(--cream);backdrop-filter:blur(4px)}
.exact{display:flex;align-items:center;gap:8px;margin-top:4px}
.exact input{width:110px;height:42px;border:1px solid #ffffff2a;border-radius:12px;background:#ffffff0d;color:var(--cream);text-align:center;font-size:1.0625rem;letter-spacing:.08em;outline:0}
.exact input:focus{border-color:var(--gold)}

/* 완성 */
.final .q{font-size:1.5rem}
.glyphs{margin-top:26px;display:flex;gap:10px}
.gcol{display:flex;flex-direction:column;align-items:center;gap:6px}.gcol em{font-style:normal;font-size:.6875rem;color:#ffffff80}
.glyphs span{width:44px;height:58px;border-radius:12px;border:1px solid #e9c27a66;background:#e9c27a12;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);color:var(--gold-2);font-size:1.375rem;opacity:0;transform:translateY(-16px)}
.glyphs span small{font-family:var(--sans);font-size:.625rem;color:#ffffff80;margin-top:2px}
.page.on .glyphs span{animation:drop .5s var(--d) cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{to{opacity:1;transform:none}}

/* 별똥: 입력한 자리에서 별자리로 날아가요 */
.spark{position:fixed;z-index:20;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff6d8;box-shadow:0 0 12px 4px #f3c46b;pointer-events:none}

.proto-note{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;font-size:.6875rem;color:#ffffff55;white-space:nowrap}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="t-base"></i><i class="t-night"></i><i class="t-dawn"></i><i class="t-morning"></i><i class="t-day"></i><i class="t-evening"></i></div>
<div class="dust" aria-hidden="true" id="dust"></div>
<div class="book" id="book" aria-hidden="true"><img src="/assets/brand/home-hero.webp" alt=""></div>

<div class="app">
  <div class="top"><span class="brand">별첩사주</span><button type="button" id="back" hidden>이전</button></div>
  <div class="cons" id="cons" aria-hidden="true"></div>

  <div class="pages" id="pages">
    <!-- 1. 이름 -->
    <section class="page" data-page="0">
      <p class="kicker">첫째 장</p>
      <h1 class="q">어떻게 불러 드릴까요?</h1>
      <p class="sub">풀이에서 부를 이름이에요. 비워 둬도 돼요.</p>
      <input class="line-input" id="name" type="text" maxlength="12" placeholder="이름 또는 별명" autocomplete="off" enterkeyhint="next">
      <div class="actions"><button class="btn" type="button" data-next>다음</button><button class="ghost" type="button" data-next>이름 없이 볼게요</button></div>
    </section>

    <!-- 2. 성별 -->
    <section class="page" data-page="1">
      <p class="kicker">둘째 장</p>
      <h1 class="q" data-hello>성별을 알려 주세요</h1>
      <p class="sub">10년마다 바뀌는 큰 흐름을 계산할 때 써요.</p>
      <div class="pick" id="gender"><button type="button" data-val="f"><span class="glyph">☽</span>여성</button><button type="button" data-val="m"><span class="glyph">☉</span>남성</button></div>
    </section>

    <!-- 3. 생년월일 -->
    <section class="page" data-page="2">
      <p class="kicker">셋째 장</p>
      <h1 class="q">언제 태어났나요?</h1>
      <div class="cal" id="cal"><button type="button" class="on" data-val="solar">양력</button><button type="button" data-val="lunar">음력</button></div>
      <div class="ymd">
        <label><input class="y" id="yy" inputmode="numeric" maxlength="4" placeholder="1994" autocomplete="off" aria-label="태어난 해">년</label>
        <span class="dot">.</span>
        <label><input class="m" id="mm" inputmode="numeric" maxlength="2" placeholder="05" autocomplete="off" aria-label="태어난 달">월</label>
        <span class="dot">.</span>
        <label><input class="d" id="dd" inputmode="numeric" maxlength="2" placeholder="12" autocomplete="off" aria-label="태어난 날">일</label>
      </div>
      <p class="echo" id="echo" aria-live="polite"></p>
    </section>

    <!-- 4. 태어난 시간 -->
    <section class="page" data-page="3">
      <p class="kicker">넷째 장</p>
      <h1 class="q">몇 시쯤 태어났나요?</h1>
      <div class="dial-wrap">
        <svg class="dial" id="dial" viewBox="-150 -150 300 300" role="slider" aria-label="태어난 시간대" tabindex="0">
          <defs><radialGradient id="orbGlow"><stop offset="0" stop-color="#fff6d8"/><stop offset=".35" stop-color="#f3c46b" stop-opacity=".9"/><stop offset="1" stop-color="#f3c46b" stop-opacity="0"/></radialGradient></defs>
          <g id="secs"></g>
          <circle class="rim" r="138"/><circle class="rim" r="96"/>
          <text class="mark" x="0" y="-146">낮 12시</text><text class="mark" x="0" y="147">자정</text>
          <g class="orb" id="orb"><circle class="halo" r="22"/><text id="orbIcon">☀</text></g>
        </svg>
        <div class="dial-center"><b id="bandRange">해나 달을 돌려 보세요</b><small id="bandName"></small></div>
      </div>
      <p class="dial-hint">원 위를 누르거나 돌려서 골라요</p>
      <div class="actions" style="margin-top:16px"><button class="btn" type="button" id="timeOk" disabled>이 시간으로</button><div class="row-links"><button class="ghost" type="button" id="timeUnknown">시간을 몰라요</button><span>·</span><button class="ghost" type="button" id="exactToggle">분까지 알아요</button></div><div class="exact" id="exact" hidden><input id="exactIn" inputmode="numeric" maxlength="5" placeholder="08 30" autocomplete="off" aria-label="태어난 시각"></div></div>
    </section>

    <!-- 5. 완성 -->
    <section class="page final" data-page="4">
      <p class="kicker">별자리 완성</p>
      <h1 class="q" id="finalQ">여덟 글자가 모였어요</h1>
      <div class="glyphs" id="glyphs"></div>
      <p class="sub" id="finalSub">이 여덟 글자로 풀이를 펼칠게요.</p>
      <div class="actions"><button class="btn" type="button" id="restart">풀이 보기</button></div>
    </section>
  </div>
</div>
<p class="proto-note">시안 화면이에요 · 실제 서비스에는 아직 반영 전이에요</p>

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s);},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var S={name:'',gender:'',lunar:false,y:0,m:0,d:0,time:'',unknown:false,page:0};

/* 배경 잔별 */
(function(){var h='';for(var i=0;i<46;i++){h+='<b style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*62).toFixed(1)+'%;--t:'+(2+Math.random()*4).toFixed(1)+'s;--d:-'+(Math.random()*4).toFixed(1)+'s;transform:scale('+(0.6+Math.random()*0.9).toFixed(2)+')"></b>';}$('#dust').innerHTML=h;})();

/* 별자리: 년·월·일·시 두 개씩 */
var PTS=[[5,36],[17,70],[30,28],[42,74],[57,62],[69,24],[82,66],[95,32]];
(function(){
  var c=$('#cons'),svg='<svg viewBox="0 0 100 100" preserveAspectRatio="none">';
  for(var i=0;i<7;i++){var a=PTS[i],b=PTS[i+1];svg+='<line data-l="'+i+'" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" vector-effect="non-scaling-stroke"/>';}
  svg+='</svg>';
  var st=PTS.map(function(p,i){return '<span class="st" data-s="'+i+'" style="left:'+p[0]+'%;top:'+p[1]+'%"></span>';}).join('');
  var lb=['년','월','일','시'].map(function(t,i){return '<span class="lb" data-lb="'+i+'" style="left:'+((PTS[i*2][0]+PTS[i*2+1][0])/2)+'%">'+t+'</span>';}).join('');
  c.innerHTML=svg+st+lb;
  requestAnimationFrame(function(){$$('#cons line').forEach(function(l){var r=c.getBoundingClientRect(),dx=(l.x2.baseVal.value-l.x1.baseVal.value)*r.width/100,dy=(l.y2.baseVal.value-l.y1.baseVal.value)*r.height/100;l.style.setProperty('--len',Math.hypot(dx,dy).toFixed(1));});});
})();
function starEl(i){return $('[data-s="'+i+'"]');}
function lightStar(i,q){
  var s=starEl(i);if(!s||s.classList.contains('on'))return;
  s.classList.remove('q');s.classList.toggle('on',!q);if(q){s.classList.add('q');return;}
  var ring=document.createElement('span');ring.className='ring';ring.style.left=s.style.left;ring.style.top=s.style.top;$('#cons').appendChild(ring);setTimeout(function(){ring.remove();},900);
  var lbi=Math.floor(i/2);if(starEl(lbi*2).classList.contains('on')&&starEl(lbi*2+1).classList.contains('on'))$('[data-lb="'+lbi+'"]').classList.add('on');
  [i-1,i].forEach(function(k){if(k<0||k>6)return;if(starEl(k).classList.contains('on')&&starEl(k+1).classList.contains('on'))$('[data-l="'+k+'"]').classList.add('on');});
}
function unlight(list){list.forEach(function(i){var s=starEl(i);s.classList.remove('on','q');});$$('#cons line').forEach(function(l){var k=+l.dataset.l;if(!(starEl(k).classList.contains('on')&&starEl(k+1).classList.contains('on')))l.classList.remove('on');});$$('[data-lb]').forEach(function(lb){var k=+lb.dataset.lb;if(!(starEl(k*2).classList.contains('on')&&starEl(k*2+1).classList.contains('on')))lb.classList.remove('on');});}
/* 입력한 자리에서 별이 날아올라 별자리에 붙어요 */
function fly(fromEl,stars,done){
  if(reduce){stars.forEach(function(i){lightStar(i);});if(done)done();return;}
  var r=fromEl.getBoundingClientRect(),x0=r.left+r.width/2,y0=r.top+r.height/2;
  stars.forEach(function(i,k){
    var t=starEl(i).getBoundingClientRect(),x1=t.left+t.width/2,y1=t.top+t.height/2;
    var sp=document.createElement('span');sp.className='spark';sp.style.left=x0+'px';sp.style.top=y0+'px';document.body.appendChild(sp);
    var mx=(x1-x0)*0.35+(k?24:-24),my=(y1-y0)*0.55-40;
    var an=sp.animate([{transform:'translate(0,0) scale(.6)',opacity:0},{transform:'translate('+mx+'px,'+my+'px) scale(1.2)',opacity:1,offset:.45},{transform:'translate('+(x1-x0)+'px,'+(y1-y0)+'px) scale(.5)',opacity:.9}],{duration:720,delay:k*140,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
    an.onfinish=function(){sp.remove();lightStar(i);if(k===stars.length-1&&done)done();};
  });
}

/* 책장 넘기기 */
var pages=$$('.page');
function go(n){
  if(n===S.page&&pages[n].classList.contains('on'))return;
  var cur=pages[S.page];if(cur&&n!==S.page){cur.classList.remove('on');cur.classList.add('out');setTimeout(function(){cur.classList.remove('out');},700);}
  S.page=n;pages[n].classList.add('on');
  var b=$('#book');b.classList.remove('turn');void b.offsetWidth;b.classList.add('turn');
  $('#back').hidden=n===0||n===4;
  ['p0','p1','p2','p3','p4'].forEach(function(c,k){document.body.classList.toggle(c,k===n);});
  if(n===1)$('[data-hello]').textContent=S.name?S.name+'님, 성별을 알려 주세요':'성별을 알려 주세요';
  setTimeout(function(){var f=n===0?$('#name'):n===2?firstEmpty():null;if(f)f.focus({preventScroll:true});},n===0?0:520);
  if(n===4)finale();
}
$('#back').addEventListener('click',function(){go(Math.max(0,S.page-1));});

/* 1. 이름 */
$$('[data-page="0"] [data-next]').forEach(function(b){b.addEventListener('click',function(){S.name=b.classList.contains('ghost')?'':$('#name').value.trim();if(b.classList.contains('ghost'))$('#name').value='';$('#name').blur();go(1);});});
$('#name').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();S.name=this.value.trim();this.blur();go(1);}});

/* 2. 성별 */
$('#gender').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;$$('#gender button').forEach(function(x){x.classList.toggle('on',x===b);});S.gender=b.dataset.val;setTimeout(function(){go(2);},420);});

/* 3. 생년월일 */
var yy=$('#yy'),mm=$('#mm'),dd=$('#dd'),echo=$('#echo'),dateTimer=null;
function firstEmpty(){return !yy.value||yy.value.length<4?yy:!mm.value?mm:dd;}
function digits(el){el.value=el.value.replace(/[^0-9]/g,'');return el.value;}
var thisYear=new Date().getFullYear();
function yearOk(){var v=+yy.value;return yy.value.length===4&&v>=1900&&v<=thisYear;}
function monthOk(){var v=+mm.value;return mm.value.length===2&&v>=1&&v<=12;}
function dayOk(){var v=+dd.value;if(dd.value.length!==2||v<1)return false;if(S.lunar)return v<=30;var dt=new Date(+yy.value,+mm.value-1,v);return dt.getMonth()===+mm.value-1&&dt.getDate()===v;}
var GAN='갑을병정무기경신임계',ZHI='자축인묘진사오미신유술해',ZHI_ANI=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
function refreshDate(src){
  var yo=yearOk(),mo=yo&&monthOk(),dok=mo&&dayOk();
  yy.classList.toggle('ok',yo);mm.classList.toggle('ok',monthOk());dd.classList.toggle('ok',dayOk());
  if(yo&&!starEl(0).classList.contains('on'))fly(yy,[0,1]);if(!yo)unlight([0,1]);
  if(mo&&!starEl(2).classList.contains('on'))fly(mm,[2,3]);if(!mo)unlight([2,3]);
  if(dok&&!starEl(4).classList.contains('on'))fly(dd,[4,5]);if(!dok)unlight([4,5]);
  clearTimeout(dateTimer);
  if(dok){
    S.y=+yy.value;S.m=+mm.value;S.d=+dd.value;
    var k=(S.y-4)%12;echo.className='echo on';echo.textContent=(S.lunar?'음력 ':'')+S.y+'년 '+S.m+'월 '+S.d+'일 · '+ZHI_ANI[k]+'띠';
    dd.blur();dateTimer=setTimeout(function(){go(3);},1300);
  }else if(dd.value.length===2||(mm.value.length===2&&!monthOk())||(yy.value.length===4&&!yearOk())){echo.className='echo on bad';echo.textContent='날짜를 다시 확인해 주세요';}
  else{echo.className='echo';}
}
yy.addEventListener('input',function(){digits(yy);if(yy.value.length===4&&yearOk())mm.focus({preventScroll:true});refreshDate();});
mm.addEventListener('input',function(){digits(mm);if(mm.value.length===1&&+mm.value>1)mm.value='0'+mm.value;if(mm.value.length===2&&monthOk())dd.focus({preventScroll:true});refreshDate();});
dd.addEventListener('input',function(){digits(dd);if(dd.value.length===1&&+dd.value>3)dd.value='0'+dd.value;refreshDate();});
[mm,dd].forEach(function(el,i){el.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!el.value){e.preventDefault();var p=i===0?yy:mm;p.focus({preventScroll:true});p.value=p.value.slice(0,-1);refreshDate();}});});
/* 8자리를 한 번에 붙여 넣어도 나눠 넣어요 */
yy.addEventListener('paste',function(e){var t=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'');if(t.length>=8){e.preventDefault();yy.value=t.slice(0,4);mm.value=t.slice(4,6);dd.value=t.slice(6,8);refreshDate();}});
$('#cal').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;$$('#cal button').forEach(function(x){x.classList.toggle('on',x===b);});S.lunar=b.dataset.val==='lunar';refreshDate();});

/* 4. 시간: 12지 시계. 낮 12시가 위, 자정이 아래예요. 자시는 자정을 사이에 두고 둘로 나뉘어요 */
var BANDS=[
 {t:'00:45',name:'자시',zh:'子',range:'자정~새벽 1:30',tone:'night'},{t:'02:30',name:'축시',zh:'丑',range:'새벽 1:30~3:30',tone:'night'},
 {t:'04:30',name:'인시',zh:'寅',range:'새벽 3:30~5:30',tone:'dawn'},{t:'06:30',name:'묘시',zh:'卯',range:'아침 5:30~7:30',tone:'dawn'},
 {t:'08:30',name:'진시',zh:'辰',range:'아침 7:30~9:30',tone:'morning'},{t:'10:30',name:'사시',zh:'巳',range:'오전 9:30~11:30',tone:'morning'},
 {t:'12:30',name:'오시',zh:'午',range:'낮 11:30~1:30',tone:'day'},{t:'14:30',name:'미시',zh:'未',range:'오후 1:30~3:30',tone:'day'},
 {t:'16:30',name:'신시',zh:'申',range:'오후 3:30~5:30',tone:'day'},{t:'18:30',name:'유시',zh:'酉',range:'저녁 5:30~7:30',tone:'evening'},
 {t:'20:30',name:'술시',zh:'戌',range:'저녁 7:30~9:30',tone:'evening'},{t:'22:30',name:'해시',zh:'亥',range:'밤 9:30~11:30',tone:'night'},
 {t:'23:45',name:'자시',zh:'子',range:'밤 11:30~자정',tone:'night'}
];
function minOf(t){var p=t.split(':');return +p[0]*60+ +p[1];}
function angOf(min){return ((min-720)/1440)*360;}           /* 위(낮 12시)에서 시계 방향 */
function minOfAng(a){var m=720+(a/360)*1440;return ((m%1440)+1440)%1440;}
function bandOf(min){if(min<90)return 0;if(min>=1410)return 12;return Math.floor((min-90)/120)+1;}
function pt(a,r){var rad=(a-90)*Math.PI/180;return [Math.cos(rad)*r,Math.sin(rad)*r];}
(function(){
  var g='';
  for(var i=0;i<12;i++){ /* 12지 칸: 子가 23:30~1:30 */
    var a0=angOf(1410+i*120),a1=a0+30,p0=pt(a0,138),p1=pt(a1,138),q1=pt(a1,96),q0=pt(a0,96),mid=pt(a0+15,117);
    g+='<path class="sec" data-z="'+i+'" d="M'+p0[0]+' '+p0[1]+'A138 138 0 0 1 '+p1[0]+' '+p1[1]+'L'+q1[0]+' '+q1[1]+'A96 96 0 0 0 '+q0[0]+' '+q0[1]+'Z"/>';
    g+='<text class="zh" data-zt="'+i+'" x="'+mid[0].toFixed(1)+'" y="'+mid[1].toFixed(1)+'">'+'子丑寅卯辰巳午未申酉戌亥'[i]+'</text>';
  }
  $('#secs').innerHTML=g;
})();
var TONES=['night','dawn','morning','day','evening'];
function setTone(t){$$('.sky i').forEach(function(l){if(l.classList.contains('t-base'))return;l.classList.toggle('on',l.classList.contains('t-'+t));});}
function selectBand(i,exactMin){
  var b=BANDS[i],min=exactMin!=null?exactMin:minOf(b.t);
  S.time=exactMin!=null?String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'):b.t;S.unknown=false;
  var p=pt(angOf(min),146);$('#orb').style.transform='translate('+p[0].toFixed(1)+'px,'+p[1].toFixed(1)+'px)';
  var day=min>=360&&min<1080;$('#orbIcon').textContent=day?'☀':'☾';
  var zi=i===12?0:i;$$('.sec').forEach(function(s){s.classList.toggle('on',+s.dataset.z===zi);});$$('.zh').forEach(function(s){s.classList.toggle('on',+s.dataset.zt===zi);});
  $('#bandRange').textContent=b.range;$('#bandName').textContent=b.name+(exactMin!=null?' · '+S.time:'');
  setTone(b.tone);$('#timeOk').disabled=false;$('#dial').setAttribute('aria-valuetext',b.range+' '+b.name);
}
selectBand(6);$('#timeOk').disabled=true;$('#bandRange').textContent='해를 돌려 보세요';$('#bandName').textContent='지금은 낮 12시쯤';setTone('');S.time='';
var dial=$('#dial'),dragging=false;
function fromPointer(e){var r=dial.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);var a=Math.atan2(y,x)*180/Math.PI+90;if(a<0)a+=360;var min=minOfAng(a);selectBand(bandOf(min));if(navigator.vibrate)try{navigator.vibrate(4);}catch(_){}}
dial.addEventListener('pointerdown',function(e){dragging=true;dial.setPointerCapture(e.pointerId);fromPointer(e);});
dial.addEventListener('pointermove',function(e){if(dragging)fromPointer(e);});
dial.addEventListener('pointerup',function(){dragging=false;});
dial.addEventListener('keydown',function(e){var cur=S.time?bandOf(minOf(S.time)):6;if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();selectBand((cur+1)%13);}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();selectBand((cur+12)%13);}});
$('#timeOk').addEventListener('click',function(){fly($('#dial'),[6,7],function(){setTimeout(function(){go(4);},350);});});
$('#timeUnknown').addEventListener('click',function(){S.unknown=true;S.time='';lightStar(6,true);lightStar(7,true);setTone('night');setTimeout(function(){go(4);},400);});
$('#exactToggle').addEventListener('click',function(){var x=$('#exact');x.hidden=!x.hidden;if(!x.hidden)$('#exactIn').focus({preventScroll:true});});
$('#exactIn').addEventListener('input',function(){var dg=this.value.replace(/[^0-9]/g,'');if(dg.length===3)dg='0'+dg;if(dg.length<4)return;var h=+dg.slice(0,2),mi=+dg.slice(2,4);if(h>23||mi>59)return;var min=h*60+mi;selectBand(bandOf(min),min);});

/* 5. 완성: 별자리가 다 이어지고 여덟 글자가 떨어져요 (시안에서는 년주만 계산하고 나머지는 예시 글자예요) */
function finale(){
  var who=S.name?S.name+'님의':'나의';
  $('#finalQ').textContent=who+' 별자리가 완성됐어요';
  var yk=(S.y||1994)-4,yg=GAN[((yk%10)+10)%10],yz=ZHI[((yk%12)+12)%12];
  var cols=[['시',S.unknown?['?','?']:['병','진']],['일',['무','술']],['월',['기','사']],['년',[yg,yz]]];
  $('#glyphs').innerHTML=cols.map(function(c,i){var d=0.35+(3-i)*0.2;return '<div class="gcol"><span style="--d:'+d.toFixed(2)+'s">'+c[1][0]+'</span><span style="--d:'+(d+0.1).toFixed(2)+'s">'+c[1][1]+'</span><em>'+c[0]+'</em></div>';}).join('');setTone('night');
  $('#finalSub').textContent=S.unknown?'태어난 시간 없이 여섯 글자로 풀어 볼게요.':'이 여덟 글자로 풀이를 펼칠게요.';
}
$('#restart').addEventListener('click',function(){location.reload();});

/* 키보드가 올라오면 아래 책을 치워서 입력칸이 가려지지 않게 해요 */
if(window.visualViewport){var vv=window.visualViewport;vv.addEventListener('resize',function(){document.body.classList.toggle('kb',vv.height<window.innerHeight*0.78);});}
document.addEventListener('focusin',function(e){if(e.target.matches('input'))document.body.classList.add('kb');});
document.addEventListener('focusout',function(){setTimeout(function(){if(!document.activeElement||!document.activeElement.matches('input'))document.body.classList.remove('kb');},120);});

window.addEventListener('scroll',function(){if(window.scrollX)window.scrollTo(0,window.scrollY);});
$('.pages').addEventListener('scroll',function(){this.scrollLeft=0;});
go(0);
})();
