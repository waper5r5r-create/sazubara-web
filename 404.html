<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 · 별첩사주</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;}
  body{font-family:'Noto Sans KR',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:linear-gradient(160deg,#252e66 0%,#151b43 55%,#0f1331 100%);color:#f6ecd6;text-align:center;padding:24px;box-sizing:border-box;letter-spacing:-.02em;}
  .box{max-width:320px;width:100%;line-height:1.7;}
  h1{margin:0 0 8px;font-family:'Noto Serif KR',serif;font-size:1.25rem;font-weight:600;word-break:keep-all;}
  p{margin:0 0 24px;font-size:.9375rem;color:#d6d9e6;word-break:keep-all;}
  a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;font-weight:700;text-decoration:none;box-sizing:border-box;margin-bottom:10px;}
  .go{background:#d9b060;color:#1a1436;}
  .sub{color:#e9c47a;border:1px solid #ffffff33;}
</style>
</head>
<body>
  <div class="box">
    <h1>찾는 페이지가 없어요</h1>
    <p>주소가 바뀌었거나 잘못 입력된 것 같아요.</p>
    <a class="go" href="/">별첩사주 홈으로</a>
    <a class="sub" href="/#reports">콘텐츠 둘러보기</a>
  </div>
</body>
</html>
