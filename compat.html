<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 궁합 링크(광고·공유용). 카톡·인스타가 읽는 미리보기만 궁합용으로 따로 두고, 사람은 바로 궁합 화면으로 보낸다.
     초대 코드(?invite=)가 있으면 초대 첫 화면으로, 없으면 궁합 탭(/?compat)으로 간다. 광고 꼬리표(utm_ 등)는 그대로 넘긴다. -->
<title>그 사람과 나, 얼마나 잘 맞을까? · 별첩사주 궁합</title>
<meta name="description" content="생일만 넣으면 둘이 잘 맞는 점과 엇갈리는 점을 무료로 볼 수 있어요. 별첩사주 궁합.">
<link rel="canonical" href="https://www.byeolcheop.com/compat">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.byeolcheop.com/compat">
<meta property="og:site_name" content="별첩사주">
<meta property="og:title" content="그 사람과 나, 얼마나 잘 맞을까? · 별첩사주 궁합">
<meta property="og:description" content="생일만 넣으면 둘이 잘 맞는 점과 엇갈리는 점을 무료로 볼 수 있어요.">
<meta property="og:image" content="https://www.byeolcheop.com/og-compat-v1.jpg">
<meta property="og:image:alt" content="별자리 위에 놓인 호랑이와 수달 카드, 그 사람과 나 얼마나 잘 맞을까">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="그 사람과 나, 얼마나 잘 맞을까? · 별첩사주 궁합">
<meta name="twitter:image" content="https://www.byeolcheop.com/og-compat-v1.jpg">
<meta name="theme-color" content="#0b1024">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:#0b1024;color:#f3ead6;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;text-align:center}
a{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:12px;background:#e0ad55;color:#2a1f0c;font-weight:700;text-decoration:none}
</style>
<script>
(function(){
  var q = new URLSearchParams(location.search), invite = q.get('invite'), keep = new URLSearchParams();
  q.forEach(function(v, k){ if (k !== 'invite') keep.append(k, v); });
  var dest = invite && /^[A-Za-z0-9_.~-]+$/.test(invite) ? '/?invite=' + encodeURIComponent(invite) : '/?compat';
  var rest = keep.toString();
  location.replace(dest + (rest ? '&' + rest : ''));
})();
</script>
</head>
<body>
<main>
<p>별첩사주 궁합으로 이동하고 있어요.</p>
<a href="/?compat">궁합 보러 가기</a>
</main>
</body>
</html>
