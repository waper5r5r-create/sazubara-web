<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360"><style>
svg{overflow:visible}svg>g:nth-of-type(1){transform-origin:180px 180px;animation:orbit-turn 32s linear infinite}svg>g:nth-of-type(1) ellipse{stroke-dasharray:100 14 2 14;animation:orbit-flow 12s linear infinite}svg>g:nth-of-type(2){transform-origin:180px 180px;animation:core-light 5s ease-in-out infinite}svg>g:nth-of-type(3)>circle{animation:element-light 5s ease-in-out infinite}svg>g:nth-of-type(3)>circle:nth-of-type(2){animation-delay:1s}svg>g:nth-of-type(3)>circle:nth-of-type(3){animation-delay:2s}svg>g:nth-of-type(3)>circle:nth-of-type(4){animation-delay:3s}svg>g:nth-of-type(3)>circle:nth-of-type(5){animation-delay:4s}svg>g:nth-of-type(4)>*{transform-box:fill-box;transform-origin:center;animation:star-light 3.6s ease-in-out infinite}svg>g:nth-of-type(4)>:nth-child(2n){animation-delay:1.8s}.comet{stroke-dasharray:34 510;animation:comet-run 8s linear infinite}.comet.second{animation-delay:-4s;animation-duration:11s}
