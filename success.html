<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 확인 중 · SAZUBARA</title>
<style>
  html,body{margin:0; height:100%;}
  body{
    font-family:'Noto Sans KR',sans-serif; display:flex; align-items:center; justify-content:center;
    height:100vh; background:#eef1f7; color:#1b2033; text-align:center; padding:24px; box-sizing:border-box;
  }
  .box{max-width:320px;}
  .spin{font-size:2rem; margin-bottom:12px;}
  a{color:#9c6b1f; text-decoration:none; font-weight:700;}
</style>
</head>
<body>
  <div class="box">
    <div class="spin">✨</div>
    <p id="msg">결제를 확인하고 있어요...</p>
    <p id="back" hidden><a href="/">홈으로 돌아가기</a></p>
  </div>
  <script>
  (function(){
    var CREDIT_KEY = 'mysaju_credits_v1';
    var params = new URLSearchParams(location.search);
    var paymentKey = params.get('paymentKey');
    var orderId = params.get('orderId');
    var amount = params.get('amount');

    function showError(text){
      document.getElementById('msg').textContent = text;
      document.getElementById('back').hidden = false;
    }

    function readDeviceId(){
      try{
        var raw = localStorage.getItem(CREDIT_KEY);
        if (!raw) return null;
        var d = JSON.parse(raw);
        return d && d.shareCode ? d.shareCode : null;
      }catch(e){ return null; }
    }

    if (!paymentKey || !orderId || !amount){
      showError('결제 정보가 올바르지 않습니다.');
      return;
    }
    var deviceId = readDeviceId();
    if (!deviceId){
      showError('결제 정보를 확인할 수 없습니다. 홈 화면을 먼저 한 번 열어주세요.');
      return;
    }

    fetch('/api/toss/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paymentKey: paymentKey, orderId: orderId, amount: parseInt(amount, 10), deviceId: deviceId })
    }).then(function(r){ return r.json(); }).then(function(data){
      if (data.ok){
        // 실제로 몇 크레딧을 적립했는지는 서버가 정했고, 홈 화면이 /api/credits/pull로 직접 받아갑니다.
        // (URL에 크레딧 숫자를 실어 보내지 않습니다 — 조작 방지)
        location.replace('/?paid=1&order=' + encodeURIComponent(orderId));
      } else {
        showError('결제 승인에 실패했습니다: ' + (data.message || data.error || '알 수 없는 오류'));
      }
    }).catch(function(){
      showError('결제 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    });
  })();
  </script>
</body>
</html>
