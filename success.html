<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 확인 중 · 별첩사주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0; height:100%;}
  body{
    font-family:'Noto Sans KR',sans-serif; display:flex; align-items:center; justify-content:center;
    height:100vh; background:radial-gradient(1.2px 1.2px at 14% 22%,#fff9 50%,transparent 52%),radial-gradient(1px 1px at 30% 72%,#fff6 50%,transparent 52%),radial-gradient(1.4px 1.4px at 52% 14%,#ffe9b0aa 50%,transparent 52%),radial-gradient(1px 1px at 70% 60%,#fff7 50%,transparent 52%),radial-gradient(1.2px 1.2px at 86% 28%,#fff8 50%,transparent 52%),linear-gradient(160deg,#252e66 0%,#151b43 55%,#0f1331 100%);
    color:#f6ecd6; text-align:center; padding:24px; box-sizing:border-box; letter-spacing:-.02em;
  }
  .box{max-width:320px;line-height:1.7;}
  #msg{margin:0 0 20px;font-family:'Noto Serif KR',serif;font-size:1.125rem;font-weight:600;word-break:keep-all;}
  button{border:0;border-radius:14px;min-height:48px;background:#d9b060;color:#1a1436;padding:0 22px;font:inherit;font-weight:700;cursor:pointer;}
  /* 봉함 도장: 확인하는 동안 천천히 숨 쉬듯 움직여요 */
  .spin{position:relative;width:64px;height:64px;margin:0 auto 24px;display:grid;place-items:center;border-radius:11px;background:#b3402f;color:#fff3e2;font:600 2rem/1 'Noto Serif KR',serif;transform:rotate(-5deg);box-shadow:inset 0 0 0 2px #ffffff2e,0 10px 24px #0006;animation:seal 2.4s ease-in-out infinite;}
  .spin::after{content:'';position:absolute;inset:-10px;border-radius:16px;border:1px solid #f0d38c66;animation:ring 2.4s ease-out infinite;}
  @keyframes seal{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(-5deg) scale(1.06)}}
  @keyframes ring{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
  @media (prefers-reduced-motion: reduce){.spin,.spin::after{animation:none}}
  a{color:#e9c47a; text-decoration:underline; text-underline-offset:4px; font-weight:700;}
</style>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true">封</div>
    <p id="msg">결제를 확인하고 있어요...</p>
    <button type="button" id="retry" hidden>결제 확인 다시 시도</button>
    <p id="back" hidden><a href="/">홈으로 돌아가기</a></p>
  </div>
  <script>
  (function(){
    var DEVICE_KEY = 'mysaju_device_v1';
    var LEGACY_CREDIT_KEY = 'mysaju_credits_v1'; // 크레딧 폐지 이전 기기의 shareCode 복구용(마이그레이션)
    var params = new URLSearchParams(location.search);
    var paymentKey = params.get('paymentKey');
    var orderId = params.get('orderId');
    var amount = params.get('amount');
    // 어떤 결제인지는 requestPayment()를 부를 때 successUrl에 미리 실어 보내서,
    // 토스가 paymentKey/orderId/amount를 덧붙여 돌아올 때도 그대로 남아있다.
    // type: 'report'(리포트 건별결제) | 'unlock'(고민상담/프리미엄/궁합상세 등 건별결제)
    var type = params.get('type');
    var conceptId = params.get('conceptId');
    var stage=params.get('stage');
    var quote=params.get('quote');
    var returnTab=params.get('tab');
    var unlockKey = params.get('unlockKey');
    // 토스페이(pv=tp)는 paymentKey 대신 orderNo와 인증 결과(status)를 붙여서 돌려보낸다.
    var viaTossPay = params.get('pv') === 'tp';
    if (viaTossPay){ orderId = params.get('orderNo'); paymentKey = 'tosspay'; amount = '0'; }

    function showError(text){
      document.getElementById('msg').textContent = text;
      document.getElementById('back').hidden = false;
      document.getElementById('retry').hidden=!paymentKey||!orderId||!amount;
      document.getElementById('retry').onclick=function(){location.reload();};
    }

    function readShareCode(raw){
      try{
        if (!raw) return null;
        var d = JSON.parse(raw);
        return d && d.shareCode ? d.shareCode : null;
      }catch(e){ return null; }
    }

    function readDeviceId(){
      return readShareCode(localStorage.getItem(DEVICE_KEY)) || readShareCode(localStorage.getItem(LEGACY_CREDIT_KEY));
    }

    if (viaTossPay && params.get('status') && ['PAY_APPROVED','PAY_COMPLETE'].indexOf(params.get('status')) === -1){
      showError('결제가 완료되지 않았어요.');
      return;
    }
    if (!paymentKey || !orderId || !amount){
      showError('결제 정보가 올바르지 않습니다.');
      return;
    }
    var deviceId = readDeviceId();
    if (!deviceId){
      showError('결제 정보를 확인할 수 없습니다. 홈 화면을 먼저 한 번 열어주세요.');
      return;
    }

    var isReport = (type === 'report' && conceptId);
    var isUnlock = (type === 'unlock' && unlockKey);
    if (!isReport && !isUnlock){
      showError('결제 정보가 올바르지 않습니다.');
      return;
    }
    var endpoint = isReport ? '/api/reports/unlock' : '/api/unlock';
    var body = viaTossPay
      ? (isReport ? { provider: 'tosspay', orderId: orderId, deviceId: deviceId, conceptId: conceptId, stage: stage || 'story' } : { provider: 'tosspay', orderId: orderId, deviceId: deviceId, unlockKey: unlockKey })
      : isReport
      ? { paymentKey: paymentKey, orderId: orderId, amount: parseInt(amount, 10), deviceId: deviceId, conceptId: conceptId, stage: stage || undefined, quote: quote || undefined }
      : { paymentKey: paymentKey, orderId: orderId, amount: parseInt(amount, 10), deviceId: deviceId, unlockKey: unlockKey };

    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(data){
      if (data.ok){
        // 실제로 어떤 리포트/항목을 지급했는지는 서버가 정했고, 홈 화면이
        // /api/unlock 또는 /api/reports/unlock로 직접 받아갑니다(URL로 주고받지 않음 — 조작 방지).
        var back = '/?paid=1&order=' + encodeURIComponent(orderId);
        if (isReport) back += '&report=' + encodeURIComponent(conceptId)+'&stage='+encodeURIComponent(stage||'story');
        if(isUnlock) back+='&tab='+encodeURIComponent(returnTab||'saju');
        location.replace(back);
      } else {
        showError('결제 승인에 실패했습니다: ' + (data.message || data.error || '알 수 없는 오류'));
      }
    }).catch(function(){
      showError('결제 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    });
  })();
  </script>
</body>
</html>
