<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 확인 중 · 별첩사주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0; height:100%;}
  body{
    font-family:'Noto Sans KR',sans-serif; display:flex; align-items:center; justify-content:center;
    height:100vh; background:radial-gradient(1.2px 1.2px at 14% 22%,#fff9 50%,transparent 52%),radial-gradient(1px 1px at 30% 72%,#fff6 50%,transparent 52%),radial-gradient(1.4px 1.4px at 52% 14%,#ffe9b0aa 50%,transparent 52%),radial-gradient(1px 1px at 70% 60%,#fff7 50%,transparent 52%),radial-gradient(1.2px 1.2px at 86% 28%,#fff8 50%,transparent 52%),linear-gradient(160deg,#252e66 0%,#151b43 55%,#0f1331 100%);
    color:#f6ecd6; text-align:center; padding:24px; box-sizing:border-box; letter-spacing:-.02em;
  }
  .box{max-width:320px;line-height:1.7;}
  #msg{margin:0 0 20px;font-family:'Noto Serif KR',serif;font-size:1.125rem;font-weight:600;word-break:keep-all;}
  button{border:0;border-radius:14px;min-height:48px;background:#d9b060;color:#1a1436;padding:0 22px;font:inherit;font-weight:700;cursor:pointer;}
  /* 확인하는 동안 별이 천천히 숨 쉬듯 움직여요 */
  .spin{width:56px;height:56px;margin:0 auto 24px;animation:breathe 2.4s ease-in-out infinite;}
  .spin svg{display:block;width:100%;height:100%;}
  @keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.86)}}
  @media (prefers-reduced-motion: reduce){.spin{animation:none}}
  a{color:#e9c47a; text-decoration:underline; text-underline-offset:4px; font-weight:700;}
  .help{margin-top:28px;padding-top:18px;border-top:1px solid #ffffff22;font-size:.875rem;color:#c9cde0;word-break:keep-all;}
  .help p{margin:0 0 8px;}
  .help .order{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8125rem;color:#f6ecd6;word-break:break-all;user-select:all;-webkit-user-select:all;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2l2.6 7.400L22 12l-7.400 2.600L12 22l-2.600-7.400L2 12l7.400-2.600Z" fill="#f3cf80"/></svg></div>
    <p id="msg">결제를 확인하고 있어요...</p>
    <button type="button" id="retry" hidden>결제 확인 다시 시도</button>
    <p id="back" hidden><a href="/">홈으로 돌아가기</a></p>
    <div id="help" class="help" hidden>
      <p>요금이 빠져나갔는데 콘텐츠가 열리지 않으면, 아래 주문번호와 함께 알려 주세요. 확인한 뒤 연락드릴게요.</p>
      <p class="order" id="order"></p>
      <p><a href="mailto:ieumlab22@gmail.com">ieumlab22@gmail.com</a> · <a href="tel:010-5440-0335">010-5440-0335</a></p>
    </div>
  </div>
  <script>
  (function(){
    var DEVICE_KEY = 'mysaju_device_v1';
    var LEGACY_CREDIT_KEY = 'mysaju_credits_v1'; // 크레딧 폐지 이전 기기의 shareCode 복구용(마이그레이션)
    var params = new URLSearchParams(location.search);
    var paymentKey = params.get('paymentKey');
    var orderId = params.get('orderId');
    var amount = params.get('amount');
    // 어떤 결제인지는 requestPayment()를 부를 때 successUrl에 미리 실어 보내서,
    // 토스가 paymentKey/orderId/amount를 덧붙여 돌아올 때도 그대로 남아있다.
    // type: 'report'(리포트 건별결제) | 'unlock'(고민상담/프리미엄/궁합상세 등 건별결제)
    var type = params.get('type');
    var conceptId = params.get('conceptId');
    var stage=params.get('stage');
    var quote=params.get('quote');
    var returnTab=params.get('tab');
    var unlockKey = params.get('unlockKey');
    // 토스페이(pv=tp)는 paymentKey 대신 orderNo와 인증 결과(status)를 붙여서 돌려보낸다.
    var viaTossPay = params.get('pv') === 'tp';
    if (viaTossPay){ orderId = params.get('orderNo'); paymentKey = 'tosspay'; amount = '0'; }

    // 서버가 돌려준 오류 코드를 손님이 알아들을 말로 바꾼다. 토스가 준 한국어 안내(카드 한도 등)는 그대로 보여 준다.
    var FRIENDLY = {
      INVALID_CHECKOUT: '결제 정보가 맞지 않아 승인하지 않았어요.',
      AMOUNT_MISMATCH: '결제 금액이 맞지 않아 승인하지 않았어요.',
      PAYMENT_MISMATCH: '결제 내용이 맞지 않아 승인하지 않았어요.',
      ALREADY_OWNED: '이미 가지고 계신 콘텐츠예요. 홈에서 바로 보실 수 있어요.',
      ORDER_CONFLICT: '이미 다른 곳에서 확인된 주문이에요.',
      UNLOCK_CONFLICT: '구매 내역을 저장하지 못했어요.',
      UNLOCK_INSERT_FAILED: '구매 내역을 저장하지 못했어요.',
      PAYMENT_UNAVAILABLE: '지금은 결제를 확인할 수 없어요.',
      SERVER_ERROR: '결제를 확인하는 중 문제가 생겼어요.',
      NETWORK: '인터넷 연결이 불안정해 결제를 확인하지 못했어요.'
    };
    function friendly(data){
      var code = data && data.error;
      if (FRIENDLY[code]) return FRIENDLY[code];
      if (data && data.message && /[가-힣]/.test(data.message)) return data.message;
      return '결제를 확인하지 못했어요.';
    }
    // 결제 확인이 실패하면 운영자가 알 수 있게 기록을 남긴다(실패해도 손님 화면에는 영향 없음).
    function logFail(code, message, extra){
      try{
        fetch('/api/pay-log', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code, message: message || '', orderId: orderId, deviceId: deviceId || null, hadLocalDevice: !!localDevice,
            item: (type || '') + ':' + (conceptId || unlockKey || ''), stage: stage || null, extra: extra || null }) }).catch(function(){});
      }catch(e){}
    }
    function showError(text, code){
      var spin = document.querySelector('.spin'); if (spin) spin.hidden = true;
      document.getElementById('msg').textContent = text;
      document.getElementById('back').hidden = false;
      document.getElementById('retry').hidden=!paymentKey||!orderId||!amount||code==='ALREADY_OWNED';
      document.getElementById('retry').onclick=function(){location.reload();};
      if (orderId && code !== 'ALREADY_OWNED'){
        var help = document.getElementById('help');
        help.hidden = false;
        document.getElementById('order').textContent = orderId;
      }
    }
    var deviceId = null, localDevice = null;

    function readShareCode(raw){
      try{
        if (!raw) return null;
        var d = JSON.parse(raw);
        return d && d.shareCode ? d.shareCode : null;
      }catch(e){ return null; }
    }

    function readDeviceId(){
      return readShareCode(localStorage.getItem(DEVICE_KEY)) || readShareCode(localStorage.getItem(LEGACY_CREDIT_KEY));
    }

    if (viaTossPay && params.get('status') && ['PAY_APPROVED','PAY_COMPLETE'].indexOf(params.get('status')) === -1){
      showError('결제가 완료되지 않았어요.');
      return;
    }
    if (!paymentKey || !orderId || !amount){
      showError('결제 정보가 올바르지 않습니다.');
      return;
    }
    // 결제를 시작한 기기를 먼저 쓴다. 카드사 앱을 거쳐 다른 브라우저로 돌아오면 그 브라우저의 기기 정보가 달라서
    // 승인이 거절되던 문제를 막는다. 콘텐츠 결제는 서버가 서명한 견적(quote) 안의 기기라 바꿔치기할 수 없다.
    function quoteDevice(q){
      try{
        var p = String(q||'').split('.')[0].replace(/-/g,'+').replace(/_/g,'/');
        while (p.length % 4) p += '=';
        var o = JSON.parse(decodeURIComponent(escape(atob(p))));
        return typeof o.deviceId === 'string' ? o.deviceId : null;
      }catch(e){ return null; }
    }
    var urlDevice = params.get('device');
    if (urlDevice && !/^[A-Za-z0-9_.~-]{4,64}$/.test(urlDevice)) urlDevice = null;
    localDevice = readDeviceId();
    deviceId = quoteDevice(quote) || urlDevice || localDevice;
    if (!deviceId){
      showError('결제한 기기 정보를 찾지 못했어요. 결제를 시작한 앱이나 브라우저에서 다시 열어 주세요.', 'NO_DEVICE');
      logFail('NO_DEVICE');
      return;
    }
    // 결제한 곳과 돌아온 곳이 다른 경우가 얼마나 되는지 알 수 있게 함께 기록한다(승인은 결제한 기기로 진행).
    if (localDevice && localDevice !== deviceId) logFail('DEVICE_SWITCHED', '', 'local:' + localDevice);

    var isReport = (type === 'report' && conceptId);
    var isUnlock = (type === 'unlock' && unlockKey);
    if (!isReport && !isUnlock){
      showError('결제 정보가 올바르지 않습니다.');
      return;
    }
    var endpoint = isReport ? '/api/reports/unlock' : '/api/unlock';
    var body = viaTossPay
      ? (isReport ? { provider: 'tosspay', orderId: orderId, deviceId: deviceId, conceptId: conceptId, stage: stage || 'story' } : { provider: 'tosspay', orderId: orderId, deviceId: deviceId, unlockKey: unlockKey })
      : isReport
      ? { paymentKey: paymentKey, orderId: orderId, amount: parseInt(amount, 10), deviceId: deviceId, conceptId: conceptId, stage: stage || undefined, quote: quote || undefined }
      : { paymentKey: paymentKey, orderId: orderId, amount: parseInt(amount, 10), deviceId: deviceId, unlockKey: unlockKey };

    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(data){
      if (data.ok){
        // 실제로 어떤 리포트/항목을 지급했는지는 서버가 정했고, 홈 화면이
        // /api/unlock 또는 /api/reports/unlock로 직접 받아갑니다(URL로 주고받지 않음 — 조작 방지).
        var back = '/?paid=1&order=' + encodeURIComponent(orderId);
        if (isReport) back += '&report=' + encodeURIComponent(conceptId)+'&stage='+encodeURIComponent(stage||'story');
        if(isUnlock) back+='&tab='+encodeURIComponent(returnTab||'saju');
        location.replace(back);
      } else {
        showError(friendly(data), data.error);
        logFail(data.error || 'UNKNOWN', data.message);
      }
    }).catch(function(e){
      showError(FRIENDLY.NETWORK + ' 아래 버튼으로 다시 확인해 주세요.', 'NETWORK');
      logFail('NETWORK', String(e && e.message || ''));
    });
  })();
  </script>
</body>
</html>
