<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 확인 중 · 별첩사주</title>
<style>
  html,body{margin:0; height:100%;}
  body{
    font-family:'Noto Sans KR',sans-serif; display:flex; align-items:center; justify-content:center;
    height:100vh; background:#0c1222; color:#e7eaf0; text-align:center; padding:24px; box-sizing:border-box;
  }
  .box{max-width:320px;line-height:1.8;}
  button{border:0;border-radius:12px;background:#e8b96d;color:#20180e;padding:12px 18px;font:inherit;cursor:pointer;}
  .spin{font-size:2rem; margin-bottom:12px;}
  a{color:#9c6b1f; text-decoration:none; font-weight:700;}
</style>
</head>
<body>
  <div class="box">
    <div class="spin">✨</div>
    <p id="msg">결제를 확인하고 있어요...</p>
    <button type="button" id="retry" hidden>결제 확인 다시 시도</button>
    <p id="back" hidden><a href="/">홈으로 돌아가기</a></p>
  </div>
  <script>
  (function(){
    var DEVICE_KEY = 'mysaju_device_v1';
    var LEGACY_CREDIT_KEY = 'mysaju_credits_v1'; // 크레딧 폐지 이전 기기의 shareCode 복구용(마이그레이션)
    var params = new URLSearchParams(location.search);
    var paymentKey = params.get('paymentKey');
    var orderId = params.get('orderId');
    var amount = params.get('amount');
    // 어떤 결제인지는 requestPayment()를 부를 때 successUrl에 미리 실어 보내서,
    // 토스가 paymentKey/orderId/amount를 덧붙여 돌아올 때도 그대로 남아있다.
    // type: 'report'(리포트 건별결제) | 'unlock'(고민상담/프리미엄/궁합상세 등 건별결제)
    var type = params.get('type');
    var conceptId = params.get('conceptId');
    var stage=params.get('stage');
    var quote=params.get('quote');
    var returnTab=params.get('tab');
    var unlockKey = params.get('unlockKey');

    function showError(text){
      document.getElementById('msg').textContent = text;
      document.getElementById('back').hidden = false;
      document.getElementById('retry').hidden=!paymentKey||!orderId||!amount;
      document.getElementById('retry').onclick=function(){location.reload();};
    }

    function readShareCode(raw){
      try{
        if (!raw) return null;
        var d = JSON.parse(raw);
        return d && d.shareCode ? d.shareCode : null;
      }catch(e){ return null; }
    }

    function readDeviceId(){
      return readShareCode(localStorage.getItem(DEVICE_KEY)) || readShareCode(localStorage.getItem(LEGACY_CREDIT_KEY));
    }

    if (!paymentKey || !orderId || !amount){
      showError('결제 정보가 올바르지 않습니다.');
      return;
    }
    var deviceId = readDeviceId();
    if (!deviceId){
      showError('결제 정보를 확인할 수 없습니다. 홈 화면을 먼저 한 번 열어주세요.');
      return;
    }

    var isReport = (type === 'report' && conceptId);
    var isUnlock = (type === 'unlock' && unlockKey);
    if (!isReport && !isUnlock){
      showError('결제 정보가 올바르지 않습니다.');
      return;
    }
    var endpoint = isReport ? '/api/reports/unlock' : '/api/unlock';
    var body = isReport
      ? { paymentKey: paymentKey, orderId: orderId, amount: parseInt(amount, 10), deviceId: deviceId, conceptId: conceptId, stage: stage || undefined, quote: quote || undefined }
      : { paymentKey: paymentKey, orderId: orderId, amount: parseInt(amount, 10), deviceId: deviceId, unlockKey: unlockKey };

    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(data){
      if (data.ok){
        // 실제로 어떤 리포트/항목을 지급했는지는 서버가 정했고, 홈 화면이
        // /api/unlock 또는 /api/reports/unlock로 직접 받아갑니다(URL로 주고받지 않음 — 조작 방지).
        var back = '/?paid=1&order=' + encodeURIComponent(orderId);
        if (isReport) back += '&report=' + encodeURIComponent(conceptId)+'&stage='+encodeURIComponent(stage||'story');
        if(isUnlock) back+='&tab='+encodeURIComponent(returnTab||'saju');
        location.replace(back);
      } else {
        showError('결제 승인에 실패했습니다: ' + (data.message || data.error || '알 수 없는 오류'));
      }
    }).catch(function(){
      showError('결제 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    });
  })();
  </script>
</body>
</html>
