<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 확인 중 · SAZUBARA</title>
<style>
  html,body{margin:0; height:100%;}
  body{
    font-family:'Noto Sans KR',sans-serif; display:flex; align-items:center; justify-content:center;
    height:100vh; background:#eef1f7; color:#1b2033; text-align:center; padding:24px; box-sizing:border-box;
  }
  .box{max-width:320px;}
  .spin{font-size:2rem; margin-bottom:12px;}
  a{color:#9c6b1f; text-decoration:none; font-weight:700;}
</style>
</head>
<body>
  <div class="box">
    <div class="spin">✨</div>
    <p id="msg">결제를 확인하고 있어요...</p>
    <p id="back" hidden><a href="/">홈으로 돌아가기</a></p>
  </div>
  <script>
  (function(){
    var CREDIT_KEY = 'mysaju_credits_v1';
    var params = new URLSearchParams(location.search);
    var paymentKey = params.get('paymentKey');
    var orderId = params.get('orderId');
    var amount = params.get('amount');
    // 리포트 건별 결제는 requestPayment()를 부를 때 successUrl에 이 두 값을 미리 실어 보내서,
    // 토스가 paymentKey/orderId/amount를 덧붙여 돌아올 때도 그대로 남아있다.
    var type = params.get('type'); // 'report'면 리포트 건별 결제, 없으면 기존 크레딧 충전
    var conceptId = params.get('conceptId');

    function showError(text){
      document.getElementById('msg').textContent = text;
      document.getElementById('back').hidden = false;
    }

    function readDeviceId(){
      try{
        var raw = localStorage.getItem(CREDIT_KEY);
        if (!raw) return null;
        var d = JSON.parse(raw);
        return d && d.shareCode ? d.shareCode : null;
      }catch(e){ return null; }
    }

    if (!paymentKey || !orderId || !amount){
      showError('결제 정보가 올바르지 않습니다.');
      return;
    }
    var deviceId = readDeviceId();
    if (!deviceId){
      showError('결제 정보를 확인할 수 없습니다. 홈 화면을 먼저 한 번 열어주세요.');
      return;
    }

    var isReport = (type === 'report' && conceptId);
    var endpoint = isReport ? '/api/reports/unlock-confirm' : '/api/toss/confirm';
    var body = isReport
      ? { paymentKey: paymentKey, orderId: orderId, amount: parseInt(amount, 10), deviceId: deviceId, conceptId: conceptId }
      : { paymentKey: paymentKey, orderId: orderId, amount: parseInt(amount, 10), deviceId: deviceId };

    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(data){
      if (data.ok){
        // 실제로 몇 크레딧을 적립했는지 / 어떤 리포트를 지급했는지는 서버가 정했고, 홈 화면이
        // /api/credits/pull 또는 /api/reports/unlocks로 직접 받아갑니다(URL로 주고받지 않음 — 조작 방지).
        var back = '/?paid=1&order=' + encodeURIComponent(orderId);
        if (isReport) back += '&report=' + encodeURIComponent(conceptId);
        location.replace(back);
      } else {
        showError('결제 승인에 실패했습니다: ' + (data.message || data.error || '알 수 없는 오류'));
      }
    }).catch(function(){
      showError('결제 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    });
  })();
  </script>
</body>
</html>
